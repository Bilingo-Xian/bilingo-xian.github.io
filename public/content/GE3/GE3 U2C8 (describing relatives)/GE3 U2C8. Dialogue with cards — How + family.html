<!DOCTYPE html><html><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 Two Words, One Person</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
h1 { color: white; font-size: 2em; margin-bottom: 4px; text-align: center; }
.subtitle { color: rgba(255,255,255,0.8); margin-bottom: 20px; font-size: 1.05em; text-align: center; }

.game-area {
  display: flex;
  gap: 20px;
  width: 100%;
  max-width: 840px;
  margin-bottom: 22px;
}
.student-side {
  flex: 1;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(5px);
  border-radius: 20px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  border: 2px solid rgba(255,255,255,0.15);
}
.student-label {
  color: white;
  font-weight: bold;
  font-size: 1.05em;
  text-align: center;
}
.cards-row { display: flex; gap: 12px; justify-content: center; }
.card-slot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.card-label {
  color: rgba(255,255,255,0.85);
  font-weight: bold;
  font-size: 0.72em;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.card {
  width: 110px;
  height: 140px;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  user-select: none;
}
.card:hover:not(.revealed):not(.disabled) {
  transform: translateY(-5px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}
.card.face-down {
  background: linear-gradient(135deg, #ff6b6b, #ee5a24);
  color: white;
  font-size: 2.8em;
}
.card.revealed {
  background: white;
  color: #333;
  animation: flipIn 0.5s ease;
}
.card.disabled { opacity: 0.4; cursor: not-allowed; }
.card .emoji { font-size: 2.2em; margin-bottom: 3px; }
.card .text { font-size: 0.92em; text-align: center; padding: 0 4px; }

.reveal-btn {
  background: #fdcb6e;
  color: #2d3436;
  border: none;
  padding: 11px 26px;
  font-size: 0.95em;
  border-radius: 50px;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.3s, transform 0.2s;
  box-shadow: 0 3px 12px rgba(253,203,110,0.4);
}
.reveal-btn:hover:not(:disabled) { background: #feca57; transform: scale(1.05); }
.reveal-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.speech-bubble {
  background: white;
  border-radius: 16px;
  padding: 14px 16px;
  font-size: 1.1em;
  font-weight: bold;
  text-align: center;
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  color: #2d3436;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  line-height: 1.45;
  white-space: normal;
  word-spacing: 0.15em;
}
.speech-bubble.complete {
  border: 3px solid #fdcb6e;
  animation: bounceIn 0.4s ease;
}
.speech-bubble .placeholder {
  color: #b2bec3;
  font-weight: normal;
  font-size: 0.85em;
}
.speech-bubble .w1 { color: #e17055; }
.speech-bubble .w2 { color: #0984e3; }

@keyframes flipIn {
  0% { transform: rotateY(90deg); }
  100% { transform: rotateY(0deg); }
}
@keyframes bounceIn {
  0% { transform: scale(0.9); }
  50% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

.btn-reset {
  background: #00b894;
  color: white;
  border: none;
  padding: 14px 38px;
  font-size: 1.1em;
  border-radius: 50px;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.3s, transform 0.2s;
  box-shadow: 0 4px 15px rgba(0,184,148,0.4);
}
.btn-reset:hover { background: #00a884; transform: scale(1.05); }

.confetti { position: fixed; top: -10px; font-size: 1.5em; animation: fall linear forwards; pointer-events: none; z-index: 999; }
@keyframes fall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}

@media (max-width: 600px) {
  .game-area { flex-direction: column; gap: 16px; }
  .card { width: 90px; height: 118px; }
  .card .emoji { font-size: 1.9em; }
  .card .text { font-size: 0.8em; }
  .card.face-down { font-size: 2.2em; }
  h1 { font-size: 1.5em; }
  .student-side { padding: 14px; }
  .speech-bubble { font-size: 1em; }
}
</style>
</head>
<body>

<h1>🎲 Two Words, One Person</h1>
<p class="subtitle">Student 1 asks, Student 2 answers!</p>

<div class="game-area">
  <div class="student-side">
    <div class="student-label">🙋 Student 1 — Ask!</div>
    <div class="cards-row">
      <div class="card-slot">
        <div class="card-label">👤 NAME</div>
        <div class="card face-down" id="card-name" onclick="draw('name')">❓</div>
      </div>
      <div class="card-slot">
        <div class="card-label">👨‍👩‍👧 FAMILY</div>
        <div class="card face-down disabled" id="card-family" onclick="draw('family')">❓</div>
      </div>
    </div>
    <button class="reveal-btn" id="btn-question" disabled="" onclick="revealQuestion()">🔍 Reveal Question</button>
    <div class="speech-bubble" id="question-bubble">
      <span class="placeholder">👆 Flip the cards first!</span>
    </div>
  </div>

  <div class="student-side">
    <div class="student-label">🙋‍♂️ Student 2 — Answer!</div>
    <div class="cards-row">
      <div class="card-slot">
        <div class="card-label">⭐ WORD 1</div>
        <div class="card face-down disabled" id="card-adj1" onclick="draw('adj1')">❓</div>
      </div>
      <div class="card-slot">
        <div class="card-label">⭐ WORD 2</div>
        <div class="card face-down disabled" id="card-adj2" onclick="draw('adj2')">❓</div>
      </div>
    </div>
    <button class="reveal-btn" id="btn-answer" disabled="" onclick="revealAnswer()">🔍 Reveal Answer</button>
    <div class="speech-bubble" id="answer-bubble">
      <span class="placeholder">Wait for the question!</span>
    </div>
  </div>
</div>

<button class="btn-reset" onclick="reset()">🔄 Draw Again!</button>

<script>
var names = [
  { text: "Lele's", emoji: "👧", color: "#fce4ec" },
  { text: "Nani's", emoji: "👶", color: "#f48fb1" },
  { text: "Ola's",  emoji: "👦", color: "#ffe0b2" },
  { text: "Laki's", emoji: "👦", color: "#c8e6c9" },
  { text: "Pili's", emoji: "👦", color: "#bbdefb" }
];

var family = [
  { text: "father", emoji: "👨", plural: false },
  { text: "mother", emoji: "👩", plural: false },
  { text: "grandfather", emoji: "👴", plural: false },
  { text: "grandmother", emoji: "👵", plural: false },
  { text: "grandparents", emoji: "👴👵", plural: true },
  { text: "parents", emoji: "👨👩", plural: true }
];

var adjectives = [
  { text: " funny ", emoji: "😂" },
  { text: " helpful ", emoji: "🤝" },
  { text: " kind ", emoji: "💗" },
  { text: " polite ", emoji: "🙇" },
  { text: " smart ", emoji: "🧠" },
  { text: " strong ", emoji: "💪" },
  { text: " young ", emoji: "🌱" },
  { text: " old ", emoji: "🕰️" },
  { text: " beautiful ", emoji: "✨" },
  { text: " big ", emoji: "🐘" },
  { text: " little ", emoji: "🐜" },
  { text: " short ", emoji: "📏" },
  { text: " tall ", emoji: "🦒" },
  { text: " thin ", emoji: "🪶" }
];

var state = { step: 0, name: null, family: null, adj1: null, adj2: null };

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function draw(type) {
  if (type === 'name'   && state.step !== 0) return;
  if (type === 'family' && state.step !== 1) return;
  if (type === 'adj1'   && state.step !== 3) return;
  if (type === 'adj2'   && state.step !== 4) return;

  var card = document.getElementById('card-' + type);

  if (type === 'name') {
    state.name = pickRandom(names);
    card.className = 'card revealed';
    card.style.background = state.name.color;
    card.innerHTML = '<div class="emoji">' + state.name.emoji + '</div><div class="text">' + state.name.text + '</div>';
    state.step = 1;
    document.getElementById('card-family').classList.remove('disabled');

  } else if (type === 'family') {
    state.family = pickRandom(family);
    card.className = 'card revealed';
    card.innerHTML = '<div class="emoji">' + state.family.emoji + '</div><div class="text">' + state.family.text + '</div>';
    state.step = 2;
    document.getElementById('btn-question').disabled = false;

  } else if (type === 'adj1') {
    state.adj1 = pickRandom(adjectives);
    card.className = 'card revealed';
    card.innerHTML = '<div class="emoji">' + state.adj1.emoji + '</div><div class="text">' + state.adj1.text + '</div>';
    state.step = 4;
    document.getElementById('card-adj2').classList.remove('disabled');

  } else if (type === 'adj2') {
    var a;
    do { a = pickRandom(adjectives); } while (a.text === state.adj1.text);
    state.adj2 = a;
    card.className = 'card revealed';
    card.innerHTML = '<div class="emoji">' + state.adj2.emoji + '</div><div class="text">' + state.adj2.text + '</div>';
    state.step = 5;
    document.getElementById('btn-answer').disabled = false;
  }
}

function revealQuestion() {
  if (state.step !== 2) return;
  var v = state.family.plural ? 'are' : 'is';
  var bubble = document.getElementById('question-bubble');
  bubble.textContent = '';
  var wrapper = document.createElement('span');
  wrapper.textContent = '❓ How ' + v + ' ' + state.name.text + ' ' + state.family.text + '?';
  bubble.appendChild(wrapper);
  bubble.classList.add('complete');
  state.step = 3;
  document.getElementById('btn-question').disabled = true;
  document.getElementById('card-adj1').classList.remove('disabled');
  var ab = document.getElementById('answer-bubble');
  ab.textContent = '';
  var ph = document.createElement('span');
  ph.className = 'placeholder';
  ph.textContent = '👆 Flip the word cards!';
  ab.appendChild(ph);
}

function revealAnswer() {
  if (state.step !== 5) return;
  var v = state.family.plural ? 'are' : 'is';
  var bubble = document.getElementById('answer-bubble');
  bubble.textContent = '';

  var wrapper = document.createElement('span');

  wrapper.appendChild(document.createTextNode('🎉 ' + state.name.text + ' ' + state.family.text + ' ' + v + ' '));

  var span1 = document.createElement('span');
  span1.className = 'w1';
  span1.textContent = state.adj1.text;
  wrapper.appendChild(span1);

  wrapper.appendChild(document.createTextNode(' and '));

  var span2 = document.createElement('span');
  span2.className = 'w2';
  span2.textContent = state.adj2.text;
  wrapper.appendChild(span2);

  wrapper.appendChild(document.createTextNode('!'));

  bubble.appendChild(wrapper);
  bubble.classList.add('complete');
  state.step = 6;
  document.getElementById('btn-answer').disabled = true;
  spawnConfetti();
}
function spawnConfetti() {
  var emojis = ['🎉','🌟','⭐','🎊','✨','💫','🥳'];
  for (var i = 0; i < 20; i++) {
    var el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (2 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(el);
    setTimeout(function(e){ e.remove(); }, 4500, el);
  }
}

function reset() {
  state = { step: 0, name: null, family: null, adj1: null, adj2: null };
  ['name','family','adj1','adj2'].forEach(function(t) {
    var c = document.getElementById('card-' + t);
    c.className = 'card face-down' + (t !== 'name' ? ' disabled' : '');
    c.textContent = '❓';
    c.style.background = '';
  });
  document.getElementById('btn-question').disabled = true;
  document.getElementById('btn-answer').disabled = true;
  var q = document.getElementById('question-bubble');
  q.classList.remove('complete');
  q.textContent = '';
  var ph1 = document.createElement('span');
  ph1.className = 'placeholder';
  ph1.textContent = '👆 Flip the cards first!';
  q.appendChild(ph1);
  var a = document.getElementById('answer-bubble');
  a.classList.remove('complete');
  a.textContent = '';
  var ph2 = document.createElement('span');
  ph2.className = 'placeholder';
  ph2.textContent = 'Wait for the question!';
  a.appendChild(ph2);
}
</script>


</body></html>
