name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual "Run workflow" from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site
        # The repo also contains legacy-site/ (the old app, videos included),
        # which must NEVER be published. Only these files go online:
        run: |
          mkdir _site
          cp index.html GE3.html _site/
          cp -r assets content tests _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
