<!DOCTYPE html><html lang="en"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
<meta charset="UTF-8">
<title>Office Cards — Come and Meet My Team!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f0f0;padding:0;font-family:'Nunito',sans-serif}

@page{size:A4 portrait;margin:8mm}

.page{width:210mm;min-height:297mm;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:6mm;padding:6mm;page-break-after:always}
.page:last-child{page-break-after:auto}

.card{background:#fff;border-radius:14px;border:3px solid #6366f1;padding:18px 22px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.card::after{content:'ID';position:absolute;top:12px;right:14px;font-size:.6em;font-weight:900;color:rgba(99,102,241,.25);letter-spacing:2px}

.card-emoji{font-size:3.5em;min-width:70px;text-align:center}

.card-info{display:flex;flex-direction:column;gap:5px}

.card-name{font-size:1.3em;font-weight:900;color:#1e1b4b}
.card-detail{font-size:.85em;font-weight:700;color:#4b5563;display:flex;align-items:center;gap:6px}
.card-detail .flag{font-size:1.2em}
.card-adj{display:inline-block;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;font-size:.75em;font-weight:800;padding:3px 10px;border-radius:20px;margin-top:3px}

@media print{
    body{background:#fff}
    .no-print{display:none}
    .card{box-shadow:none;border:2.5px solid #6366f1}
}

.controls{text-align:center;padding:20px;background:#1e1b4b}
.controls button{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border:none;padding:12px 32px;border-radius:10px;font-size:1em;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif}
.controls button:hover{transform:scale(1.05)}
.controls p{color:rgba(255,255,255,.6);margin-top:8px;font-size:.85em}
</style>
</head>
<body>
<div class="controls no-print">
    <button onclick="window.print()">🖨️ Print Cards</button>
    <p>8 cards per A4 page · Cut along edges ✂️</p>
</div>

<div id="cards"></div>

<script>
const people=[
    {emoji:"👨",first:"Erik",last:"Lund",flag:"🇩🇰",nat:"Danish",job:"engineer",adj:"smart"},
    {emoji:"👩",first:"Anna",last:"Berg",flag:"🇳🇴",nat:"Norwegian",job:"nurse",adj:"kind"},
    {emoji:"👨",first:"Dima",last:"Petrov",flag:"🇷🇺",nat:"Russian",job:"mechanic",adj:"hard-working"},
    {emoji:"👩",first:"Marie",last:"Blanc",flag:"🇫🇷",nat:"French",job:"hairdresser",adj:"friendly"},
    {emoji:"👨",first:"Piet",last:"de Jong",flag:"🇳🇱",nat:"Dutch",job:"postman",adj:"helpful"},
    {emoji:"👩",first:"Li",last:"Wei",flag:"🇨🇳",nat:"Chinese",job:"air hostess",adj:"nice"},
    {emoji:"👨",first:"Hans",last:"Koch",flag:"🇩🇪",nat:"German",job:"taxi driver",adj:"funny"},
    {emoji:"👩",first:"Yuki",last:"Sato",flag:"🇯🇵",nat:"Japanese",job:"operator",adj:"smart"},
    {emoji:"👨",first:"Jake",last:"Hill",flag:"🇺🇸",nat:"American",job:"sales rep",adj:"friendly"},
    {emoji:"👩",first:"Emma",last:"Bell",flag:"🇬🇧",nat:"English",job:"assistant",adj:"helpful"},
    {emoji:"👨",first:"Marco",last:"Rossi",flag:"🇮🇹",nat:"Italian",job:"policeman",adj:"kind"},
    {emoji:"👩",first:"Ida",last:"Gren",flag:"🇸🇪",nat:"Swedish",job:"employee",adj:"hard-working"},
    {emoji:"👨",first:"Min",last:"Park",flag:"🇰🇷",nat:"Korean",job:"milkman",adj:"happy"},
    {emoji:"👩",first:"Suki",last:"Tanaka",flag:"🇯🇵",nat:"Japanese",job:"policewoman",adj:"smart"},
    {emoji:"👨",first:"Tom",last:"Jones",flag:"🇬🇧",nat:"English",job:"engineer",adj:"funny"},
    {emoji:"👩",first:"Olga",last:"Ivanova",flag:"🇷🇺",nat:"Russian",job:"nurse",adj:"nice"}
];

const container=document.getElementById('cards');

for(let i=0;i<people.length;i+=8){
    const page=document.createElement('div');
    page.className='page';
    const slice=people.slice(i,i+8);
    slice.forEach(p=>{
        const card=document.createElement('div');
        card.className='card';
        const heOrShe=p.emoji==='👨'?'He':'She';
        card.innerHTML=`
            <div class="card-emoji">${p.emoji}</div>
            <div class="card-info">
                <div class="card-name">${p.first} ${p.last}</div>
                <div class="card-detail"><span class="flag">${p.flag}</span> ${p.nat}</div>
                <div class="card-detail">💼 ${p.job}</div>
                <div class="card-adj">⭐ ${p.adj}</div>
            </div>
        `;
        page.appendChild(card);
    });
    container.appendChild(page);
}
</script>


<!-- Bilingo sound FX: synthesized WebAudio, no asset files needed -->
<style>
.bilingo-redflash{position:fixed;inset:0;z-index:2147483647;pointer-events:none;background:rgba(229,57,53,.22);animation:bilingoFlash .45s ease-out forwards}
@keyframes bilingoFlash{from{opacity:1}to{opacity:0}}
.bilingo-shake{animation:bilingoShake .4s ease!important}
@keyframes bilingoShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
</style>
<script>
(function(){
if(window.__bilingoSfx)return;window.__bilingoSfx=true;
var GOOD=[".correct",".matched",".right",".win",".success",".solved",".reveal-btn.next"];
var BAD=[".wrong",".incorrect",".bad",".miss",".error",".lose"];
var GOOD_TXT=/✅|✔|🎉|Correct!|Well done|Excellent|Great job/i;
var BAD_TXT=/❌|✗|Wrong!|Try again/i;
var TAP="button, .btn, .card, .tile, .emoji-choice, .choice, .option, .seat, .passport, .ticket";
var ctx=null,lastGood=0,lastBad=0,armed=false;
function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume();return ctx}
function tone(f,d,type,v,delay,slide){var c=ac();if(!c)return;var t=c.currentTime+(delay||0);var o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}
function gate(t,ms){var n=Date.now();if(n-t<ms)return 0;return n}
function tap(){if(!armed)return;tone(950,.05,'sine',.05)}
function good(){var t=gate(lastGood,120);if(!t)return;lastGood=t;[523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,.18,'triangle',.18,i*.07)})}
function bad(){var t=gate(lastBad,120);if(!t)return;lastBad=t;tone(170,.3,'sawtooth',.15,0,85)}
function redflash(){var d=document.createElement('div');d.className='bilingo-redflash';(document.body||document.documentElement).appendChild(d);setTimeout(function(){d.remove()},500);var b=document.body;if(!b)return;b.classList.remove('bilingo-shake');void b.offsetWidth;b.classList.add('bilingo-shake');setTimeout(function(){b.classList.remove('bilingo-shake')},450)}
document.addEventListener('pointerdown',function(e){if(!armed){armed=true;ac()}var t=e.target;if(t&&t.closest&&t.closest(TAP))tap()},true);
var fired=new Map();
function scan(){
GOOD.concat(BAD).forEach(function(sel){
document.querySelectorAll(sel).forEach(function(el){
var rec=fired.get(el);if(!rec){rec={};fired.set(el,rec)}
if(!rec[sel]){rec[sel]=1;
if(GOOD.indexOf(sel)>=0)good();else{bad();redflash()}}})});
fired.forEach(function(rec,el){Object.keys(rec).forEach(function(sel){try{if(!el.matches(sel))delete rec[sel]}catch(e){delete rec[sel]}});if(!Object.keys(rec).length)fired.delete(el)})}
var scanT=null;
function schedule(){if(!armed)return;clearTimeout(scanT);scanT=setTimeout(scan,80)}
var mo=new MutationObserver(function(muts){
var need=false;
for(var i=0;i<muts.length;i++){var m=muts[i];
if(m.type==='attributes'){need=true}
else if(m.type==='childList'){need=true;
if(m.addedNodes){for(var j=0;j<m.addedNodes.length;j++){var n=m.addedNodes[j];
if(n&&n.nodeType===1&&n.textContent&&n.textContent.length<150){
if(GOOD_TXT.test(n.textContent))good();else if(BAD_TXT.test(n.textContent)){bad();redflash()}}}}}}
if(need)schedule()});
mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
})();
</script>

<!-- Bilingo game controls: zoom + fullscreen + sound (gear toggle, auto-hide 7s) -->
<style>
  .bilingo-ui {
    position: fixed; right: 12px; bottom: 12px; z-index: 2147483646;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: system-ui, sans-serif;
  }
  .bilingo-ui button {
    width: 48px; height: 48px; border: 0; border-radius: 14px;
    background: rgba(18, 18, 32, .55); color: #fff; font-size: 1.2rem; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    display: grid; place-items: center; transition: background .15s, transform .15s;
  }
  .bilingo-ui button:hover { background: rgba(70, 60, 150, .75); transform: scale(1.08); }
  .bilingo-ui .b-pct { font-size: .95rem; font-weight: 800; color: #fff; opacity: .9;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
  /* the gear always stays; everything else only shows while open */
  .bilingo-ui:not(.open) > *:not(.b-handle) { display: none; }
  /* never let the buttons leak into a paper printout */
  @media print { .bilingo-ui { display: none !important; } }
</style>
<div id="bilingo-ui" class="bilingo-ui">
  <button type="button" class="b-plus" title="Bigger (zoom in)" aria-label="Bigger">+</button>
  <div class="b-pct">100%</div>
  <button type="button" class="b-minus" title="Smaller (zoom out)" aria-label="Smaller">−</button>
  <button type="button" class="b-mute" title="Sound on/off" aria-label="Sound on or off">🔊</button>
  <button type="button" class="b-fs" title="Fullscreen on/off" aria-label="Fullscreen">⛶</button>
  <button type="button" class="b-handle" title="Show / hide controls" aria-label="Show or hide controls">⚙️</button>
</div>
<script>
(function () {
  if (window.__bilingoUI) return;
  window.__bilingoUI = true;
  var bar = document.getElementById('bilingo-ui');
  var pct = bar.querySelector('.b-pct');
  var MIN = 0.5, MAX = 2.5, STEP = 0.1, KEY = 'bilingo-zoom', IDLE = 7000;
  var z = parseFloat(localStorage.getItem(KEY) || '1');
  if (isNaN(z)) z = 1;
  z = Math.min(MAX, Math.max(MIN, z));
  function apply() {
    document.documentElement.style.setProperty('zoom', z);
    pct.textContent = Math.round(z * 100) + '%';
  }
  function shrink() { z = Math.max(MIN, Math.round((z - STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function grow() { z = Math.min(MAX, Math.round((z + STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function toggleFS() {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(function () {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
    poke();
  }

  /* ----- sound on/off: one switch for EVERY sound system a game might use -----
     Synthesized WebAudio games create oscillators/buffer sources at play time,
     so patching the prototype constructors silences them even if their context
     was created earlier. Games using <audio> elements are covered by patching
     play(). The flag is read live, so un-muting works instantly too. */
  var MUTE_KEY = 'bilingo-muted';
  window.__bilingoMuted = localStorage.getItem(MUTE_KEY) === '1';
  function dummyParam() {
    return { value: 0, setValueAtTime: function () {}, linearRampToValueAtTime: function () {},
             exponentialRampToValueAtTime: function () {}, cancelScheduledValues: function () {} };
  }
  function dummyNode() {
    var n = { connect: function (d) { return d || n; }, disconnect: function () {},
              start: function () {}, stop: function () {},
              gain: dummyParam(), frequency: dummyParam(), detune: dummyParam(),
              playbackRate: dummyParam(), Q: dummyParam(),
              type: '', buffer: null, loop: false, onended: null };
    return n;
  }
  [window.AudioContext, window.webkitAudioContext].forEach(function (AC) {
    if (!AC || !AC.prototype) return;
    ['createOscillator', 'createBufferSource'].forEach(function (m) {
      var orig = AC.prototype[m];
      AC.prototype[m] = function () { return window.__bilingoMuted ? dummyNode() : orig.apply(this, arguments); };
    });
  });
  var origPlay = HTMLAudioElement.prototype.play;
  HTMLAudioElement.prototype.play = function () {
    if (window.__bilingoMuted) return Promise.resolve();
    return origPlay.apply(this, arguments);
  };
  var muteBtn = bar.querySelector('.b-mute');
  function showMute() { muteBtn.textContent = window.__bilingoMuted ? '🔇' : '🔊'; }
  function setMute(m) {
    window.__bilingoMuted = m;
    localStorage.setItem(MUTE_KEY, m ? '1' : '0');
    if (m) { /* stop anything already ringing this second */
      document.querySelectorAll('audio').forEach(function (a) { a.pause(); });
    }
    showMute();
  }
  muteBtn.addEventListener('click', function () { setMute(!window.__bilingoMuted); poke(); });
  showMute();

  bar.querySelector('.b-plus').addEventListener('click', grow);
  bar.querySelector('.b-minus').addEventListener('click', shrink);
  bar.querySelector('.b-fs').addEventListener('click', toggleFS);
  bar.querySelector('.b-handle').addEventListener('click', function () {
    bar.classList.toggle('open');
    poke();
  });
  /* collapse 7 s after the last tap anywhere on the bar */
  var idleTimer = null;
  function poke() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { bar.classList.remove('open'); }, IDLE);
  }
  bar.addEventListener('pointerdown', poke);
  apply();
})();
</script>
</body></html>
