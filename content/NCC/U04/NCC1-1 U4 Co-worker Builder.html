<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #1a0f00;

}

}

.spin-btn-area {

}

.spin-btn {
  padding: 16px 50px;
  font-size: 22px;

  background: linear-gradient(180deg, #ffcc00, #aa8800);

  border: 3px solid #ffdd44;
  border-radius: 50px;

}

.spin-btn:hover {
  background: linear-gradient(180deg, #ffdd44, #ccaa00);
  box-shadow: 0 4px 25px rgba(255, 204, 0, 0.5);

}

.spin-btn:active {
  transform: scale(0.97);
}

.spin-btn:disabled {
  background: linear-gradient(180deg, #666, #444);

.lights {

}

.light {

.win-banner {

}

.win-banner.visible {
  opacity: 1;
  animation: bannerPulse 1s infinite;
}

@keyframes bannerPulse {
  0%, 100% { opacity: 1; }

}

@media (max-width: 500px) {
  .machine {
    padding: 18px 15px;
    border-radius: 14px;
  }
  .machine-title {
    font-size: 14px;
  }
  .reel-label {
    width: 65px;
    min-width: 65px;
    font-size: 9px;
  }
  .reel-text {
    font-size: 17px;
  }
  .reel-row {
    height: 44px;
  }
  .spin-btn {
    padding: 12px 35px;
    font-size: 18px;
  }
}
</style>
</head>
<body>

<div class="bg-gradient"></div>
<canvas id="sparkles"></canvas>

<div class="toggles">
  <button class="toggle-btn" id="toggleCar" onclick="toggleExtra('car')">🚗 Car</button>
  <button class="toggle-btn" id="toggleLike" onclick="toggleExtra('like')">♥ Likes</button>
  <button class="toggle-btn" id="toggleDislike" onclick="toggleExtra('dislike')">✖ Dislikes</button>
</div>

<div class="machine">
  <div class="lights">
    <div class="light" id="light0"></div>
    <div class="light" id="light1"></div>
    <div class="light" id="light2"></div>
    <div class="light" id="light3"></div>
    <div class="light" id="light4"></div>
    <div class="light" id="light5"></div>
  </div>

  <div class="machine-title">Slot Machine Co-Worker</div>

  <div class="reels-container">
    <div class="reel-row" id="row-name">
      <div class="reel-label">Name</div>
      <div class="reel-window">
        <div class="reel-text" id="reel-name">???</div>
      </div>
    </div>
    <div class="reel-row" id="row-job">
      <div class="reel-label">Job</div>
      <div class="reel-window">
        <div class="reel-text" id="reel-job">???</div>
      </div>
    </div>
    <div class="reel-row" id="row-nat">
      <div class="reel-label">Nationality</div>
      <div class="reel-window">
        <div class="reel-text" id="reel-nat">???</div>
      </div>
    </div>
    <div class="reel-row hidden" id="row-car">
      <div class="reel-label">Car</div>
      <div class="reel-window">
        <div class="reel-text" id="reel-car">???</div>
      </div>
    </div>
    <div class="reel-row hidden" id="row-like">
      <div class="reel-label">Likes</div>
      <div class="reel-window">
        <div class="reel-text" id="reel-like">???</div>
      </div>
    </div>
    <div class="reel-row hidden" id="row-dislike">
      <div class="reel-label">Dislikes</div>
      <div class="reel-window">
        <div class="reel-text" id="reel-dislike">???</div>
      </div>
    </div>
  </div>

  <div class="spin-btn-area">
    <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN</button>
  </div>

  <div class="win-banner" id="winBanner">★ Your new co-worker! ★</div>
</div>

<script>
// --- SPARKLE BACKGROUND ---
const canvas = document.getElementById('sparkles');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function createParticle() {
  return {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2.5 + 0.5,
    speedY: -0.2 - Math.random() * 0.5,
    speedX: (Math.random() - 0.5) * 0.3,
    opacity: Math.random(),
    opacityDir: (Math.random() - 0.5) * 0.02,
    hue: 40 + Math.random() * 20
  };
}

for (let i = 0; i < 80; i++) {
  particles.push(createParticle());
}

function animateSparkles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.speedX;
    p.y += p.speedY;
    p.opacity += p.opacityDir;
    if (p.opacity <= 0 || p.opacity >= 1) p.opacityDir *= -1;
    if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 80%, 60%, ${p.opacity})`;
    ctx.fill();
  });
  requestAnimationFrame(animateSparkles);
}
animateSparkles();

// --- AUDIO ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTick(pitch) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = pitch || (200 + Math.random() * 300);
  osc.type = 'square';
  gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.03);
}

function playClunk(pitch) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = pitch || 150;
  osc.type = 'sine';
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);

  const noise = audioCtx.createOscillator();
  const ng = audioCtx.createGain();
  noise.connect(ng);
  ng.connect(audioCtx.destination);
  noise.frequency.value = 80;
  noise.type = 'sawtooth';
  ng.gain.setValueAtTime(0.1, audioCtx.currentTime);
  ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
  noise.start();
  noise.stop(audioCtx.currentTime + 0.08);
}

function playFanfare() {
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }, i * 100);
  });
}

// --- DATA ---
const maleNames = ["Mr Smith", "Mr Kim", "Mr Wolf", "Mr Rossi", "Mr Chen", "Mr Blanc", "Mr Park", "Mr Tanaka", "Mr Olson", "Mr Brown", "Mr Green", "Mr Fox"];
const femaleNames = ["Miss Li", "Miss Jones", "Miss Hill", "Miss Sato", "Miss Dupont", "Miss Olson", "Miss Kim", "Miss Green", "Miss White", "Miss Fox"];
const allNames = [...maleNames, ...femaleNames];
const maleJobs = ["engineer", "milkman", "policeman", "postman", "hairdresser", "mechanic", "taxi driver", "operator"];
const femaleJobs = ["engineer", "air hostess", "housewife", "policewoman", "hairdresser", "mechanic", "nurse", "taxi driver", "operator"];
const allJobs = [...new Set([...maleJobs, ...femaleJobs])];
const nationalities = ["American", "Chinese", "English", "French", "German", "Italian", "Japanese", "Korean", "Swedish"];
const cars = ["BYD", "Fiat", "Ford", "Mercedes", "Mini", "Peugeot", "Toyota", "Volvo"];
const likesArr = ["coffee", "tea", "cats", "dogs", "football", "music", "pizza", "chocolate", "books", "cooking", "swimming", "dancing"];
const dislikesArr = ["rain", "mornings", "spiders", "homework", "traffic", "cold weather", "loud music", "running", "cleaning"];

let extras = { car: false, like: false, dislike: false };
let spinning = false;

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function toggleExtra(key) {
  extras[key] = !extras[key];
  const btn = document.getElementById('toggle' + key.charAt(0).toUpperCase() + key.slice(1));
  btn.classList.toggle('active', extras[key]);
  const rowId = key === 'car' ? 'row-car' : key === 'like' ? 'row-like' : 'row-dislike';
  document.getElementById(rowId).classList.toggle('hidden', !extras[key]);
}

// --- SPINNING ---
function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('winBanner').classList.remove('visible');

  // Reset all rows
  document.querySelectorAll('.reel-row').forEach(r => r.classList.remove('landed'));
  document.querySelectorAll('.reel-text').forEach(t => { t.classList.remove('landed'); t.classList.remove('spinning'); });
  document.querySelectorAll('.light').forEach(l => l.classList.remove('on'));

  // Choose final values
  const isMale = Math.random() < 0.5;
  const finalName = isMale ? pick(maleNames) : pick(femaleNames);
  const emoji = isMale ? '👨 ' : '👩 ';
  const finalJob = isMale ? pick(maleJobs) : pick(femaleJobs);
  const finalNat = pick(nationalities);
  const finalCar = pick(cars);
  const finalLike = pick(likesArr);
  let finalDislike;
  do { finalDislike = pick(dislikesArr); } while (finalDislike === finalLike);

  // Build reel sequence
  const reels = [
    { id: 'name', pool: allNames, final: emoji + finalName, lightIdx: 0 },
    { id: 'job', pool: allJobs, final: finalJob, lightIdx: 1 },
    { id: 'nat', pool: nationalities, final: finalNat, lightIdx: 2 }
  ];
  let lightIdx = 3;
  if (extras.car) { reels.push({ id: 'car', pool: cars, final: finalCar, lightIdx: lightIdx++ }); }
  if (extras.like) { reels.push({ id: 'like', pool: likesArr, final: finalLike, lightIdx: lightIdx++ }); }
  if (extras.dislike) { reels.push({ id: 'dislike', pool: dislikesArr, final: finalDislike, lightIdx: lightIdx++ }); }

  // Start all reels spinning at once
  const spinIntervals = [];
  reels.forEach((reel, idx) => {
    const el = document.getElementById('reel-' + reel.id);
    el.classList.add('spinning');
    el.textContent = pick(reel.pool);
    const interval = setInterval(() => {
      el.textContent = pick(reel.pool);
      playTick();
    }, 60);
    spinIntervals.push(interval);
  });

  // Stop reels one by one
  reels.forEach((reel, idx) => {
    const stopTime = 800 + idx * 600;
    setTimeout(() => {
      clearInterval(spinIntervals[idx]);
      const el = document.getElementById('reel-' + reel.id);
      const row = document.getElementById('row-' + reel.id);

      // Slowdown: a few more ticks getting slower
      let slowTicks = 5;
      let delay = 80;
      function slowDown() {
        if (slowTicks <= 0) {
          // Final land
          el.textContent = reel.final;
          el.classList.remove('spinning');
          el.classList.add('landed');
          row.classList.add('landed');
          playClunk(120 + idx * 30);

          if (reel.lightIdx < 6) {
            document.getElementById('light' + reel.lightIdx).classList.add('on');
          }

          // Last reel done
          if (idx === reels.length - 1) {
            setTimeout(() => {
              playFanfare();
              document.getElementById('winBanner').classList.add('visible');
              spinning = false;
              document.getElementById('spinBtn').disabled = false;
              burstParticles();
            }, 300);
          }
          return;
        }
        el.textContent = pick(reel.pool);
        playTick(300 + slowTicks * 50);
        slowTicks--;
        delay += 40;
        setTimeout(slowDown, delay);
      }
      slowDown();
    }, stopTime);
  });
}

function burstParticles() {
  for (let i = 0; i < 20; i++) {
    particles.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * 100,
      y: canvas.height / 2,
      size: Math.random() * 4 + 2,
      speedY: -2 - Math.random() * 3,
      speedX: (Math.random() - 0.5) * 4,
      opacity: 1,
      opacityDir: -0.02,
      hue: 40 + Math.random() * 30
    });
  }
}
</script>



<!-- Bilingo game controls: zoom + fullscreen (gear toggle, auto-hide 7s) -->
<style>
  .bilingo-ui {
    position: fixed; right: 12px; bottom: 12px; z-index: 2147483646;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: system-ui, sans-serif;
  }
  .bilingo-ui button {
    width: 48px; height: 48px; border: 0; border-radius: 14px;
    background: rgba(18, 18, 32, .55); color: #fff; font-size: 1.2rem; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    display: grid; place-items: center; transition: background .15s, transform .15s;
  }
  .bilingo-ui button:hover { background: rgba(70, 60, 150, .75); transform: scale(1.08); }
  .bilingo-ui .b-pct { font-size: .95rem; font-weight: 800; color: #fff; opacity: .9;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
  /* the gear always stays; everything else only shows while open */
  .bilingo-ui:not(.open) > *:not(.b-handle) { display: none; }
</style>
<div id="bilingo-ui" class="bilingo-ui">
  <button type="button" class="b-plus" title="Bigger (zoom in)" aria-label="Bigger">+</button>
  <div class="b-pct">100%</div>
  <button type="button" class="b-minus" title="Smaller (zoom out)" aria-label="Smaller">−</button>
  <button type="button" class="b-fs" title="Fullscreen on/off" aria-label="Fullscreen">⛶</button>
  <button type="button" class="b-handle" title="Show / hide controls" aria-label="Show or hide controls">⚙️</button>
</div>
<script>
(function () {
  if (window.__bilingoUI) return;
  window.__bilingoUI = true;
  var bar = document.getElementById('bilingo-ui');
  var pct = bar.querySelector('.b-pct');
  var MIN = 0.5, MAX = 2.5, STEP = 0.1, KEY = 'bilingo-zoom', IDLE = 7000;
  var z = parseFloat(localStorage.getItem(KEY) || '1');
  if (isNaN(z)) z = 1;
  z = Math.min(MAX, Math.max(MIN, z));
  function apply() {
    document.documentElement.style.setProperty('zoom', z);
    pct.textContent = Math.round(z * 100) + '%';
  }
  function shrink() { z = Math.max(MIN, Math.round((z - STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function grow() { z = Math.min(MAX, Math.round((z + STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function toggleFS() {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(function () {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
    poke();
  }
  bar.querySelector('.b-plus').addEventListener('click', grow);
  bar.querySelector('.b-minus').addEventListener('click', shrink);
  bar.querySelector('.b-fs').addEventListener('click', toggleFS);
  bar.querySelector('.b-handle').addEventListener('click', function () {
    bar.classList.toggle('open');
    poke();
  });
  /* collapse 7 s after the last tap anywhere on the bar */
  var idleTimer = null;
  function poke() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { bar.classList.remove('open'); }, IDLE);
  }
  bar.addEventListener('pointerdown', poke);
  apply();
})();
</script>
