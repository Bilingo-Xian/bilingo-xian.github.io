<!DOCTYPE html><html lang="en"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urgent or Can Wait?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
    transition: background 0.8s ease;
    overflow: hidden;
  }
  body.bg-green { background: #2d8a4e; }

  .header {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 800;
    margin-bottom: 14px;
    text-align: center;
    letter-spacing: 1px;
    z-index: 10;
    position: relative;
  }

  .card {
    background: #fff;
    color: #333;
    border-radius: 24px;
    width: 92vw;
    max-width: 820px;
    padding: 28px 32px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
    z-index: 10;
    transition: transform 0.3s;
  }

  .card img {
    max-width: 100%;
    max-height: 40vh;
    border-radius: 14px;
    object-fit: cover;
    display: block;
    margin: 0 auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .img-placeholder {
    width: 100%;
    height: 240px;
    background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
  }

  .prompt {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 16px 0 14px;
    color: #888;
  }

  .reveal-btn {
    background: linear-gradient(135deg, #6c5ce7, #a855f7);
    color: #fff;
    border: none;
    padding: 14px 40px;
    font-size: 1.2rem;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(108,92,231,0.4);
  }
  .reveal-btn:hover { transform: scale(1.06); }

  .situation-text {
    font-size: 1.45rem;
    font-weight: 700;
    margin: 16px 0 8px;
    color: #2d3436;
    display: none;
    line-height: 1.4;
  }

  .choices {
    display: none;
    gap: 24px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .choice-btn {
    padding: 16px 44px;
    font-size: 1.35rem;
    font-weight: 800;
    border: 4px solid;
    border-radius: 18px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }
  .choice-btn:hover { transform: scale(1.08); }

  .btn-urgent {
    background: #ff6b6b;
    border-color: #e05555;
    color: #fff;
  }
  .btn-wait {
    background: #74b9ff;
    border-color: #5aa0e6;
    color: #fff;
  }

  .next-btn {
    display: none;
    background: #fff;
    color: #2d8a4e;
    border: none;
    padding: 16px 50px;
    font-size: 1.3rem;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 800;
    margin-top: 18px;
    z-index: 10;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    transition: transform 0.2s;
  }
  .next-btn:hover { transform: scale(1.07); }

  .dot-bar {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    justify-content: center;
    flex-wrap: wrap;
    z-index: 10;
    position: relative;
  }
  .dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    transition: all 0.3s;
  }
  .dot.current { background: #fff; border-color: #fff; transform: scale(1.25); }
  .dot.done { background: #00b894; border-color: #00b894; }

  .counter {
    color: rgba(255,255,255,0.5);
    font-size: 0.9rem;
    margin-top: 6px;
    z-index: 10;
    position: relative;
  }

  .hint {
    color: rgba(255,255,255,0.3);
    font-size: 0.78rem;
    margin-top: 10px;
    z-index: 10;
    position: relative;
  }

  /* ---- Emoji rain / rise container ---- */
  .emoji-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }

  .emoji-particle {
    position: absolute;
    font-size: 2.8rem;
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }

  /* Fire rising from bottom */
  @keyframes riseUp {
    0%   { transform: translateY(100vh) scale(0.6) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(-20vh) scale(1.2) rotate(25deg); opacity: 0; }
  }

  /* Zen falling from top */
  @keyframes fallDown {
    0%   { transform: translateY(-10vh) scale(0.6) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(110vh) scale(1.1) rotate(-20deg); opacity: 0; }
  }

  .rise { animation: riseUp var(--dur) ease-out forwards; }
  .fall { animation: fallDown var(--dur) ease-in forwards; }

  /* Fade-up util */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.4s ease; }

  /* Start screen */
  .start-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.5s;
  }
  .start-overlay.hidden { opacity: 0; pointer-events: none; }
  .start-overlay h1 { font-size: clamp(2rem, 5vw, 3.5rem); text-align: center; }
  .start-overlay .sub { color: rgba(255,255,255,0.5); font-size: 1.1rem; }
  .start-btn {
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: #fff; border: none; padding: 18px 60px;
    font-size: 1.4rem; border-radius: 60px; cursor: pointer;
    font-weight: 800; box-shadow: 0 6px 30px rgba(238,90,36,0.4);
    transition: transform 0.2s;
  }
  .start-btn:hover { transform: scale(1.08); }

  /* End screen */
  .end-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #00b894, #2d8a4e);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .end-overlay h1 { font-size: clamp(2rem, 5vw, 3.2rem); text-align: center; }
  .end-overlay .end-sub { font-size: 1.2rem; color: rgba(255,255,255,0.7); }
  .replay-btn {
    background: #fff; color: #2d8a4e; border: none; padding: 16px 50px;
    font-size: 1.3rem; border-radius: 60px; cursor: pointer; font-weight: 800;
    margin-top: 10px; transition: transform 0.2s;
  }
  .replay-btn:hover { transform: scale(1.07); }

  @media (max-width: 600px) {
    .card { padding: 16px 14px; }
    .choice-btn { padding: 14px 28px; font-size: 1.1rem; }
  }
</style>
</head>
<body>

<!-- Start screen -->
<div class="start-overlay" id="startScreen">
  <h1>🚨 Urgent &nbsp;or&nbsp; Can Wait? ⏳</h1>
  <div class="sub">Look at each picture, describe it, then decide!</div>
  <button class="start-btn" onclick="startGame()">▶ Start</button>
</div>

<!-- End screen -->
<div class="end-overlay" id="endScreen">
  <h1>🎉 Well Done!</h1>
  <div style="font-size:4rem;">🌟</div>
  <div class="end-sub">You looked at all the situations!</div>
  <button class="replay-btn" onclick="restartGame()">🔄 Play Again</button>
</div>

<!-- Emoji layer -->
<div class="emoji-layer" id="emojiLayer"></div>

<!-- Main UI -->
<div class="header" id="mainHeader" style="display:none;">🚨 Urgent &nbsp;or&nbsp; Can Wait? ⏳</div>

<div class="card" id="card" style="display:none;">
  <div id="imageArea"></div>
  <div class="prompt" id="prompt">🗣️ What can you see? Describe the picture!</div>
  <button class="reveal-btn" id="revealBtn" onclick="doReveal()">🔍 Reveal the Situation</button>
  <div class="situation-text" id="situationText"></div>
  <div class="choices" id="choices">
    <button class="choice-btn btn-urgent" onclick="choose('urgent')">🚨 URGENT!</button>
    <button class="choice-btn btn-wait" onclick="choose('wait')">😌 CAN WAIT</button>
  </div>
</div>

<button class="next-btn" id="nextBtn" onclick="goNext()">Next ➡</button>

<div class="dot-bar" id="dotBar"></div>
<div class="counter" id="counter"></div>
<div class="hint" id="hint" style="display:none;">Space = reveal &nbsp;|&nbsp; U = urgent &nbsp; W = can wait &nbsp;|&nbsp; Enter = next</div>

<script>
var DATA = [
  {
    img: 'kitchen fire.jpg',
    emoji: '🔥',
    situation: 'There is a fire in the kitchen!'
  },
  {
    img: 'bear ourside the window.jpg',
    emoji: '🐻',
    situation: 'A bear is outside your window!'
  },
  {
    img: 'kid fell fro the bike.jpg',
    emoji: '🚲',
    situation: 'A kid fell off the bike and is hurt!'
  },
  {
    img: 'toothache.jpg',
    emoji: '🦷',
    situation: 'You have a toothache.'
  },
  {
    img: 'big spider in the bathroom.jpg',
    emoji: '🕷️',
    situation: 'There is a big spider in the bathroom.'
  },
  {
    img: 'cat stuck on the roof.jpg',
    emoji: '🐱',
    situation: 'A cat is stuck on the roof.'
  },
  {
    img: 'stomach growling.jpg',
    emoji: '😫',
    situation: "Your stomach is growling. You're hungry!"
  },
  {
    img: 'broken shoe.jpg',
    emoji: '👟',
    situation: 'Your shoe is broken.'
  },
  {
    img: 'boy want to buy a new toy.png',
    emoji: '🧸',
    situation: 'A boy wants to buy a new toy.'
  },
  {
    img: 'cluttered desk.jpeg',
    emoji: '🗂️',
    situation: 'Your desk is really messy and cluttered.'
  },
  {
    img: 'worn suitcase.jpg',
    emoji: '🧳',
    situation: 'Your suitcase is old and worn out.'
  }
];

var cur = 0;
var revealed = [];
var answered = [];

var fireEmojis = ['🔥','🔥','🔥','🚨','🔥','🚒','🔥','🔥'];
var zenEmojis  = ['😌','☺️','🧘','💆','🌿','🍵','😌','☺️','🧘','🌸'];

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function init() {
  shuffle(DATA);
  revealed = DATA.map(function(){ return false; });
  answered = DATA.map(function(){ return false; });
  cur = 0;
}

function startGame() {
  init();
  document.getElementById('startScreen').classList.add('hidden');
  setTimeout(function(){
    document.getElementById('startScreen').style.display = 'none';
  }, 500);
  document.getElementById('mainHeader').style.display = '';
  document.getElementById('card').style.display = '';
  document.getElementById('hint').style.display = '';
  render();
}

function restartGame() {
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('emojiLayer').innerHTML = '';
  document.body.classList.remove('bg-green');
  init();
  document.getElementById('mainHeader').style.display = '';
  document.getElementById('card').style.display = '';
  document.getElementById('hint').style.display = '';
  render();
}

function render() {
  document.body.classList.remove('bg-green');
  document.getElementById('emojiLayer').innerHTML = '';

  var s = DATA[cur];

  // Image
  document.getElementById('imageArea').innerHTML =
    '<img src="' + s.img + '" alt="situation" ' +
    'onerror="this.outerHTML=\'<div class=img-placeholder>' + s.emoji + '</div>\'">';

  // Prompt
  document.getElementById('prompt').style.display = answered[cur] ? 'none' : 'block';

  // Reveal
  document.getElementById('revealBtn').style.display =
    (!revealed[cur] && !answered[cur]) ? 'inline-block' : 'none';

  // Situation
  var st = document.getElementById('situationText');
  st.textContent = s.situation;
  st.style.display = revealed[cur] ? 'block' : 'none';

  // Choices
  document.getElementById('choices').style.display =
    (revealed[cur] && !answered[cur]) ? 'flex' : 'none';

  // Next
  document.getElementById('nextBtn').style.display = 'none';

  // Dots
  var dots = '';
  for (var i = 0; i < DATA.length; i++) {
    var cls = 'dot';
    if (i === cur) cls += ' current';
    if (answered[i]) cls += ' done';
    dots += '<div class="' + cls + '"></div>';
  }
  document.getElementById('dotBar').innerHTML = dots;
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + DATA.length;
}

function doReveal() {
  revealed[cur] = true;
  render();
  var st = document.getElementById('situationText');
  st.classList.add('fade-up');
  setTimeout(function(){ st.classList.remove('fade-up'); }, 400);
}

function choose(type) {
  if (answered[cur]) return;
  answered[cur] = true;

  // Hide choices
  document.getElementById('choices').style.display = 'none';
  document.getElementById('prompt').style.display = 'none';

  // Green background
  document.body.classList.add('bg-green');

  // Emoji animation
  spawnEmojis(type);

  // Show next button after a moment
  setTimeout(function(){
    var btn = document.getElementById('nextBtn');
    btn.style.display = 'inline-block';
    btn.textContent = (cur === DATA.length - 1) ? '🏁 Finish!' : 'Next ➡';
    btn.classList.add('fade-up');
    setTimeout(function(){ btn.classList.remove('fade-up'); }, 400);
  }, 600);

  // Update dots
  var dots = '';
  for (var i = 0; i < DATA.length; i++) {
    var cls = 'dot';
    if (i === cur) cls += ' current';
    if (answered[i]) cls += ' done';
    dots += '<div class="' + cls + '"></div>';
  }
  document.getElementById('dotBar').innerHTML = dots;
}

function spawnEmojis(type) {
  var layer = document.getElementById('emojiLayer');
  layer.innerHTML = '';
  var emojis = (type === 'urgent') ? fireEmojis : zenEmojis;
  var count = 35;
  for (var i = 0; i < count; i++) {
    var el = document.createElement('div');
    el.className = 'emoji-particle ' + (type === 'urgent' ? 'rise' : 'fall');
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (Math.random() * 96 + 2) + '%';
    var dur = 2 + Math.random() * 2.5;
    el.style.setProperty('--dur', dur + 's');
    el.style.animationDelay = (Math.random() * 1.5) + 's';
    el.style.fontSize = (2 + Math.random() * 2.5) + 'rem';
    layer.appendChild(el);
  }
}

function goNext() {
  if (cur === DATA.length - 1) {
    // Show end screen
    document.getElementById('mainHeader').style.display = 'none';
    document.getElementById('card').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('dotBar').innerHTML = '';
    document.getElementById('counter').textContent = '';
    document.getElementById('hint').style.display = 'none';
    document.getElementById('emojiLayer').innerHTML = '';
    document.body.classList.remove('bg-green');
    document.getElementById('endScreen').style.display = 'flex';
    return;
  }
  cur++;
  render();
}

// Keyboard
document.addEventListener('keydown', function(e) {
  var start = document.getElementById('startScreen');
  if (start && start.style.display !== 'none' && !start.classList.contains('hidden')) return;
  if (document.getElementById('endScreen').style.display === 'flex') return;

  if (e.key === ' ' && !revealed[cur] && !answered[cur]) {
    e.preventDefault(); doReveal();
  } else if ((e.key === 'u' || e.key === 'U') && revealed[cur] && !answered[cur]) {
    choose('urgent');
  } else if ((e.key === 'w' || e.key === 'W') && revealed[cur] && !answered[cur]) {
    choose('wait');
  } else if (e.key === 'Enter' && answered[cur]) {
    goNext();
  }
});
</script>



<!-- Bilingo game controls: zoom + fullscreen (gear toggle, auto-hide 7s) -->
<style>
  .bilingo-ui {
    position: fixed; right: 12px; bottom: 12px; z-index: 2147483646;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: system-ui, sans-serif;
  }
  .bilingo-ui button {
    width: 48px; height: 48px; border: 0; border-radius: 14px;
    background: rgba(18, 18, 32, .55); color: #fff; font-size: 1.2rem; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    display: grid; place-items: center; transition: background .15s, transform .15s;
  }
  .bilingo-ui button:hover { background: rgba(70, 60, 150, .75); transform: scale(1.08); }
  .bilingo-ui .b-pct { font-size: .95rem; font-weight: 800; color: #fff; opacity: .9;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
  /* the gear always stays; everything else only shows while open */
  .bilingo-ui:not(.open) > *:not(.b-handle) { display: none; }
</style>
<div id="bilingo-ui" class="bilingo-ui">
  <button type="button" class="b-plus" title="Bigger (zoom in)" aria-label="Bigger">+</button>
  <div class="b-pct">100%</div>
  <button type="button" class="b-minus" title="Smaller (zoom out)" aria-label="Smaller">−</button>
  <button type="button" class="b-fs" title="Fullscreen on/off" aria-label="Fullscreen">⛶</button>
  <button type="button" class="b-handle" title="Show / hide controls" aria-label="Show or hide controls">⚙️</button>
</div>
<script>
(function () {
  if (window.__bilingoUI) return;
  window.__bilingoUI = true;
  var bar = document.getElementById('bilingo-ui');
  var pct = bar.querySelector('.b-pct');
  var MIN = 0.5, MAX = 2.5, STEP = 0.1, KEY = 'bilingo-zoom', IDLE = 7000;
  var z = parseFloat(localStorage.getItem(KEY) || '1');
  if (isNaN(z)) z = 1;
  z = Math.min(MAX, Math.max(MIN, z));
  function apply() {
    document.documentElement.style.setProperty('zoom', z);
    pct.textContent = Math.round(z * 100) + '%';
  }
  function shrink() { z = Math.max(MIN, Math.round((z - STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function grow() { z = Math.min(MAX, Math.round((z + STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function toggleFS() {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(function () {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
    poke();
  }
  bar.querySelector('.b-plus').addEventListener('click', grow);
  bar.querySelector('.b-minus').addEventListener('click', shrink);
  bar.querySelector('.b-fs').addEventListener('click', toggleFS);
  bar.querySelector('.b-handle').addEventListener('click', function () {
    bar.classList.toggle('open');
    poke();
  });
  /* collapse 7 s after the last tap anywhere on the bar */
  var idleTimer = null;
  function poke() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { bar.classList.remove('open'); }, IDLE);
  }
  bar.addEventListener('pointerdown', poke);
  apply();
})();
</script>
</body></html>
