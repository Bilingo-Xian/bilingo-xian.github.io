<!DOCTYPE html><html lang="en"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>What's This? – A / An Game</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;justify-content:center;align-items:center;
  -webkit-user-select:none;user-select:none;
  transition:background .8s ease;
}

#game{
  background:#fff;border-radius:28px;
  width:94vw;max-width:520px;
  height:90vh;max-height:740px;
  display:flex;flex-direction:column;align-items:center;
  position:relative;
  box-shadow:0 15px 50px rgba(0,0,0,.3);
  padding:18px 16px;
}
#game.shake{animation:shake .45s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  15%,55%,85%{transform:translateX(-8px)}
  35%,75%{transform:translateX(8px)}
}
#counter{position:absolute;top:14px;right:16px;font-size:.85rem;font-weight:800;color:#c5c5c5}

/* corner controls */
#cornerBtns{position:absolute;top:10px;left:12px;display:flex;gap:8px;z-index:20}
.cbtn{
  border:2px solid #e2e2f5;background:#f6f6ff;color:#5a5aa8;
  font-family:inherit;font-weight:800;font-size:.78rem;
  padding:7px 12px;border-radius:999px;cursor:pointer;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.cbtn:hover{background:#eaeaFF;transform:scale(1.05)}
.cbtn:active{transform:scale(.95)}
.cbtn.on{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent}

/* ---------- title screen ---------- */
#title{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;flex:1;text-align:center;gap:14px;z-index:10;
}
#title .big-emoji{font-size:min(6.5rem,18vw);line-height:1;animation:wiggle 1.6s ease-in-out infinite}
#title h1{font-size:2.4rem;color:#333;letter-spacing:-.5px}
#title h1 span{background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;background-clip:text;color:transparent}
#title p{color:#888;font-weight:700;font-size:1rem}
.mode{
  width:88%;max-width:330px;border:0;border-radius:22px;cursor:pointer;
  font-family:inherit;font-weight:900;color:#fff;
  padding:18px 10px;font-size:1.2rem;box-shadow:0 8px 22px rgba(0,0,0,.22);
  transition:transform .15s;-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;gap:4px;align-items:center;
}
.mode small{font-weight:700;font-size:.8rem;opacity:.92}
.mode.class{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#14532d}
.mode.all{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff}
.mode:hover{transform:translateY(-3px) scale(1.03)}
.mode:active{transform:scale(.97)}

#quiz{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;width:100%;flex:1;
}
#question{font-size:2.1rem;color:#333}
#emoji{
  font-size:min(8rem,20vw);line-height:1.1;display:inline-block;
  margin:10px 0;animation:wiggle 1s ease-in-out infinite;
}
@keyframes wiggle{
  0%{transform:rotate(0) scale(1)}
  10%{transform:rotate(-6deg) scale(1.05)}
  20%{transform:rotate(5deg) scale(1.03)}
  30%{transform:rotate(-4deg) scale(1.01)}
  40%{transform:rotate(3deg)}
  50%{transform:rotate(-1deg)}
  100%{transform:rotate(0) scale(1)}
}
#opts{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  width:100%;max-width:380px;margin-top:14px;
}
.opt{
  padding:13px 6px;font-size:1.25rem;font-weight:800;
  border:3px solid #e8e8e8;border-radius:16px;background:#fafafa;
  cursor:pointer;transition:all .15s;font-family:inherit;color:#444;
  -webkit-tap-highlight-color:transparent;
}
.opt:hover{border-color:#667eea;background:#f0f0ff;transform:scale(1.04)}
.opt:active{transform:scale(.96)}
.opt.yes{border-color:#66bb6a;background:#e8f5e9;color:#2e7d32;pointer-events:none}
.opt.no{border-color:#ef5350;background:#ffebee}

#sort{
  display:none;flex-direction:column;align-items:center;
  justify-content:center;width:100%;flex:1;gap:26px;
}
#hint{font-size:1.1rem;color:#aaa;font-weight:700;text-align:center}
#pill{
  font-size:1.7rem;font-weight:900;color:#fff;
  background:linear-gradient(135deg,#667eea,#764ba2);
  padding:13px 34px;border-radius:50px;
  cursor:grab;touch-action:none;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  z-index:50;position:relative;
  -webkit-tap-highlight-color:transparent;
  transition:background .6s;
}
#pill.drag{cursor:grabbing;box-shadow:0 10px 35px rgba(0,0,0,.35);z-index:999}

#zones{display:flex;width:100%;align-items:stretch;gap:0}
.zone{
  flex:1;padding:20px 10px;border-radius:20px;
  font-size:1.1rem;font-weight:800;text-align:center;
  min-height:95px;display:flex;align-items:center;justify-content:center;
  transition:all .25s;border:3px dashed;line-height:1.5;
}
#zA{background:#fff8e1;border-color:#ffb74d;color:#bf360c;margin-right:5px}
#zAN{background:#e3f2fd;border-color:#64b5f6;color:#0d47a1;margin-left:5px}
.zone.hov{transform:scale(1.06);border-style:solid}
#zA.hov{background:#ffecb3;box-shadow:0 0 25px rgba(255,183,77,.5)}
#zAN.hov{background:#bbdefb;box-shadow:0 0 25px rgba(100,181,246,.5)}
.blk{display:inline-block;min-width:50px;border-bottom:3px solid currentColor;margin:0 3px}
.zone.ok{border-style:solid!important;background:#c8e6c9!important;border-color:#66bb6a!important;color:#2e7d32!important}
.sep{width:3px;background:linear-gradient(to bottom,transparent,#ddd,transparent);border-radius:3px;flex-shrink:0}

#nxt{
  display:none;padding:15px 40px;font-size:1.35rem;font-weight:900;
  background:linear-gradient(135deg,#43e97b,#38f9d7);
  border:none;border-radius:50px;cursor:pointer;font-family:inherit;
  color:#1a5c2a;box-shadow:0 6px 20px rgba(67,233,123,.4);
  transition:all .2s;-webkit-tap-highlight-color:transparent;margin-top:8px;
}
#nxt:hover{transform:translateY(-2px) scale(1.03)}

#done{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1}
#done h2{font-size:2.3rem;margin-bottom:8px}
#done p{font-size:1.15rem;color:#777;margin-bottom:22px}
#again{
  padding:15px 40px;font-size:1.25rem;font-weight:900;
  background:linear-gradient(135deg,#667eea,#764ba2);
  border:none;border-radius:50px;cursor:pointer;font-family:inherit;
  color:#fff;box-shadow:0 6px 20px rgba(102,126,234,.4);
}

/* round splash */
#splash{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(255,255,255,.94);border-radius:28px;z-index:30;
  font-size:2rem;font-weight:900;color:#764ba2;text-align:center;
  flex-direction:column;gap:8px;
}
#splash.show{display:flex;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
#splash small{color:#999;font-size:1rem;font-weight:700}

.ani-fd{animation:fd .7s cubic-bezier(.34,1.56,.64,1) both}
.ani-pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes fd{from{opacity:0;transform:translateY(-50px) scale(.6)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}

#cv{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10000}

@media(max-height:620px){
  #title h1{font-size:1.8rem}
  #title .big-emoji{font-size:4.2rem}
  .mode{padding:12px 8px;font-size:1.05rem}
  #question{font-size:1.6rem}
  #emoji{font-size:min(5.5rem,16vw);margin:6px 0}
  .opt{padding:10px 4px;font-size:1.05rem}
  #pill{font-size:1.35rem;padding:10px 24px}
  .zone{padding:14px 6px;font-size:.95rem;min-height:70px}
  #sort{gap:18px}
  #nxt{padding:12px 30px;font-size:1.15rem}
}
</style>
</head>
<body>

<div id="game">
  <div id="cornerBtns">
    <button type="button" class="cbtn" id="moreBtn" title="Switch difficulty">😈 Difficult</button>
    <button type="button" class="cbtn" id="endBtn" title="End the game">🏁 End</button>
  </div>
  <div id="counter"></div>

  <div id="title">
    <div class="big-emoji">🍎🤔🍊</div>
    <h1>What's <span>this</span>?</h1>
    <p>Choose the right word — then sort <b>a</b> or <b>an</b>!</p>
    <button type="button" class="mode class" id="startClass">😊 Easy</button>
    <button type="button" class="mode all" id="startAll">😈 Difficult</button>
  </div>

  <div id="quiz">
    <h1 id="question">What's this?</h1>
    <span id="emoji"></span>
    <div id="opts"></div>
  </div>

  <div id="sort">
    <div id="hint">👇 Drag the word to the correct sentence!<br><small style="color:#c5c5c5">(or tap the word, then tap a sentence)</small></div>
    <div id="pill"></div>
    <div id="zones">
      <div id="zA" class="zone">It's a <span class="blk">&nbsp;</span>.</div>
      <div class="sep"></div>
      <div id="zAN" class="zone">It's an <span class="blk">&nbsp;</span>.</div>
    </div>
  </div>

  <button id="nxt">Next Player ▶</button>

  <div id="done">
    <h2>🎉 Amazing Job! 🎉</h2>
    <p id="doneMsg">You sorted every word!</p>
    <button id="again">Play Again 🔄</button>
  </div>

  <div id="splash"><div id="splashTxt">Round 2! 🎉</div><small>new shuffled order</small></div>
</div>

<canvas id="cv"></canvas>

<script>
/* === SOUND KIT (added Oct 2026) === */
let _AC=null;
function _ac(){if(!_AC)_AC=new(window.AudioContext||window.webkitAudioContext)();if(_AC.state==='suspended')_AC.resume();return _AC}
function _t(f,type,dur,vol,del){const c=_ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,c.currentTime+del);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+del+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+del);o.stop(c.currentTime+del+dur)}
function tone(f,type,dur,vol=.2,del=0){try{_t(f,type,dur,vol,del)}catch(e){}}
function sndOK(){tone(523,'sine',.18,.22);tone(659,'sine',.18,.22,.09);tone(784,'sine',.25,.28,.18);tone(1047,'sine',.35,.18,.3)}
function sndNo(){tone(160,'square',.35,.18);tone(120,'sawtooth',.25,.12,.12)}
function sndPop(){try{const c=_ac(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(600,c.currentTime);o.frequency.exponentialRampToValueAtTime(1300,c.currentTime+.07);g.gain.setValueAtTime(.13,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}
function sndNext(){try{const c=_ac(),o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(350,c.currentTime);o.frequency.exponentialRampToValueAtTime(900,c.currentTime+.12);g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}}

/* lvl 0 = class words (unit vocab + apple/orange/banana), lvl 1 = extra challenge words */
const W=[
  {w:"apple",   e:"🍎", a:"an", lvl:0, bg:["#ff6b6b","#c0392b"]},
  {w:"orange",  e:"🍊", a:"an", lvl:0, bg:["#f39c12","#e67e22"]},
  {w:"banana",  e:"🍌", a:"a",  lvl:0, bg:["#f9ca24","#f0932b"]},
  {w:"bag",     e:"👜", a:"a",  lvl:0, bg:["#e17055","#d63031"]},
  {w:"pen",     e:"🖊️", a:"a",  lvl:0, bg:["#2d3436","#636e72"]},
  {w:"pencil",  e:"✏️", a:"a",  lvl:0, bg:["#fdcb6e","#e67e22"]},
  {w:"ruler",   e:"📏", a:"a",  lvl:0, bg:["#74b9ff","#0984e3"]},
  {w:"pencil case",e:"🖍️", a:"a", lvl:0, img:"pencil case.png", bg:["#8e44ad","#9b59b6"]},
  {w:"marker",    e:"🖊️", a:"a",  lvl:0, img:"marker.png", bg:["#e91e63","#c2185b"]},
  {w:"ice cream",e:"🍦",a:"an", lvl:1, bg:["#fdcb6e","#e17055"]},
  {w:"egg",     e:"🥚", a:"an", lvl:1, bg:["#ffeaa7","#dfe6e9"]},
  {w:"drum",    e:"🥁", a:"a",  lvl:1, bg:["#d63031","#e17055"]},
  {w:"ball",    e:"⚽", a:"a",  lvl:1, bg:["#00b894","#00cec9"]},
  {w:"cake",    e:"🎂", a:"a",  lvl:1, bg:["#e84393","#fd79a8"]},
  {w:"flower",  e:"🌸", a:"a",  lvl:1, bg:["#fd79a8","#e84393"]},
  {w:"hat",     e:"🎩", a:"a",  lvl:1, bg:["#2d3436","#6c5ce7"]},
  {w:"bike",    e:"🚲", a:"a",  lvl:1, bg:["#0984e3","#6c5ce7"]}
];

const $=id=>document.getElementById(id);
const game=$('game'),ctr=$('counter'),
  titleEl=$('title'),
  quizEl=$('quiz'),emojiEl=$('emoji'),optsEl=$('opts'),
  sortEl=$('sort'),pill=$('pill'),zonesWrap=$('zones'),zA=$('zA'),zAN=$('zAN'),
  nxtBtn=$('nxt'),doneEl=$('done'),splashEl=$('splash'),splashTxt=$('splashTxt'),
  moreBtn=$('moreBtn'),endBtn=$('endBtn'),
  cv=$('cv'),cx=cv.getContext('2d');

let pool=[],deck=[],idx=0,round=1,cur=null,canDrag=false,dragging=false,rX,rY;
let moreWords=false,started=false;

/* ── confetti ── */
let pts=[],cRun=false;
function rvs(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',rvs);rvs();

function burst(x,y,n=60){
  const C=['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#01a3a4','#f368e0','#ff9f43','#10ac84'];
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2,sp=2+Math.random()*7;
    pts.push({x,y,
      vx:Math.cos(ang)*sp*(.5+Math.random()),
      vy:Math.sin(ang)*sp*(.5+Math.random())-3,
      sz:4+Math.random()*7,
      c:C[Math.random()*C.length|0],
      r:Math.random()*360,rv:(Math.random()-.5)*12,
      l:1,d:.007+Math.random()*.009,
      s:Math.random()>.65
    });
  }
  if(!cRun){cRun=true;tickC()}
}
function tickC(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(let i=pts.length-1;i>=0;i--){
    const p=pts[i];
    p.vy+=.12;p.x+=p.vx;p.y+=p.vy;p.r+=p.rv;p.l-=p.d;
    if(p.l<=0){pts.splice(i,1);continue}
    cx.save();cx.globalAlpha=Math.min(p.l*2,1);
    cx.translate(p.x,p.y);cx.rotate(p.r*Math.PI/180);cx.fillStyle=p.c;
    if(p.s){star(cx,0,0,5,p.sz,p.sz*.45)}else{cx.fillRect(-p.sz/2,-p.sz/3,p.sz,p.sz*.6)}
    cx.restore();
  }
  pts.length?requestAnimationFrame(tickC):(cRun=false,cx.clearRect(0,0,cv.width,cv.height));
}
function star(c,x,y,n,R,r){
  let a=-Math.PI/2,s=Math.PI/n;c.beginPath();
  for(let i=0;i<n;i++){c.lineTo(x+Math.cos(a)*R,y+Math.sin(a)*R);a+=s;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);a+=s}
  c.closePath();c.fill();
}

/* ── helpers ── */
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]]}return b}
function sk(){game.classList.remove('shake');void game.offsetWidth;game.classList.add('shake')}
function pos(e){
  if(e.touches?.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  if(e.changedTouches?.length)return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
  return{x:e.clientX,y:e.clientY};
}
function hit(px,py,r){return px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom}

function setBg(item){
  document.body.style.background=`linear-gradient(135deg,${item.bg[0]},${item.bg[1]})`;
  pill.style.background=`linear-gradient(135deg,${item.bg[0]},${item.bg[1]})`;
}

/* ── deck: shuffled, no repeats until every word has been used, then reshuffle ── */
function buildDeck(avoidLast){
  const oldLast=avoidLast;
  let d,tries=0;
  do{
    d=shuf(pool);
    tries++;
  }while(d.length>1&&oldLast&&d[0].w===oldLast.w&&tries<20);
  return d;
}

function startGame(withMore){
  moreWords=withMore;
  pool=W.filter(w=>withMore||w.lvl===0);
  deck=buildDeck(null);idx=0;round=1;
  started=true;
  titleEl.style.display='none';
  doneEl.style.display='none';nxtBtn.style.display='none';
  moreBtn.classList.toggle('on',withMore);
  moreBtn.textContent=withMore?'😊 Easy':'😈 Difficult';
  quiz();
}

function newRound(){
  const last=deck[deck.length-1];
  deck=buildDeck(last);idx=0;round++;
  splashTxt.textContent=`Round ${round}! 🎉`;
  splashEl.classList.remove('show');void splashEl.offsetWidth;
  splashEl.classList.add('show');
  sndOK();setTimeout(sndOK,250);
  setTimeout(()=>{splashEl.classList.remove('show');quiz()},1400);
}

function quiz(){
  cur=deck[idx];
  ctr.textContent=`${idx+1} / ${deck.length} · round ${round}`;
  quizEl.style.display='flex';
  sortEl.style.display='none';
  nxtBtn.style.display='none';
  setBg(cur);

  if(cur.img){
    emojiEl.innerHTML=`<img src="${cur.img}" alt="${cur.w}" style="max-width:min(16rem,40vw);max-height:min(10rem,26vh);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.18)" onerror="this.parentNode.textContent='${cur.e}'">`;
  }else{
    emojiEl.textContent=cur.e;
  }
  emojiEl.style.animation='none';void emojiEl.offsetWidth;emojiEl.style.animation='';

  const pool3=shuf(pool.filter(w=>w.w!==cur.w)).slice(0,3);
  const four=shuf([cur,...pool3]);
  optsEl.innerHTML='';
  four.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=o.w;
    b.onclick=()=>pick(b,o);
    optsEl.appendChild(b);
  });
}

function pick(btn,ch){
  if(ch.w===cur.w){
    btn.classList.add('yes');
    sndOK();
    optsEl.querySelectorAll('.opt').forEach(b=>b.style.pointerEvents='none');
    const r=emojiEl.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,70);
    emojiEl.style.animation='none';
    setTimeout(goSort,1500);
  }else{
    btn.classList.add('no');sk();sndNo();
    setTimeout(()=>btn.classList.remove('no'),400);
  }
}

function goSort(){
  quizEl.style.display='none';
  sortEl.style.display='flex';

  pill.textContent=cur.w;
  pill.style.transform='';pill.style.opacity='';pill.style.display='';pill.style.transition='';
  pill.classList.remove('ani-fd','drag');
  void pill.offsetWidth;
  pill.classList.add('ani-fd');

  zonesWrap.style.opacity='0';zonesWrap.style.transform='translateY(20px)';zonesWrap.style.transition='';
  zA.className='zone';zA.innerHTML='It\'s a <span class="blk">&nbsp;</span>.';
  zAN.className='zone';zAN.innerHTML='It\'s an <span class="blk">&nbsp;</span>.';

  setTimeout(()=>{
    zonesWrap.style.transition='opacity .4s,transform .4s';
    zonesWrap.style.opacity='1';zonesWrap.style.transform='translateY(0)';
  },350);

  canDrag=false;
  setTimeout(()=>{pill.classList.remove('ani-fd');canDrag=true},900);
}

/* ── drag: real dragging AND tap-tap (tap word, tap zone) ── */
pill.addEventListener('mousedown',ds);
pill.addEventListener('touchstart',ds,{passive:false});
document.addEventListener('mousemove',dm);
document.addEventListener('touchmove',dm,{passive:false});
document.addEventListener('mouseup',de);
document.addEventListener('touchend',de);

function ds(e){
  if(!canDrag)return;e.preventDefault();
  dragging=true;sndPop();
  const p=pos(e);rX=p.x;rY=p.y;
  pill.classList.add('drag');pill.style.transition='none';
}
function dm(e){
  if(!dragging)return;e.preventDefault();
  const p=pos(e),dx=p.x-rX,dy=p.y-rY;
  pill.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;
  const wr=pill.getBoundingClientRect(),mx=wr.left+wr.width/2,my=wr.top+wr.height/2;
  zA.classList.toggle('hov',hit(mx,my,zA.getBoundingClientRect()));
  zAN.classList.toggle('hov',hit(mx,my,zAN.getBoundingClientRect()));
}
function de(e){
  if(!dragging)return;dragging=false;
  pill.classList.remove('drag');
  zA.classList.remove('hov');zAN.classList.remove('hov');
  const wr=pill.getBoundingClientRect(),mx=wr.left+wr.width/2,my=wr.top+wr.height/2;
  if(hit(mx,my,zA.getBoundingClientRect()))drop('a');
  else if(hit(mx,my,zAN.getBoundingClientRect()))drop('an');
  else snap();
}

/* tap a zone = same as dropping the pill there (tap-tap mode) */
zA.addEventListener('click',()=>{if(canDrag&&!dragging)drop('a')});
zAN.addEventListener('click',()=>{if(canDrag&&!dragging)drop('an')});

function drop(art){
  if(art===cur.a){
    canDrag=false;
    sndOK();
    pill.style.transition='opacity .3s';pill.style.opacity='0';
    const z=art==='a'?zA:zAN;
    z.classList.add('ok');
    z.innerHTML=`It's ${art} &nbsp;<strong>${cur.w}</strong>. ✅`;
    const r=z.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,55);
    setTimeout(()=>{
      if(idx<deck.length-1){
        nxtBtn.style.display='block';
        nxtBtn.classList.remove('ani-pop');void nxtBtn.offsetWidth;nxtBtn.classList.add('ani-pop');
      }else{
        nxtBtn.style.display='block';
        nxtBtn.textContent='Next Round ▶';
        nxtBtn.classList.remove('ani-pop');void nxtBtn.offsetWidth;nxtBtn.classList.add('ani-pop');
      }
    },900);
  }else{sk();sndNo();snap()}
}
function snap(){
  pill.style.transition='transform .35s cubic-bezier(.34,1.56,.64,1)';
  pill.style.transform='translate(0,0)';
  setTimeout(()=>{pill.style.transition=''},350);
}

nxtBtn.onclick=()=>{
  sndNext();
  nxtBtn.style.display='none';
  nxtBtn.textContent='Next Player ▶';
  if(idx<deck.length-1){idx++;quiz()}
  else{newRound()}
};

function finish(){
  quizEl.style.display='none';sortEl.style.display='none';nxtBtn.style.display='none';
  $('doneMsg').textContent=`You played ${round} round${round>1?'s':''} — ${pool.length} words!`;
  doneEl.style.display='flex';
  document.body.style.background='linear-gradient(135deg,#f7971e,#ffd200)';
  sndOK();setTimeout(sndOK,350);
  const r=game.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height*.35,120);
  setTimeout(()=>burst(r.left+r.width*.3,r.top+r.height*.5,60),300);
  setTimeout(()=>burst(r.left+r.width*.7,r.top+r.height*.5,60),600);
}

$('again').onclick=()=>{
  sndPop();
  doneEl.style.display='none';
  titleEl.style.display='flex';
  document.body.style.background='linear-gradient(135deg,#667eea,#764ba2)';
  started=false;
};
$('startClass').onclick=()=>startGame(false);
$('startAll').onclick=()=>startGame(true);
moreBtn.onclick=()=>{
  if(!started)return;
  startGame(!moreWords);
  sndPop();
};
endBtn.onclick=()=>{if(started)finish()};

/* show title screen first */
quizEl.style.display='none';
titleEl.style.display='flex';
</script>

<!-- Bilingo game controls: zoom + fullscreen (gear toggle, auto-hide 7s) -->
<style>
  .bilingo-ui {
    position: fixed; right: 12px; bottom: 12px; z-index: 2147483646;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: system-ui, sans-serif;
  }
  .bilingo-ui button {
    width: 48px; height: 48px; border: 0; border-radius: 14px;
    background: rgba(18, 18, 32, .55); color: #fff; font-size: 1.2rem; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    display: grid; place-items: center; transition: background .15s, transform .15s;
  }
  .bilingo-ui button:hover { background: rgba(70, 60, 150, .75); transform: scale(1.08); }
  .bilingo-ui .b-pct { font-size: .95rem; font-weight: 800; color: #fff; opacity: .9;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
  /* the gear always stays; everything else only shows while open */
  .bilingo-ui:not(.open) > *:not(.b-handle) { display: none; }
</style>
<div id="bilingo-ui" class="bilingo-ui">
  <button type="button" class="b-plus" title="Bigger (zoom in)" aria-label="Bigger">+</button>
  <div class="b-pct">100%</div>
  <button type="button" class="b-minus" title="Smaller (zoom out)" aria-label="Smaller">−</button>
  <button type="button" class="b-fs" title="Fullscreen on/off" aria-label="Fullscreen">⛶</button>
  <button type="button" class="b-handle" title="Show / hide controls" aria-label="Show or hide controls">⚙️</button>
</div>
<script>
(function () {
  if (window.__bilingoUI) return;
  window.__bilingoUI = true;
  var bar = document.getElementById('bilingo-ui');
  var pct = bar.querySelector('.b-pct');
  var MIN = 0.5, MAX = 2.5, STEP = 0.1, KEY = 'bilingo-zoom', IDLE = 7000;
  var z = parseFloat(localStorage.getItem(KEY) || '1');
  if (isNaN(z)) z = 1;
  z = Math.min(MAX, Math.max(MIN, z));
  function apply() {
    document.documentElement.style.setProperty('zoom', z);
    pct.textContent = Math.round(z * 100) + '%';
  }
  function shrink() { z = Math.max(MIN, Math.round((z - STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function grow() { z = Math.min(MAX, Math.round((z + STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function toggleFS() {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(function () {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
    poke();
  }
  bar.querySelector('.b-plus').addEventListener('click', grow);
  bar.querySelector('.b-minus').addEventListener('click', shrink);
  bar.querySelector('.b-fs').addEventListener('click', toggleFS);
  bar.querySelector('.b-handle').addEventListener('click', function () {
    bar.classList.toggle('open');
    poke();
  });
  /* collapse 7 s after the last tap anywhere on the bar */
  var idleTimer = null;
  function poke() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { bar.classList.remove('open'); }, IDLE);
  }
  bar.addEventListener('pointerdown', poke);
  apply();
})();
</script>
</body></html>
