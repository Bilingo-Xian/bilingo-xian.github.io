<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Too Sour! — Taste Meter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Nunito',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  color:#fff;padding:10px 12px 30px;overflow-x:hidden;
  background:linear-gradient(135deg,#ff9f43,#ff6b6b 55%,#f368e0);
}
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.topbar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:820px;margin-bottom:6px}
h1{font-size:clamp(1.1em,3.4vw,1.8em);text-shadow:2px 2px 8px rgba(0,0,0,.25)}
.rc{background:rgba(255,255,255,.22);padding:4px 16px;border-radius:20px;font-size:.85em;font-weight:700}

.stage{
  width:100%;max-width:820px;position:relative;
  background:linear-gradient(180deg,#5f27cd,#341f97);
  border:3px solid #feca57;border-radius:24px;
  padding:14px 14px 18px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.curtain{position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg,#f368e0,#feca57,#f368e0,#feca57,#f368e0);border-radius:24px 24px 0 0}
.lights{display:flex;justify-content:center;gap:22px;margin:6px 0 2px;font-size:1.1rem}
.lt{animation:twinkle 2s ease-in-out infinite}
.lt:nth-child(2){animation-delay:.6s}.lt:nth-child(3){animation-delay:1.2s}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}

.badge{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:8px auto 10px;width:fit-content;
  background:rgba(255,255,255,.14);backdrop-filter:blur(8px);
  padding:8px 30px;border-radius:50px;
  font-size:clamp(1.2em,3.6vw,2em);font-weight:900;
  border:2px solid rgba(255,255,255,.3);
  animation:pulse 2.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

.banner{
  width:100%;max-width:640px;margin:0 auto 10px;min-height:64px;
  background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.35);
  border-radius:18px;padding:12px 16px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;gap:4px;
  font-size:clamp(.95em,2.3vw,1.45em);font-weight:900;line-height:1.35;
  transition:.35s;
}
.banner.solid{border-style:solid;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.16)}
.banner .row{animation:fadeUp .35s ease-out;line-height:1.5}
.banner .row.oneline{white-space:nowrap}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.prompt{
  text-align:center;font-size:clamp(.85em,2.2vw,1.05em);font-weight:700;
  color:rgba(255,255,255,.9);margin:2px 0 10px;min-height:1.6em;
  text-shadow:1px 1px 4px rgba(0,0,0,.2);
}

.foodie{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0 auto 8px}
.foodrow{display:flex;align-items:flex-end;gap:8px}
.foodie .big{font-size:clamp(3.6em,12vw,6em);line-height:1.1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35));animation:a-wobble 1.8s ease-in-out infinite}
.foodie .fname{font-size:clamp(1.1em,3vw,1.7em);font-weight:900;text-shadow:1px 1px 4px rgba(0,0,0,.3)}
@keyframes a-wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
/* tasting face that reacts */
.taster{font-size:clamp(1.6em,4.5vw,2.4em);filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}

/* option cards */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px;margin:0 auto 10px}
.opt{
  border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer;user-select:none;
  font-weight:900;font-size:clamp(.9em,2.4vw,1.25em);line-height:1.25;
  border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);
  transition:all .2s;
}
.opt:hover{transform:scale(1.04);border-color:#feca57;background:rgba(254,202,87,.18)}
@keyframes wrongShake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-12px)}20%,40%,60%,80%{transform:translateX(12px)}}
.opt.wrong{animation:wrongShake .5s ease;border-color:#ff3333!important;box-shadow:0 0 35px rgba(255,0,0,.5)!important}
@keyframes correctGlow{0%{box-shadow:0 0 0 rgba(254,202,87,0)}50%{box-shadow:0 0 50px rgba(254,202,87,.85)}100%{box-shadow:0 0 15px rgba(254,202,87,.4)}}
.opt.correct{border-color:#feca57!important;animation:correctGlow .8s ease;background:rgba(254,202,87,.25)}
.opt.dim{opacity:.4;filter:grayscale(.6)}
.opt .oe{display:block;font-size:1.4em;margin-bottom:2px}

.mainbtn{
  display:block;margin:6px auto 0;
  padding:14px 44px;font-size:clamp(1em,2.6vw,1.25em);font-weight:900;
  background:linear-gradient(135deg,#feca57,#ff9f43);color:#5f27cd;
  border:none;border-radius:50px;cursor:pointer;font-family:'Nunito',sans-serif;
  box-shadow:0 8px 26px rgba(254,202,87,.4);transition:all .25s;
  animation:glow 2s ease-in-out infinite;
}
.mainbtn:hover{transform:scale(1.06)}
.mainbtn:active{transform:scale(.97)}
.mainbtn.hide{display:none}
.mainbtn.green{background:linear-gradient(135deg,#34d399,#10b981);color:#022c22;box-shadow:0 8px 26px rgba(16,185,129,.4)}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}

.popup{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(2em,8vw,4em);font-weight:900;z-index:1000;pointer-events:none;text-shadow:3px 3px 12px rgba(0,0,0,.35);opacity:0}
.popup.show{animation:popIn 1.2s ease forwards}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(0);opacity:0}20%{transform:translate(-50%,-50%) scale(1.3);opacity:1}40%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

@media(max-width:560px){
  .opts{gap:8px}
  .banner .row.oneline{white-space:normal}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="topbar">
  <h1>👅 Too Sour! — Taste Meter 🍋</h1>
  <div class="rc" id="rc">Taste 1</div>
</div>

<div class="stage">
  <div class="curtain"></div>
  <div class="lights"><span class="lt">💡</span><span class="lt">🔦</span><span class="lt">💡</span></div>

  <div class="badge" id="badge">🍋 lemonade</div>
  <div class="foodie">
    <div class="foodrow">
      <div class="big" id="femoji">🍋</div>
      <div class="taster" id="taster">🧒</div>
    </div>
    <div class="fname" id="fname">lemonade</div>
  </div>

  <div class="banner" id="banner"></div>
  <div class="prompt" id="prompt">…</div>
  <div class="opts" id="opts"></div>

  <button class="mainbtn" id="mainBtn">…</button>
</div>

<div class="popup" id="popup"></div>

<script>
/* ============ AUDIO (synth effects only — no voice) ============ */
let AC;
function initAudio(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}
function tone(f,type,dur,vol=.25,del=0){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,AC.currentTime+del);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+del+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(AC.currentTime+del);o.stop(AC.currentTime+del+dur);
}
function sndCheer(){
  initAudio();
  const dur=.9,sr=AC.sampleRate,buf=AC.createBuffer(1,sr*dur,sr),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);
  const src=AC.createBufferSource();src.buffer=buf;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.8;
  const g=AC.createGain();g.gain.setValueAtTime(.5,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  src.connect(bp);bp.connect(g);g.connect(AC.destination);src.start();
  for(let i=0;i<5;i++)tone(500+Math.random()*500,'sine',.18,.1,Math.random()*.5);
}
function sndCorrect(){initAudio();tone(523,'sine',.18,.22,0);tone(659,'sine',.18,.22,.09);tone(784,'sine',.25,.28,.18);tone(1047,'sine',.35,.18,.3)}
function sndWrong(){initAudio();tone(160,'square',.35,.18);tone(120,'sawtooth',.25,.12,.12)}
function sndNext(){initAudio();
  const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';
  o.frequency.setValueAtTime(350,AC.currentTime);o.frequency.exponentialRampToValueAtTime(900,AC.currentTime+.12);
  g.gain.setValueAtTime(.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.18);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.18);
}
function sndReveal(){initAudio();tone(660,'triangle',.12,.15,0);tone(880,'triangle',.14,.15,.08);tone(1100,'triangle',.2,.18,.16)}

/* ============ CONFETTI ============ */
const cvs=document.getElementById('confetti'),cx=cvs.getContext('2d');
let pts=[],afr=null;
function rCvs(){cvs.width=innerWidth;cvs.height=innerHeight}
addEventListener('resize',rCvs);rCvs();
function boom(x,y,n=120){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*14+4;
    pts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,
      col:['#ffe66d','#ff6b6b','#4ecdc4','#45b7d1','#f9ca24','#ff9ff3','#feca57','#00d2d3','#ff6348','#7bed9f'][~~(Math.random()*10)],
      sz:Math.random()*7+3,life:1,rot:Math.random()*360,rs:(Math.random()-.5)*15,
      sh:Math.random()>.4?'r':'c'});}
  if(!afr)aLoop();
}
function fireworks(){
  boom(innerWidth*.25,innerHeight*.3,90);setTimeout(()=>boom(innerWidth*.75,innerHeight*.25,90),180);
  setTimeout(()=>boom(innerWidth*.5,innerHeight*.2,110),360);
}
function aLoop(){cx.clearRect(0,0,cvs.width,cvs.height);
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx;p.vy+=.22;p.y+=p.vy;p.vx*=.99;p.life-=.01;p.rot+=p.rs;
    if(p.life<=0||p.y>cvs.height+30){pts.splice(i,1);continue}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot*Math.PI/180);cx.globalAlpha=Math.min(1,p.life*2.5);cx.fillStyle=p.col;
    if(p.sh==='r')cx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.6);
    else{cx.beginPath();cx.arc(0,0,p.sz/2,0,Math.PI*2);cx.fill()}
    cx.restore();}
  if(pts.length>0)afr=requestAnimationFrame(aLoop);else{afr=null;cx.clearRect(0,0,cvs.width,cvs.height);}
}

/* ============ DATA ============
   correct = the tap-target option label; opts = the 4 choices for that product */
const TASTES=[
  {w:'lemonade',e:'🍋',face:'😖',
   sub:'This lemonade',be:'is',mid:'too',adj:'sour',correct:'too sour 🍋',
   full:'This lemonade is <b>too sour</b>!',
   opts:['too sour 🍋','too salty 🧂','too bitter 😝','not sour enough 🙃']},
  {w:'waffles',e:'🧇',face:'😕',
   sub:'These waffles',be:"aren't",mid:'',adj:'sweet',enough:true,correct:'not sweet enough 🧇',
   full:"These waffles <b>aren't sweet enough</b>!",
   opts:['not sweet enough 🧇','not bitter enough 🙃','too sour 🍋','too salty 🧂']},
  {w:'coffee',e:'☕',face:'🤢',
   sub:'This coffee',be:'is',mid:'too',adj:'bitter',correct:'too bitter ☕',
   full:'This coffee is <b>too bitter</b>!',
   opts:['too bitter ☕','too sour 🍋','too salty 🧂','not bitter enough 🙃']},
  {w:'fries',e:'🍟',face:'🥵',
   sub:'These fries',be:'are',mid:'too',adj:'salty',correct:'too salty 🍟',
   full:'These fries are <b>too salty</b>!',
   opts:['too salty 🍟','too sour 🍋','too bitter 😝','not salty enough 🙃']},
  {w:'pancake',e:'🥞',face:'🤮',
   sub:'This pancake',be:'is',mid:'too',adj:'sweet',correct:'too sweet 🥞',
   full:'This pancake is <b>too sweet</b>!',
   opts:['too sweet 🥞','too sour 🍋','too bitter 😝','not sour enough 🙃']}
];

/* ============ STATE ============ */
let round=0,phase='',locked=false,cur=null,used=[];

const $=id=>document.getElementById(id);
const banner=$('banner'),prompt=$('prompt'),mainBtn=$('mainBtn'),opts=$('opts');

function pickTaste(){
  if(used.length>=TASTES.length)used=[];
  const pool=TASTES.filter(t=>!used.includes(t));
  const t=pool[~~(Math.random()*pool.length)];
  used.push(t);return t;
}
function popup(txt){
  const p=$('popup');p.textContent=txt;p.className='popup show';
  setTimeout(()=>p.className='popup',1300);
}

/* ============ RENDERING ============ */
function solidBanner(html){
  banner.className='banner solid';
  banner.innerHTML=`<div class="row oneline">${html}</div>`;
}
function setPrompt(t){prompt.textContent=t}
function setBtn(label,fn,cls){
  mainBtn.className='mainbtn'+(cls?' '+cls:'');
  mainBtn.textContent=label;
  mainBtn.onclick=fn;
}
function hideBtn(){mainBtn.classList.add('hide')}
function showBtn(){mainBtn.classList.remove('hide')}

function buildOpts(){
  const four=[...cur.opts].sort(()=>Math.random()-.5);
  opts.innerHTML=four.map(o=>{
    const e=o.match(/(\p{Extended_Pictographic})/u);
    return `<div class="opt" data-o="${o}"><span class="oe">${e?e[0]:'👅'}</span>${o.replace(/ \S+$/,'')}</div>`;
  }).join('');
  opts.querySelectorAll('.opt').forEach(el=>el.onclick=()=>tap(el));
}

/* ============ FLOW ============ */
function newRound(){
  round++;locked=false;
  cur=pickTaste();
  $('rc').textContent='Taste '+round;
  $('badge').textContent=cur.e+' '+cur.w;
  $('femoji').textContent=cur.e;
  $('fname').textContent=cur.w;
  $('taster').textContent='🧒';
  phaseTaste();
}

function phaseTaste(){
  phase='taste';
  banner.className='banner solid';
  banner.innerHTML='<div class="row">🍴 <b>Time to taste!</b></div>';
  setPrompt('😝 Taste it! What is wrong? TAP it!');
  buildOpts();
  hideBtn();
}
function phaseSentence(){
  phase='sentence';showBtn();
  $('taster').textContent=cur.face;
  banner.className='banner solid';
  banner.innerHTML='<div class="row">🙈 <b>Words hidden!</b> Say the sentence first!</div>';
  setPrompt('🗣️ Everyone make the sentence about the '+cur.w+'!');
  setBtn('Reveal Sentence 👀',phaseReveal);
}
function phaseReveal(){
  phase='reveal';sndReveal();
  solidBanner(cur.full);
  setPrompt('🔁 Everyone say it again!');
  setBtn('Discuss! 💬',phaseDiscuss,'green');
  fireworks();
}
function phaseDiscuss(){
  phase='discuss';
  solidBanner('Do you like <b>'+cur.w+'</b>? Why? 🤔');
  setPrompt('🗣️ Tell your partner — do you like '+cur.w+'? Why?');
  setBtn('Next Taste ▶ 👅',newRound,'green');
}

/* ============ TAPPING ============ */
function tap(el){
  if(locked||phase!=='taste')return;initAudio();
  const correct=(el.dataset.o===cur.correct);
  if(correct){
    locked=true;sndCorrect();sndCheer();
    el.classList.add('correct');
    opts.querySelectorAll('.opt').forEach(o=>{if(o!==el)o.classList.add('dim');o.onclick=null});
    const r=el.getBoundingClientRect();
    boom(r.left+r.width/2,r.top+r.height/2,140);
    setTimeout(()=>boom(r.left+r.width*.3,r.top+r.height*.3,60),200);
    setTimeout(()=>boom(r.left+r.width*.7,r.top+r.height*.7,60),350);
    popup(['🎉 YES!','⭐ Wonderful!','🏆 Amazing!','👅 Yucky!','🔥 Bravo!'][~~(Math.random()*5)]);
    setTimeout(()=>{locked=false;phaseSentence()},1500);
  }else{
    sndWrong();el.classList.add('wrong');
    setTimeout(()=>el.classList.remove('wrong'),600);
  }
}

newRound();
</script>
</body>
</html>
