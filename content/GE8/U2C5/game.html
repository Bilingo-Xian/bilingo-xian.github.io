<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good for You? Ask &amp; Sort!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Nunito',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  color:#4a2b52;padding:10px 12px 30px;overflow-x:hidden;
  background:linear-gradient(135deg,#ffd9ec,#dbe7ff);
}
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.topbar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:820px;margin-bottom:6px;gap:8px}
h1{font-size:clamp(1.1em,3.4vw,1.8em);text-shadow:1px 1px 0 rgba(255,255,255,.6)}
.top-right{display:flex;align-items:center;gap:8px}
.rc{background:rgba(255,255,255,.7);padding:4px 16px;border-radius:20px;font-size:.85em;font-weight:900;white-space:nowrap;border:2px solid rgba(74,43,82,.15)}
.icon-btn{
  background:rgba(255,255,255,.7);border:2px solid rgba(74,43,82,.3);color:#4a2b52;
  border-radius:50%;width:38px;height:38px;font-size:1.1rem;cursor:pointer;
  transition:transform .15s;flex-shrink:0;
}
.icon-btn:hover{transform:scale(1.1)}
.icon-btn.off{opacity:.45}

.stage{
  width:100%;max-width:820px;position:relative;
  background:linear-gradient(180deg,#ffffff,#fff0f7);
  border:3px solid #f9a8d4;border-radius:24px;
  padding:12px 14px 16px;
  box-shadow:0 20px 50px rgba(190,120,170,.35);
  display:flex;flex-direction:column;
}
.curtain{position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg,#f9a8d4,#93c5fd,#f9a8d4,#93c5fd,#f9a8d4);border-radius:24px 24px 0 0}

.rolechip{
  align-self:center;margin:6px auto 4px;
  background:rgba(255,255,255,.8);border:2px solid #e9d5ff;
  padding:5px 18px;border-radius:30px;font-weight:900;
  font-size:clamp(.8em,2.4vw,1em);letter-spacing:.5px;color:#4a2b52;
}
.rolechip .ask{color:#0e7490}
.rolechip .drag{color:#b45309}

/* the big food on stage, flanked by thumbs */
.foodrow{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,34px);margin:4px 0 8px}
.foodie{display:flex;flex-direction:column;align-items:center;gap:2px}
.foodie .big{
  font-size:clamp(4em,13vw,6.5em);line-height:1.1;
  filter:drop-shadow(0 8px 16px rgba(74,43,82,.3));
  animation:a-bounce 1.8s ease-in-out infinite;cursor:pointer;user-select:none;
  transition:transform .2s,filter .2s;
}
.foodie .big.selected{animation:none;transform:scale(1.14);filter:drop-shadow(0 0 22px rgba(249,168,212,.95))}
.foodie .big.nope{animation:a-shake .5s ease}
.foodie .fname{font-size:clamp(1.1em,3.2vw,1.7em);font-weight:900}
@keyframes a-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes a-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
.thumb{font-size:clamp(2.2em,7vw,3.4em);cursor:pointer;user-select:none;filter:drop-shadow(0 4px 8px rgba(74,43,82,.25));transition:transform .15s}
.thumb:hover{transform:scale(1.15)}
.thumb.wobble{animation:a-wobble .5s ease}
@keyframes a-wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg) scale(1.2)}75%{transform:rotate(18deg) scale(1.2)}}
.thumbs-gone .thumb{opacity:0;pointer-events:none;transform:scale(.4);transition:all .3s}

.banner{
  width:100%;max-width:640px;margin:0 auto 8px;min-height:60px;
  background:rgba(255,255,255,.85);border:3px dashed #e3b8d8;
  border-radius:18px;padding:10px 16px;text-align:center;color:#4a2b52;
  display:flex;flex-direction:column;justify-content:center;gap:4px;
  font-size:clamp(.95em,2.4vw,1.4em);font-weight:900;line-height:1.35;transition:.35s;
}
.banner.solid{border-style:solid;border-color:#c084fc;background:rgba(255,255,255,.95)}
.banner .row{animation:fadeUp .35s ease-out}
.banner b{color:#0e7490}
.banner .badword{color:#dc2626}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.prompt{
  text-align:center;font-size:clamp(.85em,2.2vw,1.05em);font-weight:800;
  color:#6b4a75;margin:0 0 8px;min-height:1.6em;
}

.mainbtn{
  display:block;margin:2px auto 12px;
  padding:13px 40px;font-size:clamp(1em,2.6vw,1.2em);font-weight:900;
  background:linear-gradient(135deg,#a3e635,#65a30d);color:#14532d;
  border:none;border-radius:50px;cursor:pointer;font-family:'Nunito',sans-serif;
  box-shadow:0 8px 26px rgba(101,163,13,.4);transition:all .25s;
  animation:glow 2s ease-in-out infinite;
}
.mainbtn:hover{transform:scale(1.06)}
.mainbtn:active{transform:scale(.97)}
.mainbtn.hide{display:none}
.mainbtn.green{background:linear-gradient(135deg,#34d399,#10b981);color:#022c22;box-shadow:0 8px 26px rgba(16,185,129,.4)}
.mainbtn.blue{background:linear-gradient(135deg,#93c5fd,#3b82f6);color:#1e3a8a;box-shadow:0 8px 26px rgba(59,130,246,.4)}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}

/* ---------- the three BIG collecting boxes (always on screen) ---------- */
.boxes{display:flex;justify-content:center;gap:12px;width:100%;max-width:680px;margin:0 auto}
.box{
  flex:1;border-radius:20px;padding:10px 8px 12px;text-align:center;
  border:4px solid;user-select:none;cursor:pointer;
  transition:transform .15s,box-shadow .2s;
  display:flex;flex-direction:column;gap:6px;min-height:168px;
  box-shadow:0 6px 16px rgba(74,43,82,.15);
}
.box:hover{transform:scale(1.03);box-shadow:0 10px 24px rgba(74,43,82,.22)}
.box.good{background:#bbf7d0;border-color:#16a34a;color:#14532d}
.box.okay{background:#fef08a;border-color:#ca8a04;color:#713f12}
.box.bad{background:#fecaca;border-color:#dc2626;color:#7f1d1d}
.box.drag-over{transform:scale(1.07)}
.box .bh{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.box .zi{font-size:clamp(1.8em,5vw,2.4em)}
.box .blabel{font-weight:900;font-size:clamp(.78em,2.4vw,1em);line-height:1.15}
/* the physical play area inside each box */
.pile{
  position:relative;flex:1;min-height:88px;border-radius:14px;
  background:rgba(255,255,255,.55);
}
.box.ready .pile{border:3px dashed rgba(74,43,82,.35)}
.pile span{
  position:absolute;left:0;top:0;font-size:3em;line-height:1;
  will-change:transform;user-select:none;pointer-events:none;
}
@keyframes boxShake{0%,100%{transform:translateX(0) rotate(0)}15%,45%,75%{transform:translateX(-9px) rotate(-2deg)}30%,60%,90%{transform:translateX(9px) rotate(2deg)}}
.box.shake{animation:boxShake .5s ease}
@keyframes wrongShake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-12px)}20%,40%,60%,80%{transform:translateX(12px)}}
.box.wrong{animation:wrongShake .5s ease;border-color:#7f1d1d!important;box-shadow:0 0 0 4px rgba(220,38,38,.45)!important}

/* flying food clone */
.flyer{position:fixed;z-index:998;pointer-events:none;font-size:clamp(3em,10vw,5em);transition:all .45s ease-in;transform:translate(-50%,-50%)}

.popup{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(2em,8vw,4em);font-weight:900;z-index:1000;pointer-events:none;text-shadow:3px 3px 12px rgba(74,43,82,.4);opacity:0}
.popup.show{animation:popInBig 1.2s ease forwards}
@keyframes popInBig{0%{transform:translate(-50%,-50%) scale(0);opacity:0}20%{transform:translate(-50%,-50%) scale(1.3);opacity:1}40%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

@media(max-width:560px){
  .boxes{gap:7px}
  .box{min-height:148px;padding:8px 5px 10px;border-width:3px}
  .pile{min-height:76px}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="topbar">
  <h1>🥗 Good for You? Ask &amp; Sort! 💪</h1>
  <div class="top-right">
    <div class="rc" id="rc">Food 1</div>
    <button class="icon-btn" id="soundBtn" onclick="toggleSound()" title="Sound on/off">🔊</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="curtain"></div>

  <div class="rolechip" id="rolechip"></div>

  <div class="foodrow" id="foodrow">
    <div class="thumb" id="thumbUp" title="Good?">👍</div>
    <div class="foodie">
      <div class="big" id="femoji">🥬</div>
      <div class="fname" id="fname">lettuce</div>
    </div>
    <div class="thumb" id="thumbDown" title="Bad?">👎</div>
  </div>

  <div class="banner" id="banner"></div>
  <div class="prompt" id="prompt">…</div>
  <button class="mainbtn" id="mainBtn">…</button>

  <div class="boxes">
    <div class="box good" id="boxGood" data-cat="good">
      <div class="bh"><span class="zi">😋</span><span class="blabel">GOOD<br>for you!</span></div>
      <div class="pile" id="pileGood"></div>
    </div>
    <div class="box okay" id="boxOkay" data-cat="okay">
      <div class="bh"><span class="zi">😐</span><span class="blabel">OKAY...<br>a little is fine</span></div>
      <div class="pile" id="pileOkay"></div>
    </div>
    <div class="box bad" id="boxBad" data-cat="bad">
      <div class="bh"><span class="zi">🤢</span><span class="blabel">BAD<br>for you!</span></div>
      <div class="pile" id="pileBad"></div>
    </div>
  </div>
</div>

<div class="popup" id="popup"></div>

<script>
/* ============ AUDIO (synth effects only — NO robotic voice) ============ */
let AC,soundOn=true;
function initAudio(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}
function tone(f,type,dur,vol=.25,del=0){
  if(!AC||!soundOn)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,AC.currentTime+del);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+del+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(AC.currentTime+del);o.stop(AC.currentTime+del+dur);
}
function sndCheer(){
  initAudio();if(!soundOn)return;
  const dur=.9,sr=AC.sampleRate,buf=AC.createBuffer(1,sr*dur,sr),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);
  const src=AC.createBufferSource();src.buffer=buf;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.8;
  const g=AC.createGain();g.gain.setValueAtTime(.5,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  src.connect(bp);bp.connect(g);g.connect(AC.destination);src.start();
  for(let i=0;i<5;i++)tone(500+Math.random()*500,'sine',.18,.1,Math.random()*.5);
}
function sndCorrect(){initAudio();tone(523,'sine',.18,.22,0);tone(659,'sine',.18,.22,.09);tone(784,'sine',.25,.28,.18);tone(1047,'sine',.35,.18,.3)}
function sndWrong(){initAudio();tone(160,'square',.35,.18);tone(120,'sawtooth',.25,.12,.12)}
function sndNext(){initAudio();
  const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';
  o.frequency.setValueAtTime(350,AC.currentTime);o.frequency.exponentialRampToValueAtTime(900,AC.currentTime+.12);
  g.gain.setValueAtTime(.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.18);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.18);
}
function sndReveal(){initAudio();tone(660,'triangle',.12,.15,0);tone(880,'triangle',.14,.15,.08);tone(1100,'triangle',.2,.18,.16)}
function sndPop(){initAudio();tone(700,'sine',.07,.16);tone(1050,'sine',.08,.14,.05)}
function sndFanfare(){initAudio();[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,'triangle',.18,.2,i*.12))}
function toggleSound(){
  soundOn=!soundOn;
  $('soundBtn').textContent=soundOn?'🔊':'🔇';
  $('soundBtn').classList.toggle('off',!soundOn);
  if(soundOn)sndPop();
}

/* ============ CONFETTI ============ */
const cvs=document.getElementById('confetti'),cx=cvs.getContext('2d');
let pts=[],afr=null;
function rCvs(){cvs.width=innerWidth;cvs.height=innerHeight}
addEventListener('resize',rCvs);rCvs();
function boom(x,y,n=120){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*14+4;
    pts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,
      col:['#ffe66d','#ff6b6b','#4ecdc4','#45b7d1','#f9ca24','#ff9ff3','#feca57','#00d2d3','#ff6348','#7bed9f'][~~(Math.random()*10)],
      sz:Math.random()*7+3,life:1,rot:Math.random()*360,rs:(Math.random()-.5)*15,
      sh:Math.random()>.4?'r':'c'});}
  if(!afr)aLoop();
}
function aLoop(){cx.clearRect(0,0,cvs.width,cvs.height);
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx;p.vy+=.22;p.y+=p.vy;p.vx*=.99;p.life-=.01;p.rot+=p.rs;
    if(p.life<=0||p.y>cvs.height+30){pts.splice(i,1);continue}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot*Math.PI/180);cx.globalAlpha=Math.min(1,p.life*2.5);cx.fillStyle=p.col;
    if(p.sh==='r')cx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.6);
    else{cx.beginPath();cx.arc(0,0,p.sz/2,0,Math.PI*2);cx.fill()}
    cx.restore();}
  if(pts.length>0)afr=requestAnimationFrame(aLoop);else{afr=null;cx.clearRect(0,0,cvs.width,cvs.height);}
}

/* ============ PILE PHYSICS ============
   Every emoji in a box is a little physical object: gravity, wall bounces,
   pairwise collisions, and it settles LYING ON ITS SIDE. Reusable block:
   items in piles[cat] have {el,cat,r,x,y,vx,vy,rot,vrot,rest}. */
const piles={good:[],okay:[],bad:[]};
let physOn=false;
function cap(c){return c[0].toUpperCase()+c.slice(1)}
function pileSize(cat){
  const p=$('pile'+cap(cat));
  return {w:p.clientWidth||160,h:p.clientHeight||88};
}
function styleIt(it){
  it.el.style.transform=`translate(${it.x-it.r}px,${it.y-it.r}px) rotate(${it.rot}deg)`;
}
function wakePile(cat){
  piles[cat].forEach(it=>it.rest=false);
  if(!physOn){physOn=true;requestAnimationFrame(physTick)}
}
function settle(it){
  /* plop down lying on its side */
  const dir=Math.random()<.5?-1:1;
  it.rot=dir*(70+Math.random()*40);
  it.vx=it.vy=it.vrot=0;it.rest=true;
  styleIt(it);
}
function physTick(){
  let busy=false;
  for(const cat of ['good','okay','bad']){
    const items=piles[cat];
    if(!items.length)continue;
    const {w,h}=pileSize(cat);
    /* pairwise collisions — circles */
    for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
      const a=items[i],b=items[j];
      let dx=b.x-a.x,dy=b.y-a.y;
      const min=a.r+b.r,d2=dx*dx+dy*dy;
      if(d2>0&&d2<min*min){
        const d=Math.sqrt(d2),ov=(min-d)/2;dx/=d;dy/=d;
        a.x-=dx*ov;a.y-=dy*ov;b.x+=dx*ov;b.y+=dy*ov;
        const av=a.vx*dx+a.vy*dy,bv=b.vx*dx+b.vy*dy,imp=(av-bv)*.5;
        a.vx-=imp*dx;a.vy-=imp*dy;b.vx+=imp*dx;b.vy+=imp*dy;
        a.vrot+=(Math.random()-.5)*3;b.vrot+=(Math.random()-.5)*3;
        a.rest=b.rest=false;
      }
    }
    for(const it of items){
      if(it.rest)continue;
      busy=true;
      it.vy+=.55;it.vx*=.995;it.vrot*=.985;
      it.x+=it.vx;it.y+=it.vy;it.rot+=it.vrot;
      if(it.x<it.r){it.x=it.r;it.vx=Math.abs(it.vx)*.55}
      if(it.x>w-it.r){it.x=w-it.r;it.vx=-Math.abs(it.vx)*.55}
      if(it.y<it.r){it.y=it.r;it.vy=Math.abs(it.vy)*.5}
      if(it.y>h-it.r){
        it.y=h-it.r;
        it.vy=-Math.abs(it.vy)*.45;
        it.vx*=.88;it.vrot*=.8;
        if(Math.abs(it.vy)<.9)it.vy=0;
      }
      if(!it.vy&&Math.abs(it.vx)+Math.abs(it.vrot)<.4&&it.y>=h-it.r-2)settle(it);
      styleIt(it);
    }
  }
  if(busy)requestAnimationFrame(physTick);else physOn=false;
}
function spawnInPile(cat,emoji){
  const pile=$('pile'+cap(cat));
  const s=document.createElement('span');
  s.textContent=emoji;
  pile.appendChild(s);
  const {w,h}=pileSize(cat);
  const it={el:s,cat,r:20,
    x:20+Math.random()*Math.max(10,w-40),y:8,
    vx:(Math.random()-.5)*5,vy:1,
    rot:(Math.random()-.5)*40,vrot:(Math.random()-.5)*14,rest:false};
  piles[cat].push(it);
  styleIt(it);wakePile(cat);
  sndPop();
}
function shakeBox(box){
  const cat=box.dataset.cat;
  box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
  for(const it of piles[cat]){
    if(it.rest){
      it.vx+=(Math.random()-.5)*13;
      it.vy=-(5+Math.random()*7);
      it.vrot+=(Math.random()-.5)*22;
      it.rest=false;
    }else{
      it.vx+=(Math.random()-.5)*7;
      it.vy-=3+Math.random()*4;
    }
  }
  wakePile(cat);
}

/* ============ DATA ============
   cat is the expected answer for good/bad; OKAY always accepts
   (kids justify their own reasoning). */
const FOODS=[
  {w:'lettuce',e:'🥬',cat:'good'},
  {w:'onion',  e:'🧅',cat:'good'},
  {w:'apple',  e:'🍎',cat:'good'},
  {w:'milk',   e:'🥛',cat:'good'},
  {w:'rice',   e:'🍚',cat:'good'},
  {w:'bread',  e:'🍞',cat:'good'},
  {w:'egg',    e:'🥚',cat:'good'},
  {w:'juice',  e:'🧃',cat:'bad'},
  {w:'oil',    e:'🛢️',cat:'bad'},
  {w:'salt',   e:'🧂',cat:'bad'},
  {w:'sauce',  e:'🥫',cat:'bad'},
  {w:'cola',   e:'🥤',cat:'bad'}
];
const WHYQ={
  good:'Why is it <b>good</b> for you? 🤔',
  okay:'Why is it <b>just okay</b>? 🤔',
  bad: 'Why is it <b>bad</b> for you? 🤔'
};

/* ============ STATE ============ */
let round=0,phase='',locked=false,cur=null,used=[],selected=false,askerA=true;

const $=id=>document.getElementById(id);
const banner=$('banner'),prompt=$('prompt'),mainBtn=$('mainBtn'),femoji=$('femoji');

function pickFood(){
  if(used.length>=FOODS.length)used=[];
  const pool=FOODS.filter(f=>!used.includes(f));
  const f=pool[~~(Math.random()*pool.length)];
  used.push(f);return f;
}
function popup(txt){
  const p=$('popup');p.textContent=txt;p.className='popup show';
  setTimeout(()=>p.className='popup',1300);
}
function solidBanner(html){banner.className='banner solid';banner.innerHTML=`<div class="row">${html}</div>`}
function setPrompt(t){prompt.textContent=t}
function setBtn(label,fn,cls){
  mainBtn.className='mainbtn'+(cls?' '+cls:'');
  mainBtn.textContent=label;
  mainBtn.onclick=fn;
}
function showBtn(){mainBtn.classList.remove('hide')}
function hideBtn(){mainBtn.classList.add('hide')}
function setBoxesReady(on){
  for(const cat of ['good','okay','bad'])$('box'+cap(cat)).classList.toggle('ready',on);
}

/* ============ ROUND FLOW ============ */
function newRound(){
  round++;locked=false;selected=false;
  cur=pickFood();
  $('rc').textContent='Food '+round;
  femoji.textContent=cur.e;
  femoji.classList.remove('selected','nope');
  $('fname').textContent=cur.w;
  $('foodrow').classList.remove('thumbs-gone');
  askerA=!askerA;
  $('rolechip').innerHTML=askerA
    ?'👦 <span class="ask">Kid A ASKS 🗣️</span> • 👧 <span class="drag">Kid B DRAGS 👆</span>'
    :'👧 <span class="ask">Kid B ASKS 🗣️</span> • 👦 <span class="drag">Kid A DRAGS 👆</span>';
  setBoxesReady(false);
  phaseGuess();
}

function phaseGuess(){
  phase='guess';showBtn();
  banner.className='banner';
  banner.innerHTML='<div class="row">🙈 <b>Guess first!</b> Good 👍 or bad 👎?</div>';
  setPrompt('👆 Tap the food! Tap a thumb! Then ask the question!');
  setBtn('Ask the Question 🗣️',phaseQuestion,'blue');
}

function phaseQuestion(){
  phase='question';sndReveal();showBtn();
  $('foodrow').classList.add('thumbs-gone');
  solidBanner(`Is the <b>${cur.w}</b> good for you? 👍👎`);
  setPrompt(askerA?'🗣️ Kid A asks! Kid B — drag the food into a box! 👇':'🗣️ Kid B asks! Kid A — drag the food into a box! 👇');
  setBoxesReady(true);
  hideBtn();
  popup('🗣️');
}

function phaseWhy(chosen){
  phase='why';showBtn();
  solidBanner(WHYQ[chosen]);
  setPrompt('🗣️ Discuss! Give a reason — YOU decide if it is a good one!');
  setBtn('⭐ We answered! ▶ 🥗',newRound,'green');
}

/* ============ DROPPING ============ */
function attempt(cat){
  if(locked||phase!=='question')return;initAudio();
  const box=$('box'+cap(cat));
  if(cat===cur.cat||cat==='okay'){
    locked=true;selected=false;femoji.classList.remove('selected');
    sndCorrect();sndFanfare();sndCheer();
    flyToBox(box);
    setTimeout(()=>{spawnInPile(cat,cur.e);shakeBox(box);setBoxesReady(false)},430);
    const r=box.getBoundingClientRect();
    boom(r.left+r.width/2,r.top,130);
    popup(['🎉 YES!','⭐ Wonderful!','🏆 Amazing!','💪 Super!','🥦 Bravo!'][~~(Math.random()*5)]);
    setTimeout(()=>phaseWhy(cat),700);
  }else{
    sndWrong();
    box.classList.add('wrong');setTimeout(()=>box.classList.remove('wrong'),600);
    femoji.classList.remove('nope');void femoji.offsetWidth;femoji.classList.add('nope');
  }
}

function flyToBox(box){
  const fr=femoji.getBoundingClientRect(),br=box.getBoundingClientRect();
  const fl=document.createElement('div');
  fl.className='flyer';fl.textContent=cur.e;
  fl.style.left=(fr.left+fr.width/2)+'px';
  fl.style.top=(fr.top+fr.height/2)+'px';
  document.body.appendChild(fl);
  requestAnimationFrame(()=>{
    fl.style.left=(br.left+br.width/2)+'px';
    fl.style.top=(br.top+br.height/2)+'px';
    fl.style.fontSize='1.4em';
    fl.style.opacity='.4';
  });
  setTimeout(()=>fl.remove(),500);
}

/* ============ TAP WIRING ============ */
femoji.addEventListener('click',()=>{
  initAudio();
  if(phase==='question'&&!locked){
    selected=!selected;
    femoji.classList.toggle('selected',selected);
    sndPop();
  }else{
    femoji.classList.remove('nope');void femoji.offsetWidth;femoji.classList.add('nope');
    sndPop();
  }
});
for(const t of ['thumbUp','thumbDown']){
  $(t).addEventListener('click',()=>{
    initAudio();sndPop();
    const el=$(t);
    el.classList.remove('wobble');void el.offsetWidth;el.classList.add('wobble');
  });
}
document.querySelectorAll('.box').forEach(box=>{
  box.addEventListener('click',()=>{
    initAudio();
    shakeBox(box);
    if(selected&&!locked&&phase==='question')attempt(box.dataset.cat);
  });
  box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('drag-over')});
  box.addEventListener('dragleave',()=>box.classList.remove('drag-over'));
  box.addEventListener('drop',e=>{
    e.preventDefault();box.classList.remove('drag-over');
    if(phase==='question'&&!locked)attempt(box.dataset.cat);
  });
});
femoji.draggable=true;
femoji.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',cur.w)});

newRound();
</script>
<!-- Bilingo game controls: zoom + fullscreen toggle (auto-collapsing) -->
<style>
  .bilingo-ui {
    position: fixed; right: 12px; bottom: 12px; z-index: 2147483646;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: system-ui, sans-serif;
  }
  .bilingo-ui button {
    width: 48px; height: 48px; border: 0; border-radius: 14px;
    background: rgba(18, 18, 32, .55); color: #fff; font-size: 1.2rem; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    display: grid; place-items: center; transition: background .15s, transform .15s;
  }
  .bilingo-ui button:hover { background: rgba(70, 60, 150, .75); transform: scale(1.08); }
  .bilingo-ui .b-pct { font-size: .95rem; font-weight: 800; color: #fff; opacity: .85; }
  .bilingo-ui .b-handle { display: none; }
  .bilingo-ui.mini > *:not(.b-handle) { display: none; }
  .bilingo-ui.mini .b-handle { display: grid; width: 40px; height: 40px; font-size: 1.1rem; }
</style>
<div id="bilingo-ui" class="bilingo-ui">
  <button type="button" class="b-handle" title="Show controls" aria-label="Show controls">&#9881;&#65039;</button>
  <button type="button" class="b-plus" title="Bigger (zoom in)" aria-label="Bigger">+</button>
  <div class="b-pct">100%</div>
  <button type="button" class="b-minus" title="Smaller (zoom out)" aria-label="Smaller">&minus;</button>
  <button type="button" class="b-fs" title="Fullscreen on/off" aria-label="Fullscreen">&#9966;</button>
</div>
<script>
(function () {
  if (window.__bilingoUI) return;
  window.__bilingoUI = true;
  var bar = document.getElementById('bilingo-ui');
  var pct = bar.querySelector('.b-pct');
  var MIN = 0.5, MAX = 2.5, STEP = 0.1, KEY = 'bilingo-zoom';
  var z = parseFloat(localStorage.getItem(KEY) || '1');
  if (isNaN(z)) z = 1;
  z = Math.min(MAX, Math.max(MIN, z));

  function apply() {
    document.documentElement.style.setProperty('zoom', z);
    pct.textContent = Math.round(z * 100) + '%';
  }
  function shrink() {
    z = Math.max(MIN, Math.round((z - STEP) * 100) / 100);
    localStorage.setItem(KEY, z); apply();
  }
  function grow() {
    z = Math.min(MAX, Math.round((z + STEP) * 100) / 100);
    localStorage.setItem(KEY, z); apply();
  }
  function toggleFS() {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(function () {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
  }

  bar.querySelector('.b-plus').addEventListener('click', grow);
  bar.querySelector('.b-minus').addEventListener('click', shrink);
  bar.querySelector('.b-fs').addEventListener('click', toggleFS);
  bar.querySelector('.b-handle').addEventListener('click', function () {
    bar.classList.remove('mini');
    poke();
  });

  // Collapse to just the handle after 5s without interaction, so the bar
  // never sits on top of the game's own buttons.
  var idleTimer = null;
  function poke() {
    bar.classList.remove('mini');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { bar.classList.add('mini'); }, 5000);
  }
  bar.addEventListener('pointerdown', poke);
  poke();
  apply();
})();
</script>
