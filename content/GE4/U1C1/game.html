<!DOCTYPE html><html lang="en"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌟 Who Does What? — Jobs Game!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:'Nunito',sans-serif;
  background:var(--bg,linear-gradient(135deg,#667eea,#764ba2));
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;padding:14px;
  transition:background .01s;
  user-select:none;-webkit-user-select:none;
}
.screen{display:none;flex-direction:column;align-items:center;width:100%;max-width:620px}
.screen.on{display:flex}

/* ───── START ───── */
.s-title{font-size:clamp(2.2rem,7vw,3.4rem);color:#fff;text-shadow:3px 4px 0 rgba(0,0,0,.15);text-align:center;font-weight:900;line-height:1.2}
.erow{font-size:clamp(2rem,5.5vw,3rem);margin:20px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.erow span{display:inline-block;animation:boing 1.6s ease infinite}
.erow span:nth-child(2){animation-delay:.1s}
.erow span:nth-child(3){animation-delay:.2s}
.erow span:nth-child(4){animation-delay:.3s}
.erow span:nth-child(5){animation-delay:.4s}
.erow span:nth-child(6){animation-delay:.5s}
.erow span:nth-child(7){animation-delay:.6s}
.erow span:nth-child(8){animation-delay:.7s}
.erow span:nth-child(9){animation-delay:.8s}
@keyframes boing{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.12)}}
.s-sub{font-size:1.4rem;color:rgba(255,255,255,.92);margin-bottom:30px;text-align:center}
.bbtn{
  font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(1.3rem,4.5vw,2rem);
  padding:18px 52px;border:none;border-radius:60px;color:#fff;cursor:pointer;
  box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .14s,box-shadow .14s;
  -webkit-tap-highlight-color:transparent;
}
.bbtn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 36px rgba(0,0,0,.35)}
.bbtn:active{transform:translateY(1px) scale(.97)}
.bbtn.pk{background:linear-gradient(135deg,#f093fb,#f5576c)}
.bbtn.gn{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#145a28}

/* ───── GAME ───── */
.top{width:100%;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pbar{flex:1;height:22px;background:rgba(255,255,255,.22);border-radius:12px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.1)}
.pfill{height:100%;border-radius:12px;background:linear-gradient(90deg,#43e97b,#38f9d7);transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(67,233,123,.4)}
.sbadge{font-size:1.4rem;color:#fff;font-weight:900;white-space:nowrap;text-shadow:1px 2px 4px rgba(0,0,0,.2)}
.sbadge.pop{animation:spop .35s ease}
@keyframes spop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

.card{
  background:#fff;border-radius:30px;padding:28px 24px 24px;width:100%;
  box-shadow:0 16px 50px rgba(0,0,0,.22);text-align:center;position:relative;
}
.card.pop{animation:cpop .42s cubic-bezier(.22,1.2,.36,1)}
@keyframes cpop{from{transform:scale(.82) translateY(28px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

.qnum{font-size:.95rem;color:#bbb;font-weight:700;margin-bottom:4px;letter-spacing:.5px}
.bemoji{font-size:clamp(4rem,12vw,6.2rem);line-height:1.2;margin:6px 0;animation:bob 2.4s ease-in-out infinite}
.bemoji.reveal{animation:revealPop .5s ease}
@keyframes revealPop{0%{transform:scale(.5) rotate(-10deg);opacity:0}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.qtxt{font-size:clamp(1.25rem,4vw,1.75rem);font-weight:800;color:#444;margin:10px 0 20px}
.qtxt strong{color:#f5576c;font-size:115%;text-decoration:underline;text-decoration-color:#f5576c55;text-underline-offset:3px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{
  font-family:'Nunito',sans-serif;font-weight:800;
  border:4px solid #e4e4ee;border-radius:20px;background:#fafaff;
  cursor:pointer;transition:all .14s;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.opt:hover:not(:disabled){transform:scale(1.06);border-color:#c0c0f0;background:#f2f2ff;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.opt:active:not(:disabled){transform:scale(.95)}
.opt-e{font-size:clamp(2.4rem,7vw,3.6rem);padding:16px 10px}
.opt-w{font-size:clamp(1.15rem,3.2vw,1.5rem);padding:18px 12px;color:#555;text-transform:capitalize}
.opt.correct{border-color:#2ecc71!important;background:#d5f5e3!important;transform:scale(1.07);box-shadow:0 0 20px rgba(46,204,113,.3)!important}
.opt.correct::after{content:"✅";position:absolute;top:5px;right:9px;font-size:1.15rem}
.opt.wrong{border-color:#e74c3c!important;background:#fadbd8!important;opacity:.5;transform:scale(.95)}
.opt.wrong::after{content:"❌";position:absolute;top:5px;right:9px;font-size:1.15rem}
.opt.reveal-ok{border-color:#2ecc71!important;background:#d5f5e3!important;animation:pulse3 .55s ease 3;box-shadow:0 0 20px rgba(46,204,113,.35)!important}
@keyframes pulse3{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.opt:disabled{cursor:default}

.fb{margin-top:14px;font-size:clamp(1.2rem,3.5vw,1.5rem);font-weight:800;min-height:1.6em}
.fb.ok{color:#27ae60}.fb.re{color:#e67e22}.fb.no{color:#e74c3c}

.abtn{
  font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(1.1rem,3.2vw,1.35rem);
  padding:14px 34px;border:none;border-radius:50px;color:#fff;cursor:pointer;
  margin-top:16px;box-shadow:0 6px 22px rgba(0,0,0,.2);
  transition:transform .12s;animation:glow 1.4s ease-in-out infinite;
  -webkit-tap-highlight-color:transparent;
}
@keyframes glow{0%,100%{transform:scale(1);box-shadow:0 6px 22px rgba(0,0,0,.2)}50%{transform:scale(1.05);box-shadow:0 8px 30px rgba(0,0,0,.28)}}
.abtn:hover{transform:scale(1.07)!important}
.abtn:active{transform:scale(.96)!important}
.abtn.dlg{background:linear-gradient(135deg,#a18cd1,#fbc2eb)}
.abtn.nxt{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#145a28}

.dbox{
  margin-top:16px;width:100%;border-radius:22px;overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.08);animation:cpop .35s ease-out;
}
.dl{padding:16px 22px;font-size:clamp(1.1rem,3.2vw,1.45rem);font-weight:700;line-height:1.6}
.dl-q{background:linear-gradient(135deg,#dfe6e9,#b2bec3);color:#2d3436}
.dl-a{background:linear-gradient(135deg,#ffecd2,#fcb69f);color:#6b3a00;font-size:clamp(1.15rem,3.4vw,1.5rem)}
.dl-a .name{font-weight:900;text-decoration:underline;text-decoration-color:#d4845055;text-underline-offset:3px}

.H{display:none!important}

/* ───── SHAKE + RED ───── */
@keyframes shake{
  0%,100%{transform:translateX(0)}
  10%{transform:translateX(-16px) rotate(-2deg)}
  20%{transform:translateX(16px) rotate(2deg)}
  30%{transform:translateX(-12px) rotate(-1.5deg)}
  40%{transform:translateX(12px) rotate(1.5deg)}
  50%{transform:translateX(-7px) rotate(-.5deg)}
  60%{transform:translateX(7px) rotate(.5deg)}
  70%{transform:translateX(-3px)}80%{transform:translateX(3px)}
}
.shaking{animation:shake .5s ease}

.red-ov{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(circle,rgba(255,30,30,.35),rgba(255,30,30,.15));
  pointer-events:none;z-index:1000;animation:fadeR .6s ease forwards;
}
@keyframes fadeR{to{opacity:0}}

/* ───── END ───── */
.e-title{font-size:clamp(2.2rem,7vw,3.2rem);color:#fff;text-shadow:3px 4px 0 rgba(0,0,0,.15);text-align:center;font-weight:900}
.e-score{font-size:clamp(1.3rem,4vw,2rem);color:#ffeaa7;margin:18px 0 6px;font-weight:900}
.e-stars{font-size:3rem;margin-bottom:10px;animation:boing 1.6s ease infinite}
.e-msg{font-size:1.2rem;color:rgba(255,255,255,.85);margin-bottom:28px;text-align:center}

#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}

@media(max-width:420px){
  .opts{gap:10px}
  .opt-e{padding:12px 6px}
  .opt-w{padding:14px 6px}
  .card{padding:22px 16px 18px}
}
</style>
</head>
<body>

<!-- ═══ START ═══ -->
<div class="screen on" id="start">
  <div class="s-title">🌟 Who Does What? 🌟</div>
  <div class="erow">
    <span>👨‍🍳</span><span>👨‍🚒</span><span>👩‍🌾</span><span>👮</span><span>📮</span>
    <span>🏪</span><span>👩‍🏫</span><span>👨‍🎓</span><span>👩‍⚕️</span>
  </div>
  <div class="s-sub">Can you match all the jobs?<br>Let's find out! 💪</div>
  <button class="bbtn pk" onclick="startGame()">Let's Play! 🎮</button>
</div>

<!-- ═══ GAME ═══ -->
<div class="screen" id="game">
  <div class="top">
    <div class="pbar"><div class="pfill" id="pf"></div></div>
    <div class="sbadge" id="sb">⭐ 0</div>
  </div>
  <div class="card" id="card">
    <div class="qnum" id="qn"></div>
    <div class="bemoji" id="be"></div>
    <div class="qtxt" id="qt"></div>
    <div class="opts" id="opts"></div>
    <div class="fb H" id="fb"></div>
    <button class="abtn dlg H" id="dbtn" onclick="showDlg()">Show Dialogue 💬</button>
    <div class="dbox H" id="dbox"></div>
    <button class="abtn nxt H" id="nbtn" onclick="goNext()">Next ➡️</button>
  </div>
</div>

<!-- ═══ END ═══ -->
<div class="screen" id="end">
  <div class="e-title">🎉 Amazing Job! 🎉</div>
  <div class="e-score" id="es"></div>
  <div class="e-stars" id="ess"></div>
  <div class="e-msg" id="em"></div>
  <button class="bbtn pk" onclick="startGame()">Play Again! 🔄</button>
</div>

<canvas id="confetti"></canvas>

<script>
/* ═══════════ DATA ═══════════ */
const JOBS=[
  {n:"baker",      m:"👨‍🍳", f:"👩‍🍳"},
  {n:"fireman",    m:"👨‍🚒", f:"👩‍🚒"},
  {n:"farmer",     m:"👨‍🌾", f:"👩‍🌾"},
  {n:"policeman",  m:"👮‍♂️",f:"👮‍♀️"},
  {n:"postman",    m:"📮",   f:"📮"},
  {n:"shopkeeper", m:"🏪",   f:"🏪"},
  {n:"teacher",    m:"👨‍🏫", f:"👩‍🏫"},
  {n:"student",    m:"👨‍🎓", f:"👩‍🎓"},
  {n:"doctor",     m:"👨‍⚕️", f:"👩‍⚕️"},
];

const BGS=[
  "linear-gradient(135deg,#667eea,#764ba2)",
  "linear-gradient(135deg,#f093fb,#f5576c)",
  "linear-gradient(135deg,#43e97b,#0abde3)",
  "linear-gradient(135deg,#fa709a,#fee140)",
  "linear-gradient(135deg,#a18cd1,#fbc2eb)",
  "linear-gradient(135deg,#89f7fe,#66a6ff)",
  "linear-gradient(135deg,#fddb92,#d1fdff)",
  "linear-gradient(135deg,#96fbc4,#f9f586)",
  "linear-gradient(135deg,#ff9a9e,#fecfef)",
];

const PRAISE=["🎉 Amazing!","🌟 Great job!","✨ Fantastic!","🥳 You got it!","💪 Super!","👏 Awesome!","🏆 Perfect!"];

/* ═══════════ STATE ═══════════ */
let queue,cur,gen,emo,pro,qType,att,score,qIdx,total,locked;

/* ═══════════ AUDIO ═══════════ */
const AC=window.AudioContext||window.webkitAudioContext;
let ax;
function ia(){if(!ax)ax=new AC();if(ax.state==="suspended")ax.resume();}
function tn(f,s,d,t,v){
  if(!ax)return;
  const o=ax.createOscillator(),g=ax.createGain();
  o.connect(g);g.connect(ax.destination);o.type=t||"sine";o.frequency.value=f;
  const now=ax.currentTime;
  g.gain.setValueAtTime(v||.2,now+s);
  g.gain.exponentialRampToValueAtTime(.001,now+s+d);
  o.start(now+s);o.stop(now+s+d);
}
function sOk(){ia();tn(523,0,.16);tn(659,.1,.16);tn(784,.2,.26);tn(1047,.32,.35,undefined,.15);}
function sNo(){ia();tn(220,0,.1,"sawtooth",.12);tn(180,.08,.14,"sawtooth",.1);tn(140,.18,.22,"sawtooth",.08);}
function sClick(){ia();tn(900,0,.05,"sine",.07);}
function sFanfare(){ia();[523,659,784,880,1047].forEach((f,i)=>tn(f,i*.13,.45,"sine",.16));}

/* ═══════════ HELPERS ═══════════ */
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function $(id){return document.getElementById(id);}
function S(id){$(id).classList.remove("H");}
function H(id){$(id).classList.add("H");}
function scr(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");}

/* ═══════════ GAME FLOW ═══════════ */
function startGame(){
  ia();queue=shuf(JOBS);total=queue.length;qIdx=0;score=0;locked=false;
  $("sb").textContent="⭐ 0";$("pf").style.width="0%";
  scr("game");goNext();
}

function goNext(){
  if(qIdx>=total){endGame();return;}
  cur=queue[qIdx];
  gen=Math.random()<.5?"m":"f";
  emo=gen==="m"?cur.m:cur.f;
  pro=gen==="m"?"He":"She";
  qType=Math.random()<.5?"emoji":"word";
  att=0;locked=false;

  document.body.style.background=BGS[qIdx%BGS.length];
  qIdx++;

  $("pf").style.width=((qIdx-1)/total*100)+"%";
  $("qn").textContent="Question "+qIdx+" of "+total;

  H("fb");H("dbtn");H("dbox");H("nbtn");

  const c=$("card");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");
  buildQ();
}

function buildQ(){
  const dist=shuf(JOBS.filter(j=>j.n!==cur.n)).slice(0,3);
  const ops=shuf([cur,...dist]);
  const be=$("be"),qt=$("qt"),ot=$("opts");

  if(qType==="emoji"){
    be.textContent="🤔";be.className="bemoji";
    qt.innerHTML=pro+"'s a <strong>"+cur.n+"</strong>.";
    ot.innerHTML=ops.map(j=>{
      const e=gen==="m"?j.m:j.f;
      return '<button class="opt opt-e" data-n="'+j.n+'">'+e+'</button>';
    }).join("");
  }else{
    be.textContent=emo;be.className="bemoji";
    qt.innerHTML="What does "+pro.toLowerCase()+" do?";
    ot.innerHTML=ops.map(j=>{
      return '<button class="opt opt-w" data-n="'+j.n+'">'+j.n+'</button>';
    }).join("");
  }
  /* attach listeners */
  ot.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(b,b.dataset.n)));
}

function pick(btn,name){
  if(locked||btn.disabled)return;
  sClick();

  if(name===cur.n){
    /* ✅ CORRECT */
    locked=true;btn.classList.add("correct");disableAll();
    score++;
    const sb=$("sb");sb.textContent="⭐ "+score;sb.classList.remove("pop");void sb.offsetWidth;sb.classList.add("pop");
    $("fb").textContent=PRAISE[0|Math.random()*PRAISE.length];
    $("fb").className="fb ok";S("fb");
    sOk();launchConfetti();
    if(qType==="emoji"){const be=$("be");be.textContent=emo;be.className="bemoji reveal";}
    S("dbtn");
  }else{
    /* ❌ WRONG */
    att++;btn.classList.add("wrong");btn.disabled=true;
    doShake();sNo();
    if(att>=2){
      locked=true;disableAll();revealOk();
      $("fb").textContent="😅 Look! Here's the answer!";
      $("fb").className="fb no";S("fb");
      if(qType==="emoji"){const be=$("be");be.textContent=emo;be.className="bemoji reveal";}
      S("dbtn");
    }else{
      $("fb").textContent="🤔 Try once more!";
      $("fb").className="fb re";S("fb");
    }
  }
}

function disableAll(){$("opts").querySelectorAll(".opt").forEach(b=>b.disabled=true);}
function revealOk(){$("opts").querySelectorAll(".opt").forEach(b=>{if(b.dataset.n===cur.n)b.classList.add("reveal-ok");});}

function showDlg(){
  sClick();
  const lp=pro.toLowerCase();
  $("dbox").innerHTML=
    '<div class="dl dl-q">— What does '+lp+' do?</div>'+
    '<div class="dl dl-a">— '+pro+"'s a <span class=\"name\">"+cur.n+'</span>. '+emo+'</div>';
  S("dbox");H("dbtn");

  const nb=$("nbtn");
  nb.textContent=qIdx>=total?"See Results! 🏆":"Next ➡️";
  S("nbtn");
}

function endGame(){
  scr("end");
  $("pf").style.width="100%";
  $("es").textContent="You got ⭐ "+score+" out of "+total+"!";
  const r=score/total;
  $("ess").textContent=r>=1?"🏆🌟🏆":r>=.78?"🌟🌟🌟":r>=.5?"🌟🌟":"🌟";
  $("em").textContent=r>=1?"Perfect score! You're a superstar! 🌈":
    r>=.78?"Almost perfect! Amazing work! 🎈":
    r>=.5?"Good job! Keep practising! 💪":"Nice try! Let's play again! 🔄";
  sFanfare();launchConfetti();setTimeout(launchConfetti,500);setTimeout(launchConfetti,1100);
  document.body.style.background="linear-gradient(135deg,#f093fb,#f5576c)";
}

/* ═══════════ SCREEN SHAKE ═══════════ */
function doShake(){
  const c=$("card");c.classList.remove("shaking");void c.offsetWidth;c.classList.add("shaking");
  c.addEventListener("animationend",()=>c.classList.remove("shaking"),{once:true});
  const r=document.createElement("div");r.className="red-ov";document.body.appendChild(r);
  r.addEventListener("animationend",()=>r.remove());
}

/* ═══════════ CONFETTI ═══════════ */
const cv=document.getElementById("confetti"),cx=cv.getContext("2d");
let pts=[],raf;
function rsz(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener("resize",rsz);rsz();

const COLS=["#f5576c","#43e97b","#667eea","#ffc107","#ff6b6b","#48dbfb","#ff9ff3","#feca57","#a29bfe","#fd79a8","#00cec9","#e17055"];

function launchConfetti(){
  for(let i=0;i<100;i++) pts.push({
    x:cv.width/2+(Math.random()-.5)*240,
    y:cv.height*.38,
    vx:(Math.random()-.5)*20,
    vy:Math.random()*-18-6,
    w:5+Math.random()*12,
    h:3+Math.random()*8,
    c:COLS[0|Math.random()*COLS.length],
    r:Math.random()*360,
    rv:(Math.random()-.5)*16,
    g:.26+Math.random()*.24,
    life:1,
    d:.004+Math.random()*.007,
    shape:Math.random()<.3?"circle":"rect"
  });
  if(!raf) anim();
}
function anim(){
  cx.clearRect(0,0,cv.width,cv.height);
  pts=pts.filter(p=>p.life>0);
  for(const p of pts){
    p.x+=p.vx;p.vy+=p.g;p.y+=p.vy;p.r+=p.rv;p.life-=p.d;p.vx*=.99;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r*Math.PI/180);
    cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;
    if(p.shape==="circle"){cx.beginPath();cx.arc(0,0,p.w/2,0,Math.PI*2);cx.fill();}
    else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  }
  if(pts.length) raf=requestAnimationFrame(anim);
  else{raf=null;cx.clearRect(0,0,cv.width,cv.height);}
}
</script>

<!-- Bilingo game controls: zoom + fullscreen (gear toggle, auto-hide 7s) -->
<style>
  .bilingo-ui {
    position: fixed; right: 12px; bottom: 12px; z-index: 2147483646;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: system-ui, sans-serif;
  }
  .bilingo-ui button {
    width: 48px; height: 48px; border: 0; border-radius: 14px;
    background: rgba(18, 18, 32, .55); color: #fff; font-size: 1.2rem; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    display: grid; place-items: center; transition: background .15s, transform .15s;
  }
  .bilingo-ui button:hover { background: rgba(70, 60, 150, .75); transform: scale(1.08); }
  .bilingo-ui .b-pct { font-size: .95rem; font-weight: 800; color: #fff; opacity: .9;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
  /* the gear always stays; everything else only shows while open */
  .bilingo-ui:not(.open) > *:not(.b-handle) { display: none; }
</style>
<div id="bilingo-ui" class="bilingo-ui">
  <button type="button" class="b-plus" title="Bigger (zoom in)" aria-label="Bigger">+</button>
  <div class="b-pct">100%</div>
  <button type="button" class="b-minus" title="Smaller (zoom out)" aria-label="Smaller">−</button>
  <button type="button" class="b-fs" title="Fullscreen on/off" aria-label="Fullscreen">⛶</button>
  <button type="button" class="b-handle" title="Show / hide controls" aria-label="Show or hide controls">⚙️</button>
</div>
<script>
(function () {
  if (window.__bilingoUI) return;
  window.__bilingoUI = true;
  var bar = document.getElementById('bilingo-ui');
  var pct = bar.querySelector('.b-pct');
  var MIN = 0.5, MAX = 2.5, STEP = 0.1, KEY = 'bilingo-zoom', IDLE = 7000;
  var z = parseFloat(localStorage.getItem(KEY) || '1');
  if (isNaN(z)) z = 1;
  z = Math.min(MAX, Math.max(MIN, z));
  function apply() {
    document.documentElement.style.setProperty('zoom', z);
    pct.textContent = Math.round(z * 100) + '%';
  }
  function shrink() { z = Math.max(MIN, Math.round((z - STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function grow() { z = Math.min(MAX, Math.round((z + STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function toggleFS() {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(function () {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
    poke();
  }
  bar.querySelector('.b-plus').addEventListener('click', grow);
  bar.querySelector('.b-minus').addEventListener('click', shrink);
  bar.querySelector('.b-fs').addEventListener('click', toggleFS);
  bar.querySelector('.b-handle').addEventListener('click', function () {
    bar.classList.toggle('open');
    poke();
  });
  /* collapse 7 s after the last tap anywhere on the bar */
  var idleTimer = null;
  function poke() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { bar.classList.remove('open'); }, IDLE);
  }
  bar.addEventListener('pointerdown', poke);
  apply();
})();
</script>
</body></html>
