<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taste Test — How Does It Taste? (GE4 U4C16)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Nunito',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  color:#4e342e;padding:10px 12px 30px;overflow-x:hidden;
}

/* ---------- WAVY FOOD-GRADIENT BACKGROUND (hue shifts per food) ---------- */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:linear-gradient(160deg,#ffe8c9 0%,#ffc9a3 32%,#ff9a9e 68%,#fecfef 100%);
  transition:filter 1.1s ease;}
.wave{position:absolute;bottom:0;left:0;width:200%;height:19vh;animation:wavemove linear infinite}
.w1{animation-duration:19s}
.w2{animation-duration:27s;animation-direction:reverse;height:14vh}
@keyframes wavemove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.floatfood{position:absolute;font-size:9rem;opacity:.14;filter:blur(1px);animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(6deg)}}

#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}

/* ---------- TOP BAR ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:960px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
h1{font-size:clamp(1.2em,3.6vw,1.9em);color:#4e342e;text-shadow:1px 2px 0 rgba(255,255,255,.7)}
.togs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rc{background:rgba(255,255,255,.6);padding:4px 14px;border-radius:20px;font-size:.85em;font-weight:900;color:#5d4037;white-space:nowrap;backdrop-filter:blur(4px)}
.tg{background:rgba(255,255,255,.5);border:2px solid rgba(93,64,55,.3);border-radius:20px;padding:4px 12px;
  font-size:.92em;font-weight:900;cursor:pointer;user-select:none;color:rgba(93,64,55,.6);transition:all .2s;white-space:nowrap;backdrop-filter:blur(4px)}
.tg.on{color:#1b5e20;border-color:#2ed573;background:rgba(46,213,115,.3);box-shadow:0 0 14px rgba(46,213,115,.45)}
.tg:hover{transform:scale(1.05)}

/* ---------- MENU TOGGLES (add/remove food groups) ---------- */
.menubar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;max-width:960px;margin-bottom:10px}
.menubar .mlabel{font-weight:900;color:#6d4c41;font-size:.95em}
.menubar .tg{font-size:1.02em;padding:7px 18px;border-radius:24px}
.menubar .tg.fixed{color:#4e342e;border-color:rgba(93,64,55,.55);background:rgba(255,255,255,.65);cursor:default}
.menubar .tg.fixed:hover{transform:none}

/* ---------- STAGE (glass card) ---------- */
.stage{width:100%;max-width:960px;position:relative;overflow:hidden;
  background:rgba(255,255,255,.38);border:3px solid rgba(255,255,255,.75);border-radius:26px;
  padding:14px 14px 18px;box-shadow:0 20px 60px rgba(120,50,20,.25);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;}

.banner{width:100%;max-width:720px;margin:0 auto 8px;min-height:62px;
  background:rgba(255,255,255,.55);border:2px dashed rgba(93,64,55,.35);
  border-radius:18px;padding:10px 16px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;gap:4px;
  font-size:clamp(.95em,2.4vw,1.45em);font-weight:900;line-height:1.35;color:#5d4037;transition:.35s;}
.banner.solid{border-style:solid;border-color:rgba(93,64,55,.5);background:rgba(255,255,255,.7)}
.banner .row{animation:fadeUp .35s ease-out;line-height:1.5}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.banner.bigquestion{font-size:clamp(1.25em,3.8vw,2em);border-color:#ff7043;background:rgba(255,112,67,.15)}

.prompt{text-align:center;font-size:clamp(.85em,2.2vw,1.05em);font-weight:700;
  color:#6d4c41;margin:0 0 8px;min-height:1.7em;}
.prompt.shake{animation:pshake .4s}
@keyframes pshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}

.mainbtn{display:block;margin:4px auto 10px;padding:13px 40px;font-size:clamp(1em,2.6vw,1.2em);font-weight:900;
  background:linear-gradient(135deg,#f9ca24,#f0932b);color:#4e2a00;border:none;border-radius:50px;cursor:pointer;
  font-family:'Nunito';box-shadow:0 8px 26px rgba(249,202,36,.45);transition:all .25s;animation:glow 2s ease-in-out infinite;}
.mainbtn:hover{transform:scale(1.06)}
.mainbtn:active{transform:scale(.97)}
.mainbtn.hide{display:none}
.mainbtn.dim{opacity:.45;filter:grayscale(.5);animation:none}
.mainbtn.green{background:linear-gradient(135deg,#34d399,#10b981);color:#022c22;box-shadow:0 8px 26px rgba(16,185,129,.45)}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1)}}

/* ---------- FOOD CARD ---------- */
.cardwrap{display:flex;justify-content:center;margin:2px auto 8px;min-height:170px;align-items:center}
.card{background:#fffdf5;border-radius:18px;padding:14px 20px 10px;transform:rotate(-2deg);
  box-shadow:0 14px 34px rgba(120,50,20,.35);transition:opacity .4s,transform .4s;position:relative}
.card.sway{animation:a-sway 2.6s ease-in-out infinite}
@keyframes a-sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(1deg) translateY(-7px)}}
.card .pic{font-size:clamp(5.5rem,17vw,8.5rem);line-height:1.15;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.card .tape{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-4deg);
  width:74px;height:22px;background:rgba(249,202,36,.8);border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.card.done{opacity:.35;transform:rotate(-2deg) scale(.92)}

/* ---------- TASTE CHIPS ---------- */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:760px;margin:2px auto 10px}
.chips.hide{display:none}
.chip{border-radius:18px;padding:8px 6px;background:rgba(255,255,255,.8);border:3px solid var(--c);cursor:pointer;
  font-family:'Nunito';font-weight:900;color:#4e342e;display:flex;flex-direction:column;align-items:center;gap:1px;
  transition:all .15s;box-shadow:0 4px 0 rgba(120,50,20,.18);animation:fadeUp .35s backwards}
.chip .e{font-size:clamp(1.7rem,4.4vw,2.5rem);line-height:1.1}
.chip .w{font-size:clamp(.8rem,2vw,1.05rem);text-transform:uppercase;letter-spacing:.5px}
.chip:hover{transform:translateY(-3px) scale(1.04)}
.chip.sel{background:var(--c);color:#fff;transform:scale(1.07);box-shadow:0 6px 0 rgba(120,50,20,.25)}
.chip.off{pointer-events:none}

/* ---------- SORT BOXES ---------- */
.boxes{display:flex;justify-content:center;align-items:stretch;gap:12px;width:100%;max-width:880px;margin:0 auto}
.box{flex:1;border-radius:20px;padding:8px 6px 10px;text-align:center;background:rgba(255,255,255,.55);
  border:3px solid var(--c);user-select:none;position:relative;color:#4e342e;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-height:120px;backdrop-filter:blur(4px);
  transition:box-shadow .3s}
.box .head{font-weight:900;font-size:clamp(.95em,2.6vw,1.35em);line-height:1.1}
.box .pile{flex:1;display:flex;flex-wrap:wrap;gap:1px;align-content:flex-end;justify-content:center;width:100%;min-height:64px}
.box .pile .q{font-size:1.4em;opacity:.4;align-self:center}
.box .pile span{font-size:clamp(1.1rem,2.4vw,1.55rem);transform:rotate(var(--r));animation:popInS .45s cubic-bezier(.34,1.56,.64,1);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
@keyframes popInS{0%{transform:scale(0) rotate(var(--r))}70%{transform:scale(1.35) rotate(var(--r))}100%{transform:scale(1) rotate(var(--r))}}
.box.glow{box-shadow:0 0 0 4px rgba(255,255,255,.65),0 0 32px var(--c)}

/* ---------- FLYING FOOD + POPUP ---------- */
.flyer{position:fixed;z-index:998;pointer-events:none;transition:all .45s ease-in;transform:translate(-50%,-50%);
  font-size:5rem;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.popup{position:fixed;top:32%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(2em,7.5vw,4em);
  font-weight:900;z-index:1000;pointer-events:none;color:#e64a19;text-shadow:3px 3px 0 #fff,6px 6px 18px rgba(0,0,0,.25);
  opacity:0;white-space:nowrap}
.popup.show{animation:popInBig 1.2s ease forwards}
@keyframes popInBig{0%{transform:translate(-50%,-50%) scale(0);opacity:0}20%{transform:translate(-50%,-50%) scale(1.3);opacity:1}40%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* ---------- START OVERLAY ---------- */
.startov{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;gap:16px;
  align-items:center;justify-content:center;cursor:pointer;text-align:center;padding:20px;
  background:linear-gradient(160deg,#ffe8c9,#ffc9a3 35%,#ff9a9e 70%,#fecfef)}
.startov .big{font-size:clamp(3.5rem,14vw,7rem);animation:bob 3s ease-in-out infinite}
.startov .t{font-size:clamp(1.7em,6vw,3em);font-weight:900;color:#4e342e;text-shadow:2px 2px 0 rgba(255,255,255,.8)}
.startov .s{font-size:clamp(1em,3vw,1.4em);font-weight:700;color:#6d4c41}
.startov .hint{font-size:clamp(.9em,2.4vw,1.1em);font-weight:900;color:#fff;background:rgba(78,52,46,.75);
  padding:10px 26px;border-radius:50px;animation:glow 2s ease-in-out infinite}

@media(max-width:620px){
  .boxes{gap:6px}
  .box{min-height:100px;border-width:2px}
  .chips{gap:7px}
  .floatfood{font-size:5rem}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div id="bg">
  <span class="floatfood" style="top:8%;left:4%">🍓</span>
  <span class="floatfood" style="top:14%;right:6%;animation-delay:-2s">🥑</span>
  <span class="floatfood" style="bottom:26%;left:10%;animation-delay:-4s">🍕</span>
  <span class="floatfood" style="top:38%;right:12%;animation-delay:-1s">🍦</span>
  <svg class="wave w1" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z" fill="rgba(255,255,255,.28)"/></svg>
  <svg class="wave w2" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z" fill="rgba(255,255,255,.2)"/></svg>
</div>

<div class="startov" id="startOv">
  <div class="big">🍕🤢</div>
  <div class="t">Taste Test!</div>
  <div class="s">“How does your pizza taste?” — 🗣️ “It tastes yummy!”</div>
  <div class="hint">👆 Tap anywhere to start!</div>
</div>

<div class="topbar">
  <h1>🍕 Taste Test</h1>
  <div class="togs">
    <div class="rc" id="rc">🍽️ Tasted: 0</div>
    <div class="tg" id="tgReset" title="Clear the sort boxes and start fresh">🗑 reset</div>
    <div class="tg on" id="tgS" title="Sound on/off">🔊</div>
  </div>
</div>

<div class="menubar">
  <span class="mlabel">Menu:</span>
  <div class="tg fixed" title="Always on — this is the base menu">🍔 fast food</div>
  <div class="tg" id="tgFruit" title="Tap to add fruits to the menu — tap again to remove">🍎 fruits</div>
  <div class="tg" id="tgVeg" title="Tap to add vegetables to the menu — tap again to remove">🥕 vegetables</div>
  <div class="tg" id="tgOther" title="Tap to add other food (rice, eggs…) to the menu — tap again to remove">🍜 other food</div>
</div>

<div class="stage">
  <div class="banner" id="banner"></div>
  <div class="prompt" id="prompt"></div>

  <div class="cardwrap">
    <div class="card sway" id="card">
      <div class="tape"></div>
      <div class="pic" id="pic">🍕</div>
    </div>
  </div>

  <div class="chips hide" id="chips"></div>
  <button class="mainbtn" id="mainBtn"></button>

  <div class="boxes">
    <div class="box" data-taste="yummy" style="--c:#ff7043"><div class="head">😋 yummy</div><div class="pile" data-pile="yummy"><span class="q">👆</span></div></div>
    <div class="box" data-taste="good" style="--c:#ffb300"><div class="head">🙂 good</div><div class="pile" data-pile="good"><span class="q">👆</span></div></div>
    <div class="box" data-taste="bad" style="--c:#78909c"><div class="head">😖 bad</div><div class="pile" data-pile="bad"><span class="q">👆</span></div></div>
    <div class="box" data-taste="yucky" style="--c:#9575cd"><div class="head">🤢 yucky</div><div class="pile" data-pile="yucky"><span class="q">👆</span></div></div>
  </div>
</div>

<div class="popup" id="popup"></div>

<script>
/* ================================================================
   GE4 U4C16 — Taste Test
   Word bank straight from the GE4 U4 lessons:
   - U4C14 Fruit: apple banana lemon mango orange peach pear
     pineapple grapes watermelon
   - U4C15 Vegetables: carrot cabbage beans cucumber potato tomato
   - U4C13 Food + the taste-test classics: noodles rice egg meat
     fries pizza hamburger hot dog popcorn bread cake milk soup
     chicken cheese
   pl = grammatically plural ("the grapes TASTE …")
   ================================================================ */
const FOODS=[
  /* --- fast food: the default menu --- */
  {w:'pizza',      e:'🍕', pl:false, unc:false, cat:'fast'},
  {w:'hamburger',  e:'🍔', pl:false, unc:false, cat:'fast'},
  {w:'hot dog',    e:'🌭', pl:false, unc:false, cat:'fast'},
  {w:'fries',      e:'🍟', pl:true,  unc:false, cat:'fast'},
  {w:'popcorn',    e:'🍿', pl:false, unc:true,  cat:'fast'},
  /* --- fruits (U4C14) --- */
  {w:'apple',      e:'🍎', pl:false, unc:false, cat:'fruit'},
  {w:'banana',     e:'🍌', pl:false, unc:false, cat:'fruit'},
  {w:'lemon',      e:'🍋', pl:false, unc:false, cat:'fruit'},
  {w:'mango',      e:'🥭', pl:false, unc:false, cat:'fruit'},
  {w:'orange',     e:'🍊', pl:false, unc:false, cat:'fruit'},
  {w:'peach',      e:'🍑', pl:false, unc:false, cat:'fruit'},
  {w:'pear',       e:'🍐', pl:false, unc:false, cat:'fruit'},
  {w:'pineapple',  e:'🍍', pl:false, unc:false, cat:'fruit'},
  {w:'grapes',     e:'🍇', pl:true,  unc:false, cat:'fruit'},
  {w:'watermelon', e:'🍉', pl:false, unc:false, cat:'fruit'},
  /* --- vegetables (U4C15) --- */
  {w:'carrot',     e:'🥕', pl:false, unc:false, cat:'veg'},
  {w:'cabbage',    e:'🥬', pl:false, unc:false, cat:'veg'},
  {w:'beans',      e:'🫘', pl:true,  unc:false, cat:'veg'},
  {w:'cucumber',   e:'🥒', pl:false, unc:false, cat:'veg'},
  {w:'potato',     e:'🥔', pl:false, unc:false, cat:'veg'},
  {w:'tomato',     e:'🍅', pl:false, unc:false, cat:'veg'},
  /* --- other food (U4C13) --- */
  {w:'noodles',    e:'🍜', pl:true,  unc:false, cat:'other'},
  {w:'rice',       e:'🍚', pl:false, unc:true,  cat:'other'},
  {w:'egg',        e:'🍳', pl:false, unc:false, cat:'other'},
  {w:'meat',       e:'🍖', pl:false, unc:true,  cat:'other'},
  {w:'bread',      e:'🍞', pl:false, unc:true,  cat:'other'},
  {w:'cake',       e:'🍰', pl:false, unc:false, cat:'other'},
  {w:'milk',       e:'🥛', pl:false, unc:true,  cat:'other'},
  {w:'soup',       e:'🍲', pl:false, unc:true,  cat:'other'},
  {w:'chicken',    e:'🍗', pl:false, unc:true,  cat:'other'},
  {w:'cheese',     e:'🧀', pl:false, unc:true,  cat:'other'}
];
const TASTES={
  yummy:{e:'😋', face:'😋', exc:'Yummy!', color:'#ff7043'},
  good: {e:'🙂', face:'🙂', exc:'Good!',  color:'#ffb300'},
  bad:  {e:'😖', face:'😖', exc:'Hmm!',   color:'#78909c'},
  yucky:{e:'🤢', face:'🤢', exc:'Yucky!', color:'#9575cd'}
};
const HUE={fast:[-35,10], fruit:[-15,35], veg:[65,125], other:[150,260]};   // bg hue-rotate range per category

/* ============ AUDIO (synth effects only — no files) ============ */
let AC,soundOn=true;
function initAudio(){if(!soundOn)return;if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}
function tone(f,type,dur,vol,del){
  vol=vol||.25;del=del||0;
  if(!AC||!soundOn)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,AC.currentTime+del);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+del+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(AC.currentTime+del);o.stop(AC.currentTime+del+dur);
}
function sndCheer(){
  initAudio();if(!AC)return;
  const dur=.9,sr=AC.sampleRate,buf=AC.createBuffer(1,sr*dur,sr),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);
  const src=AC.createBufferSource();src.buffer=buf;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.8;
  const g=AC.createGain();g.gain.setValueAtTime(.5,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  src.connect(bp);bp.connect(g);g.connect(AC.destination);src.start();
  for(let i=0;i<5;i++)tone(500+Math.random()*500,'sine',.18,.1,Math.random()*.5);
}
function sndCorrect(){initAudio();tone(523,'sine',.18,.22,0);tone(659,'sine',.18,.22,.09);tone(784,'sine',.25,.28,.18);tone(1047,'sine',.35,.18,.3)}
function sndReveal(){initAudio();tone(660,'triangle',.12,.15,0);tone(880,'triangle',.14,.15,.08);tone(1100,'triangle',.2,.18,.16)}
function sndPop(){initAudio();tone(700,'sine',.07,.16);tone(1050,'sine',.08,.14,.05)}
function sndNext(){
  initAudio();if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';
  o.frequency.setValueAtTime(350,AC.currentTime);o.frequency.exponentialRampToValueAtTime(900,AC.currentTime+.12);
  g.gain.setValueAtTime(.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.18);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.18);
}

/* ============ CONFETTI ============ */
const cvs=document.getElementById('confetti'),cx=cvs.getContext('2d');
let pts=[],afr=null;
function rCvs(){cvs.width=innerWidth;cvs.height=innerHeight}
addEventListener('resize',rCvs);rCvs();
function boom(x,y,n){
  n=n||120;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*14+4;
    pts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,
      col:['#ffe66d','#ff6b6b','#4ecdc4','#45b7d1','#f9ca24','#ff9ff3','#2ed573','#ff6348','#7bed9f'][~~(Math.random()*9)],
      sz:Math.random()*7+3,life:1,rot:Math.random()*360,rs:(Math.random()-.5)*15,
      sh:Math.random()>.4?'r':'c'});}
  if(!afr)aLoop();
}
function aLoop(){cx.clearRect(0,0,cvs.width,cvs.height);
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx;p.vy+=.22;p.y+=p.vy;p.vx*=.99;p.life-=.01;p.rot+=p.rs;
    if(p.life<=0||p.y>cvs.height+30){pts.splice(i,1);continue}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot*Math.PI/180);cx.globalAlpha=Math.min(1,p.life*2.5);cx.fillStyle=p.col;
    if(p.sh==='r')cx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.6);
    else{cx.beginPath();cx.arc(0,0,p.sz/2,0,Math.PI*2);cx.fill()}
    cx.restore();}
  if(pts.length>0)afr=requestAnimationFrame(aLoop);else{afr=null;cx.clearRect(0,0,cvs.width,cvs.height);}
}

/* ============ STATE & HELPERS ============ */
let cur=null,phase='',picked=null,tasted=0;
const used=new Set();
const $=id=>document.getElementById(id);
const banner=$('banner'),promptEl=$('prompt'),mainBtn=$('mainBtn'),pic=$('pic'),card=$('card'),
      chipsEl=$('chips'),popupEl=$('popup'),bg=$('bg'),rcEl=$('rc');
const boxEl={},pileEl={};
document.querySelectorAll('.box').forEach(b=>{boxEl[b.dataset.taste]=b;pileEl[b.dataset.taste]=b.querySelector('.pile')});

function popup(txt){
  popupEl.textContent=txt;popupEl.className='popup show';
  setTimeout(()=>popupEl.className='popup',1300);
}
function solidBanner(html,cls){banner.className='banner solid'+(cls?' '+cls:'');banner.innerHTML=html}
function setPrompt(t){promptEl.textContent=t}
function setBtn(label,fn,cls,dim){
  mainBtn.className='mainbtn'+(cls?' '+cls:'')+(dim?' dim':'');
  mainBtn.textContent=label;mainBtn.onclick=fn;
  mainBtn.classList.remove('hide');
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

/* which foods are on the menu right now: fast food always, the rest by toggle */
const catOn={fruit:false, veg:false, other:false};
function menuIdx(){
  return FOODS.map((f,i)=>i).filter(i=>f0Cat(i)==='fast'||catOn[f0Cat(i)]);
}
function f0Cat(i){return FOODS[i].cat}
function pickUnused(){
  let pool=menuIdx().filter(i=>!used.has(i));
  if(!pool.length){used.clear();pool=menuIdx()}
  return pool[~~(Math.random()*pool.length)];
}
/* “How do your fries taste?” / “How does your rice taste?” — always “your”, no articles */
function qText(f){
  return f.pl ? 'How do your '+f.w+' taste?' : 'How does your '+f.w+' taste?';
}

/* ============ FLOW ============
   food shown (no question) -> question revealed -> kid picks a taste
   word -> reveal the answer (follows the kid's pick) -> food flies
   into its sort box -> next student   */
function newRound(){
  phase='look';picked=null;
  const idx=pickUnused();
  used.add(idx);cur=FOODS[idx];
  tasted++;rcEl.textContent='🍽️ Tasted: '+tasted;
  // background mood shifts with the food
  const range=HUE[cur.cat];
  bg.style.filter='hue-rotate('+Math.round(range[0]+Math.random()*(range[1]-range[0]))+'deg) saturate(1.05)';
  // card
  pic.textContent=cur.e;
  card.classList.remove('done');card.classList.add('sway');
  card.style.animation='none';void card.offsetWidth;card.style.animation='';
  // banner + prompt
  banner.className='banner';
  banner.innerHTML='<div class="row">🎤 <b>Ask the question!</b></div>';
  setPrompt('🗣️ Everyone say the food word — then ask the question!');
  // chips hidden until the question
  chipsEl.classList.add('hide');chipsEl.innerHTML='';
  setBtn('Ask the Question! 🎤',phaseQuestion);
}
function phaseQuestion(){
  phase='question';sndReveal();
  solidBanner('💬 <b>“'+qText(cur)+'”</b>','bigquestion');
  setPrompt('🗣️ A student asks the question! Now pick a taste word! 👇');
  // build the 4 taste chips
  chipsEl.innerHTML='';
  Object.keys(TASTES).forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='chip';b.style.setProperty('--c',TASTES[t].color);
    b.style.animationDelay=(i*.09)+'s';
    b.innerHTML='<span class="e">'+TASTES[t].e+'</span><span class="w">'+t+'</span>';
    b.onclick=()=>pickTaste(t,b);
    chipsEl.appendChild(b);
  });
  chipsEl.classList.remove('hide');
  mainBtn.classList.add('hide');   // reveal button only appears AFTER a taste is picked
}
function pickTaste(t,btn){
  if(phase!=='question')return;
  picked=t;sndPop();
  chipsEl.querySelectorAll('.chip').forEach(c=>{c.classList.remove('sel');c.classList.add('off')});
  btn.classList.remove('off');btn.classList.add('sel');
  // the food goes into the chosen box right away — the answer stays hidden!
  flyToBox(t);
  setPrompt('👀 Into the “'+t+'” box! Now reveal the answer! 👇');
  setBtn('Reveal the Answer 👀',doReveal);
}
function doReveal(){
  if(!picked){
    promptEl.classList.remove('shake');void promptEl.offsetWidth;promptEl.classList.add('shake');
    setPrompt('👆 Pick a taste word first!');
    return;
  }
  phase='revealed';
  sndCorrect();sndCheer();
  const verb=cur.pl?'taste':'tastes';
  const line='My '+cur.w+' '+verb+' '+picked+'!';
  solidBanner(
    '<div class="row" style="animation-delay:0s">— '+qText(cur)+'</div>'+
    '<div class="row" style="animation-delay:.22s">— '+line+'</div>');
  popup(picked.toUpperCase()+'! '+TASTES[picked].e);
  const r=chipsEl.querySelector('.sel').getBoundingClientRect();
  boom(r.left+r.width/2,r.top+r.height/2,130);
  setPrompt('🔁 Everyone say it — with feeling!');
  setBtn('Next Student ▶ 🧒',()=>{sndNext();newRound()},'green');
}
function flyToBox(taste){
  const bx=boxEl[taste];
  bx.classList.add('glow');setTimeout(()=>bx.classList.remove('glow'),1200);
  const fr=card.getBoundingClientRect(),br=bx.getBoundingClientRect();
  const fl=document.createElement('div');
  fl.className='flyer';fl.textContent=cur.e;
  fl.style.left=(fr.left+fr.width/2)+'px';
  fl.style.top=(fr.top+fr.height/2)+'px';
  document.body.appendChild(fl);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fl.style.left=(br.left+br.width/2)+'px';
    fl.style.top=(br.top+br.height-40)+'px';
    fl.style.fontSize='1.6rem';
    fl.style.opacity='.95';
  }));
  setTimeout(()=>{
    fl.remove();
    addToPile(taste,cur.e);
    sndPop();
    card.classList.add('done');card.classList.remove('sway');
  },500);
}
function addToPile(taste,e){
  const s=pileEl[taste];
  const q=s.querySelector('.q');if(q)q.remove();
  const sp=document.createElement('span');
  sp.textContent=e;
  sp.style.setProperty('--r',(Math.random()*24-12)+'deg');
  s.appendChild(sp);
}
function resetAll(){
  Object.keys(pileEl).forEach(t=>{pileEl[t].innerHTML='<span class="q">👆</span>'});
  used.clear();tasted=0;rcEl.textContent='🍽️ Tasted: 0';
  sndNext();newRound();
}

/* ============ WIRING ============ */
['tgFruit','tgVeg','tgOther'].forEach((id,k)=>{
  const cat=['fruit','veg','other'][k];
  $(id).onclick=()=>{
    catOn[cat]=!catOn[cat];
    $(id).classList.toggle('on',catOn[cat]);
    sndPop();
    setPrompt(catOn[cat]
      ? '🍽️ '+cat+' added to the menu!'
      : '🍽️ '+cat+' removed from the menu.');
  };
});
$('tgReset').onclick=()=>{resetAll()};
$('tgS').onclick=()=>{
  soundOn=!soundOn;
  $('tgS').classList.toggle('on',soundOn);
  $('tgS').textContent=soundOn?'🔊':'🔇';
  if(soundOn)sndPop();
};

function startGame(){
  const ov=$('startOv');if(ov)ov.remove();
  initAudio();
  newRound();
}
$('startOv').addEventListener('click',startGame,{once:true});
</script>

<!-- Bilingo game controls: zoom + fullscreen + sound (gear toggle, auto-hide 7s) -->
<style>
  .bilingo-ui {
    position: fixed; right: 12px; bottom: 12px; z-index: 2147483646;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: system-ui, sans-serif;
  }
  .bilingo-ui button {
    width: 48px; height: 48px; border: 0; border-radius: 14px;
    background: rgba(18, 18, 32, .55); color: #fff; font-size: 1.2rem; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    display: grid; place-items: center; transition: background .15s, transform .15s;
  }
  .bilingo-ui button:hover { background: rgba(70, 60, 150, .75); transform: scale(1.08); }
  .bilingo-ui .b-pct { font-size: .95rem; font-weight: 800; color: #fff; opacity: .9;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
  /* the gear always stays; everything else only shows while open */
  .bilingo-ui:not(.open) > *:not(.b-handle) { display: none; }
  /* never let the buttons leak into a paper printout */
  @media print { .bilingo-ui { display: none !important; } }
</style>
<div id="bilingo-ui" class="bilingo-ui">
  <button type="button" class="b-plus" title="Bigger (zoom in)" aria-label="Bigger">+</button>
  <div class="b-pct">100%</div>
  <button type="button" class="b-minus" title="Smaller (zoom out)" aria-label="Smaller">−</button>
  <button type="button" class="b-mute" title="Sound on/off" aria-label="Sound on or off">🔊</button>
  <button type="button" class="b-fs" title="Fullscreen on/off" aria-label="Fullscreen">⛶</button>
  <button type="button" class="b-handle" title="Show / hide controls" aria-label="Show or hide controls">⚙️</button>
</div>
<script>
(function () {
  if (window.__bilingoUI) return;
  window.__bilingoUI = true;
  var bar = document.getElementById('bilingo-ui');
  var pct = bar.querySelector('.b-pct');
  var MIN = 0.5, MAX = 2.5, STEP = 0.1, KEY = 'bilingo-zoom', IDLE = 7000;
  var z = parseFloat(localStorage.getItem(KEY) || '1');
  if (isNaN(z)) z = 1;
  z = Math.min(MAX, Math.max(MIN, z));
  function apply() {
    document.documentElement.style.setProperty('zoom', z);
    pct.textContent = Math.round(z * 100) + '%';
  }
  function shrink() { z = Math.max(MIN, Math.round((z - STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function grow() { z = Math.min(MAX, Math.round((z + STEP) * 100) / 100); localStorage.setItem(KEY, z); apply(); poke(); }
  function toggleFS() {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(function () {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
    poke();
  }

  /* ----- sound on/off: one switch for EVERY sound system a game might use -----
     Synthesized WebAudio games create oscillators/buffer sources at play time,
     so patching the prototype constructors silences them even if their context
     was created earlier. Games using <audio> elements are covered by patching
     play(). The flag is read live, so un-muting works instantly too. */
  var MUTE_KEY = 'bilingo-muted';
  window.__bilingoMuted = localStorage.getItem(MUTE_KEY) === '1';
  function dummyParam() {
    return { value: 0, setValueAtTime: function () {}, linearRampToValueAtTime: function () {},
             exponentialRampToValueAtTime: function () {}, cancelScheduledValues: function () {} };
  }
  function dummyNode() {
    var n = { connect: function (d) { return d || n; }, disconnect: function () {},
              start: function () {}, stop: function () {},
              gain: dummyParam(), frequency: dummyParam(), detune: dummyParam(),
              playbackRate: dummyParam(), Q: dummyParam(),
              type: '', buffer: null, loop: false, onended: null };
    return n;
  }
  [window.AudioContext, window.webkitAudioContext].forEach(function (AC) {
    if (!AC || !AC.prototype) return;
    ['createOscillator', 'createBufferSource'].forEach(function (m) {
      var orig = AC.prototype[m];
      AC.prototype[m] = function () { return window.__bilingoMuted ? dummyNode() : orig.apply(this, arguments); };
    });
  });
  var origPlay = HTMLAudioElement.prototype.play;
  HTMLAudioElement.prototype.play = function () {
    if (window.__bilingoMuted) return Promise.resolve();
    return origPlay.apply(this, arguments);
  };
  var muteBtn = bar.querySelector('.b-mute');
  function showMute() { muteBtn.textContent = window.__bilingoMuted ? '🔇' : '🔊'; }
  function setMute(m) {
    window.__bilingoMuted = m;
    localStorage.setItem(MUTE_KEY, m ? '1' : '0');
    if (m) { /* stop anything already ringing this second */
      document.querySelectorAll('audio').forEach(function (a) { a.pause(); });
    }
    showMute();
  }
  muteBtn.addEventListener('click', function () { setMute(!window.__bilingoMuted); poke(); });
  showMute();

  bar.querySelector('.b-plus').addEventListener('click', grow);
  bar.querySelector('.b-minus').addEventListener('click', shrink);
  bar.querySelector('.b-fs').addEventListener('click', toggleFS);
  bar.querySelector('.b-handle').addEventListener('click', function () {
    bar.classList.toggle('open');
    poke();
  });
  /* collapse 7 s after the last tap anywhere on the bar */
  var idleTimer = null;
  function poke() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { bar.classList.remove('open'); }, IDLE);
  }
  bar.addEventListener('pointerdown', poke);
  apply();
})();
</script>
</body>
</html>
