<!DOCTYPE html><html lang="en"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What should you do when...?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 30px 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: rgba(255, 193, 7, 0.15);
            border-radius: 50%;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: -30px;
            width: 100px;
            height: 100px;
            background: rgba(76, 175, 80, 0.12);
            border-radius: 50%;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 1.3rem;
            color: #5c2d91;
            margin-bottom: 5px;
        }

        .progress {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e0e0e0;
            transition: all 0.3s;
        }

        .dot.active {
            background: #ff9800;
            transform: scale(1.3);
            box-shadow: 0 2px 8px rgba(255, 152, 0, 0.5);
        }

        .dot.done {
            background: #4caf50;
        }

        .chat-area {
            position: relative;
            z-index: 1;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .chat-row.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .chat-row.right {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .avatar.teacher {
            background: linear-gradient(135deg, #ff9800, #f44336);
        }

        .avatar.student {
            background: linear-gradient(135deg, #42a5f5, #7c4dff);
        }

        .bubble {
            flex: 1;
            max-width: 85%;
        }

        .bubble-inner {
            border-radius: 20px;
            padding: 16px 20px;
            position: relative;
        }

        .chat-row:not(.right) .bubble-inner {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            border: 2px solid #ffcc80;
            border-bottom-left-radius: 6px;
        }

        .chat-row.right .bubble-inner {
            background: linear-gradient(135deg, #e8eaf6, #c5cae9);
            border: 2px solid #9fa8da;
            border-bottom-right-radius: 6px;
        }

        .bubble-label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            color: #e65100;
        }

        .chat-row.right .bubble-label {
            color: #283593;
            text-align: right;
        }

        .emoji-hint {
            font-size: 1.6rem;
            margin-bottom: 4px;
            line-height: 1.5;
        }

        .emoji-hint .text {
            font-size: 1.1rem;
            color: #333;
            font-weight: 600;
            vertical-align: middle;
        }

        .full-sentence {
            font-size: 1.05rem;
            font-weight: 700;
            padding: 10px 14px;
            border-radius: 12px;
            margin-top: 10px;
            display: none;
        }

        .full-sentence.show {
            display: block;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .chat-row:not(.right) .full-sentence {
            background: rgba(230, 81, 0, 0.1);
            color: #bf360c;
            border-left: 4px solid #e65100;
        }

        .chat-row.right .full-sentence {
            background: rgba(40, 53, 147, 0.08);
            color: #1a237e;
            border-left: 4px solid #3f51b5;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .mystery-box {
            background: repeating-linear-gradient(
                45deg,
                #e8eaf6,
                #e8eaf6 10px,
                #c5cae9 10px,
                #c5cae9 20px
            );
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px dashed #7c4dff;
        }

        .mystery-box:hover {
            transform: scale(1.02);
        }

        .mystery-box .mystery-text {
            font-size: 1.2rem;
            font-weight: 800;
            color: #5c2d91;
        }

        .mystery-box.opened {
            background: transparent;
            border-style: solid;
            border-color: #9fa8da;
            cursor: default;
        }

        .mystery-box.opened .mystery-text {
            display: none;
        }

        .mystery-box .hidden-content {
            display: none;
        }

        .mystery-box.opened .hidden-content {
            display: block;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn {
            display: inline-block;
            margin-top: 12px;
            padding: 11px 22px;
            border: none;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-reveal-q {
            background: linear-gradient(135deg, #ff9800, #f44336);
            color: white;
        }

        .btn-reveal-a {
            background: linear-gradient(135deg, #42a5f5, #7c4dff);
            color: white;
        }

        .btn-next {
            background: linear-gradient(135deg, #4caf50, #00c853);
            color: white;
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            font-size: 1rem;
        }

        .btn.hidden {
            display: none;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: fall 1.5s ease-in forwards;
        }

        @keyframes fall {
            0% { opacity: 1; transform: translateY(0) rotate(0deg); }
            100% { opacity: 0; transform: translateY(200px) rotate(720deg); }
        }

        .counter {
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            margin-top: 15px;
            font-weight: 600;
        }

        .sparkle {
            display: inline-block;
            animation: sparkle 0.6s ease-in-out;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <h1>🎒 What should you do when...? 🎒</h1>
            <div class="progress" id="progress"></div>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="counter" id="counter"></div>
    </div>

    <script>
        const pairs = [
            {
                qHint: 'you have a ❓',
                qFull: 'What should you do when you have a question?',
                aHint: 'raise your 🤚',
                aFull: 'You should raise your hand.'
            },
            {
                qHint: 'someone 👊 you',
                qFull: 'What should you do when someone hits you?',
                aHint: 'tell the 👩‍🏫',
                aFull: 'You should tell the teacher.'
            },
            {
                qHint: 'you are 🥶',
                qFull: 'What should you do when you are cold?',
                aHint: 'put on a 🧥',
                aFull: 'You should put on a jacket.'
            },
            {
                qHint: 'you need the 🚽',
                qFull: 'What should you do when you need to go to the toilet?',
                aHint: 'raise your 🤚',
                aFull: 'You should raise your hand.'
            },
            {
                qHint: 'you see a 🔥',
                qFull: 'What should you do when you see a fire?',
                aHint: 'run 🚪',
                aFull: 'You should run outside.'
            },
            {
                qHint: 'you are 😴',
                qFull: 'What should you do when you are sleepy?',
                aHint: 'go to 🛏️ early',
                aFull: 'You should go to bed early.'
            },
            {
                qHint: 'it is 🥵',
                qFull: 'What should you do when it is hot?',
                aHint: 'drink more 💧',
                aFull: 'You should drink more water.'
            },
            {
                qHint: 'you are 🤒',
                qFull: 'What should you do when you are sick?',
                aHint: 'go to the 🏥',
                aFull: 'You should go to the doctor.'
            },
            {
                qHint: 'someone is 😢',
                qFull: 'What should you do when someone is crying?',
                aHint: 'be 💛 to them',
                aFull: 'You should be kind to them.'
            },
            {
                qHint: 'it is 🌧️',
                qFull: 'What should you do when it is raining?',
                aHint: 'take an ☂️',
                aFull: 'You should take an umbrella.'
            },
            {
                qHint: 'the teacher is 🗣️',
                qFull: 'What should you do when the teacher is talking?',
                aHint: 'listen and be 🤫',
                aFull: 'You should listen and be quiet.'
            },
            {
                qHint: 'you make a ❌',
                qFull: 'What should you do when you make a mistake?',
                aHint: 'say 🙏 and try again',
                aFull: 'You should say sorry and try again.'
            }
        ];

        let current = 0;
        let phase = 0; // 0: show Q hint, 1: revealed Q + show mystery, 2: opened mystery, 3: revealed answer

        const chatArea = document.getElementById('chatArea');
        const progressEl = document.getElementById('progress');
        const counterEl = document.getElementById('counter');

        function buildProgress() {
            progressEl.innerHTML = '';
            pairs.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'dot' + (i < current ? ' done' : '') + (i === current ? ' active' : '');
                progressEl.appendChild(dot);
            });
            counterEl.textContent = `${current + 1} / ${pairs.length}`;
        }

        function renderPair() {
            chatArea.innerHTML = '';
            phase = 0;
            buildProgress();

            const pair = pairs[current];

            // Question row (left)
            const qRow = document.createElement('div');
            qRow.className = 'chat-row';
            qRow.innerHTML = `
                <div class="avatar teacher">👩‍🏫</div>
                <div class="bubble">
                    <div class="bubble-inner">
                        <div class="bubble-label">🤔 Question</div>
                        <div class="emoji-hint"><span class="text">${pair.qHint}</span></div>
                        <div class="full-sentence" id="qFull">${pair.qFull}</div>
                        <button class="btn btn-reveal-q" id="btnRevealQ" onclick="revealQuestion()">Reveal Question ✨</button>
                    </div>
                </div>
            `;
            chatArea.appendChild(qRow);
            setTimeout(() => qRow.classList.add('visible'), 100);
        }

        function revealQuestion() {
            phase = 1;
            document.getElementById('qFull').classList.add('show');
            document.getElementById('btnRevealQ').classList.add('hidden');

            // Show answer row (right) with mystery box
            setTimeout(() => {
                const pair = pairs[current];
                const aRow = document.createElement('div');
                aRow.className = 'chat-row right';
                aRow.innerHTML = `
                    <div class="avatar student">🧑‍🎓</div>
                    <div class="bubble">
                        <div class="bubble-inner">
                            <div class="bubble-label">💡 Answer</div>
                            <div class="mystery-box" id="mysteryBox" onclick="openMystery()">
                                <div class="mystery-text">🎁 Tap to see hint!</div>
                                <div class="hidden-content">
                                    <div class="emoji-hint"><span class="text">${pair.aHint}</span></div>
                                </div>
                            </div>
                            <div class="full-sentence" id="aFull">${pair.aFull}</div>
                            <button class="btn btn-reveal-a hidden" id="btnRevealA" onclick="revealAnswer()">Reveal Answer 🎉</button>
                        </div>
                    </div>
                `;
                chatArea.appendChild(aRow);
                setTimeout(() => aRow.classList.add('visible'), 100);
            }, 400);
        }

        function openMystery() {
            if (phase < 1) return;
            phase = 2;
            const box = document.getElementById('mysteryBox');
            box.classList.add('opened');
            document.getElementById('btnRevealA').classList.remove('hidden');
        }

        function revealAnswer() {
            phase = 3;
            document.getElementById('aFull').classList.add('show');
            document.getElementById('btnRevealA').classList.add('hidden');
            spawnConfetti();

            // Show next button
            if (current < pairs.length - 1) {
                const nextBtn = document.createElement('button');
                nextBtn.className = 'btn btn-next';
                nextBtn.innerHTML = 'Next Student 🚀';
                nextBtn.onclick = nextPair;
                chatArea.appendChild(nextBtn);
                setTimeout(() => nextBtn.style.animation = 'popIn 0.4s ease', 50);
            } else {
                const done = document.createElement('div');
                done.style.textAlign = 'center';
                done.style.marginTop = '20px';
                done.style.fontSize = '1.5rem';
                done.innerHTML = '🎊 Amazing! All done! 🎊';
                chatArea.appendChild(done);
            }
        }

        function nextPair() {
            current++;
            renderPair();
        }

        function spawnConfetti() {
            const container = document.getElementById('app');
            const colors = ['#ff9800', '#4caf50', '#42a5f5', '#e91e63', '#ffeb3b', '#7c4dff'];
            for (let i = 0; i < 15; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + '%';
                conf.style.top = Math.random() * 30 + '%';
                conf.style.background = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDelay = Math.random() * 0.5 + 's';
                conf.style.width = (6 + Math.random() * 6) + 'px';
                conf.style.height = (6 + Math.random() * 6) + 'px';
                container.appendChild(conf);
                setTimeout(() => conf.remove(), 2000);
            }
        }

        renderPair();
    </script>


</body></html>
