<!DOCTYPE html><html><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Rules Sorting</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .student-indicator {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        .progress {
            color: white;
            font-size: 0.9rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        .sentence-card {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #333;
            cursor: grab;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            max-width: 90%;
        }
        .sentence-card:active {
            cursor: grabbing;
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
        }
        .sentence-card.dragging {
            opacity: 0.6;
            transform: scale(1.05);
        }
        .sentence-card.hidden {
            display: none;
        }
        .drop-zones {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .drop-zone {
            flex: 1;
            min-width: 250px;
            min-height: 150px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: transform 0.2s, background 0.2s;
            border: 4px dashed rgba(255,255,255,0.5);
        }
        .drop-zone.should {
            background: rgba(72, 199, 142, 0.3);
        }
        .drop-zone.shouldnt {
            background: rgba(255, 99, 99, 0.3);
        }
        .drop-zone.drag-over {
            transform: scale(1.05);
            border-color: white;
        }
        .drop-zone.should.drag-over {
            background: rgba(72, 199, 142, 0.6);
        }
        .drop-zone.shouldnt.drag-over {
            background: rgba(255, 99, 99, 0.6);
        }
        .drop-zone h2 {
            color: white;
            font-size: 1.5rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .drop-zone p {
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }
        .sorted-item {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 6px;
            text-align: center;
            width: 100%;
        }
        .reveal-btn {
            padding: 15px 35px;
            background: linear-gradient(135deg, #f6d365, #fda085);
            color: #333;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            margin-top: 10px;
            display: none;
        }
        .reveal-btn:hover {
            transform: scale(1.05);
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .overlay.visible {
            display: flex;
        }
        .overlay-sentence {
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.3;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
            animation: popIn 0.4s ease;
        }
        .overlay-sentence.correct-sentence {
            color: #48c78e;
        }
        .overlay-sentence.wrong-sentence {
            color: #ff6b6b;
        }
        .overlay-label {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 10px;
        }
        .next-btn {
            padding: 15px 35px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            margin-top: 10px;
        }
        .next-btn:hover {
            transform: scale(1.05);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }
        .finished {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            margin-top: 20px;
        }
        .finished h2 {
            color: #333;
            font-size: 1.6rem;
            margin-bottom: 10px;
        }
        .finished p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .score {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        .restart-btn {
            margin-top: 15px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .restart-btn:hover {
            transform: scale(1.05);
        }
        @media (max-width: 500px) {
            .drop-zones {
                flex-direction: column;
                gap: 15px;
            }
            .drop-zone {
                min-height: 100px;
            }
            .sentence-card {
                font-size: 1.1rem;
                padding: 15px 20px;
            }
            h1 {
                font-size: 1.4rem;
            }
            .overlay-sentence {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <h1>📚 Classroom Rules Sorting</h1>
    <div class="student-indicator" id="studentIndicator">🎓 Student 1's turn</div>
    <div class="progress" id="progress">Question 1 of 10</div>

    <div class="sentence-card" id="sentenceCard" draggable="true"></div>

    <button class="reveal-btn" id="revealBtn">🔍 Reveal the sentence</button>

    <div class="drop-zones">
        <div class="drop-zone should" id="shouldZone">
            <h2>✅ You should</h2>
            <p>Drop here</p>
            <div id="shouldList"></div>
        </div>
        <div class="drop-zone shouldnt" id="shouldntZone">
            <h2>❌ You shouldn't</h2>
            <p>Drop here</p>
            <div id="shouldntList"></div>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-label" id="overlayLabel"></div>
        <div class="overlay-sentence" id="overlaySentence"></div>
        <button class="next-btn" id="nextBtn">➡️ Next Student</button>
    </div>

    <script>
        const situations = [
            { text: "pay attention to the teacher", answer: "should" },
            { text: "make noise in class", answer: "shouldnt" },
            { text: "ask for help", answer: "should" },
            { text: "talk loudly during a test", answer: "shouldnt" },
            { text: "read aloud when the teacher asks", answer: "should" },
            { text: "help your friends", answer: "should" },
            { text: "be messy in the classroom", answer: "shouldnt" },
            { text: "listen quietly", answer: "should" },
            { text: "run in the classroom", answer: "shouldnt" },
            { text: "understand the class rules", answer: "should" }
        ];

        let currentIndex = 0;
        let correctCount = 0;
        let currentChoice = null;
        let waitingForReveal = false;

        const card = document.getElementById('sentenceCard');
        const shouldZone = document.getElementById('shouldZone');
        const shouldntZone = document.getElementById('shouldntZone');
        const shouldList = document.getElementById('shouldList');
        const shouldntList = document.getElementById('shouldntList');
        const progress = document.getElementById('progress');
        const studentIndicator = document.getElementById('studentIndicator');
        const revealBtn = document.getElementById('revealBtn');
        const overlay = document.getElementById('overlay');
        const overlaySentence = document.getElementById('overlaySentence');
        const overlayLabel = document.getElementById('overlayLabel');
        const nextBtn = document.getElementById('nextBtn');

        function loadSituation() {
            if (currentIndex >= situations.length) {
                showFinished();
                return;
            }
            card.textContent = situations[currentIndex].text;
            card.classList.remove('hidden');
            revealBtn.style.display = 'none';
            waitingForReveal = false;
            progress.textContent = `Question ${currentIndex + 1} of 10`;
            studentIndicator.textContent = `🎓 Student ${currentIndex + 1}'s turn`;
        }

        function handleDrop(chosenAnswer) {
            if (waitingForReveal) return;
            waitingForReveal = true;

            const situation = situations[currentIndex];
            const isCorrect = chosenAnswer === situation.answer;
            if (isCorrect) correctCount++;

            currentChoice = { chosenAnswer, isCorrect, situation };

            const sortedItem = document.createElement('div');
            sortedItem.className = 'sorted-item';
            sortedItem.textContent = situation.text;
            if (chosenAnswer === 'should') {
                shouldList.appendChild(sortedItem);
            } else {
                shouldntList.appendChild(sortedItem);
            }

            card.classList.add('hidden');
            revealBtn.style.display = 'block';
        }

        revealBtn.addEventListener('click', () => {
            if (!currentChoice) return;
            const { chosenAnswer, isCorrect, situation } = currentChoice;

            const fullSentence = chosenAnswer === "should"
                ? `You should ${situation.text}.`
                : `You shouldn't ${situation.text}.`;

            const correctSentence = situation.answer === "should"
                ? `You should ${situation.text}.`
                : `You shouldn't ${situation.text}.`;

            overlayLabel.textContent = isCorrect ? "✅ Correct!" : `❌ Wrong! The correct answer is:`;
            overlaySentence.textContent = isCorrect ? fullSentence : correctSentence;
            overlaySentence.className = `overlay-sentence ${isCorrect ? 'correct-sentence' : 'wrong-sentence'}`;

            if (currentIndex >= situations.length - 1) {
                nextBtn.textContent = '🎉 See Results';
            } else {
                nextBtn.textContent = '➡️ Next Student';
            }

            overlay.classList.add('visible');
            revealBtn.style.display = 'none';
        });

        nextBtn.addEventListener('click', () => {
            overlay.classList.remove('visible');
            currentChoice = null;
            currentIndex++;
            loadSituation();
        });

        function showFinished() {
            card.classList.add('hidden');
            revealBtn.style.display = 'none';
            progress.style.display = 'none';
            studentIndicator.style.display = 'none';

            const finDiv = document.createElement('div');
            finDiv.className = 'finished';
            finDiv.id = 'finishedBox';
            finDiv.innerHTML = `
                <h2>🎉 Great job, class!</h2>
                <p>You completed all the classroom rules!</p>
                <div class="score">${correctCount}/10 correct</div>
                <button class="restart-btn" onclick="restartGame()">Play Again</button>
            `;
            document.body.insertBefore(finDiv, document.querySelector('.drop-zones'));
        }

        function restartGame() {
            currentIndex = 0;
            correctCount = 0;
            currentChoice = null;
            waitingForReveal = false;
            shouldList.innerHTML = '';
            shouldntList.innerHTML = '';
            document.getElementById('finishedBox')?.remove();
            card.classList.remove('hidden');
            progress.style.display = 'block';
            studentIndicator.style.display = 'block';
            loadSituation();
        }

        // Drag events
        card.addEventListener('dragstart', (e) => {
            if (waitingForReveal) return;
            card.classList.add('dragging');
            e.dataTransfer.setData('text/plain', '');
        });
        card.addEventListener('dragend', () => {
            card.classList.remove('dragging');
        });

        [shouldZone, shouldntZone].forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                if (waitingForReveal) return;
                e.preventDefault();
                zone.classList.add('drag-over');
            });
            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                if (waitingForReveal) return;
                const answer = zone === shouldZone ? 'should' : 'shouldnt';
                handleDrop(answer);
            });
        });

        // Touch support
        let touchClone = null;
        let offsetX = 0, offsetY = 0;

        card.addEventListener('touchstart', (e) => {
            if (waitingForReveal) return;
            const touch = e.touches[0];
            const rect = card.getBoundingClientRect();
            offsetX = touch.clientX - rect.left;
            offsetY = touch.clientY - rect.top;

            touchClone = card.cloneNode(true);
            touchClone.style.position = 'fixed';
            touchClone.style.left = (touch.clientX - offsetX) + 'px';
            touchClone.style.top = (touch.clientY - offsetY) + 'px';
            touchClone.style.zIndex = '1000';
            touchClone.style.opacity = '0.8';
            touchClone.style.pointerEvents = 'none';
            document.body.appendChild(touchClone);
            card.style.opacity = '0.3';
        });

        card.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!touchClone) return;
            const touch = e.touches[0];
            touchClone.style.left = (touch.clientX - offsetX) + 'px';
            touchClone.style.top = (touch.clientY - offsetY) + 'px';

            const shouldRect = shouldZone.getBoundingClientRect();
            const shouldntRect = shouldntZone.getBoundingClientRect();

            shouldZone.classList.toggle('drag-over',
                touch.clientX >= shouldRect.left && touch.clientX <= shouldRect.right &&
                touch.clientY >= shouldRect.top && touch.clientY <= shouldRect.bottom);
            shouldntZone.classList.toggle('drag-over',
                touch.clientX >= shouldntRect.left && touch.clientX <= shouldntRect.right &&
                touch.clientY >= shouldntRect.top && touch.clientY <= shouldntRect.bottom);
        });

        card.addEventListener('touchend', (e) => {
            if (!touchClone) return;
            const touch = e.changedTouches[0];
            touchClone.remove();
            touchClone = null;
            card.style.opacity = '1';

            const shouldRect = shouldZone.getBoundingClientRect();
            const shouldntRect = shouldntZone.getBoundingClientRect();

            shouldZone.classList.remove('drag-over');
            shouldntZone.classList.remove('drag-over');

            if (touch.clientX >= shouldRect.left && touch.clientX <= shouldRect.right &&
                touch.clientY >= shouldRect.top && touch.clientY <= shouldRect.bottom) {
                handleDrop('should');
            } else if (touch.clientX >= shouldntRect.left && touch.clientX <= shouldntRect.right &&
                touch.clientY >= shouldntRect.top && touch.clientY <= shouldntRect.bottom) {
                handleDrop('shouldnt');
            }
        });

        // Click fallback
        shouldZone.addEventListener('click', () => {
            if (currentIndex < situations.length && !waitingForReveal) handleDrop('should');
        });
        shouldntZone.addEventListener('click', () => {
            if (currentIndex < situations.length && !waitingForReveal) handleDrop('shouldnt');
        });

        loadSituation();
    </script>


</body></html>
