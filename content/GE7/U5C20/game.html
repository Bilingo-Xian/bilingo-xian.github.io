<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GE7 U5C20 — Review Day: Compare &amp; Win!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Nunito',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  color:#fff;padding:10px 12px 30px;overflow-x:hidden;
  background:linear-gradient(135deg,#5f27cd,#341f97);
}
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.topbar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:980px;margin-bottom:6px;gap:8px;flex-wrap:wrap}
h1{font-size:clamp(1.05em,3.2vw,1.7em);text-shadow:2px 2px 8px rgba(0,0,0,.25)}
.rc{background:rgba(255,255,255,.22);padding:4px 16px;border-radius:20px;font-size:.85em;font-weight:700}
.sndbtn{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:20px;font-size:1rem;padding:3px 12px;cursor:pointer;font-family:inherit;font-weight:700}
.sndbtn.off{opacity:.45}
.hardbtn{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:20px;font-size:.85rem;padding:4px 14px;cursor:pointer;font-family:inherit;font-weight:900}
.hardbtn.on{background:linear-gradient(135deg,#ff922b,#f03e3e);border-color:#ffd8a8}
button.rc{cursor:pointer;border:0;font-family:inherit}
button.rc:disabled{opacity:.5;cursor:default}

.wrap{width:100%;max-width:980px;display:flex;gap:12px;align-items:flex-start}
.stage{
  flex:1;position:relative;
  background:linear-gradient(180deg,#2e2a5e,#3b3573);
  border:3px solid #ffd700;border-radius:24px;
  padding:14px 14px 18px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.curtain{position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg,#dc2626,#ffd700,#dc2626,#ffd700,#dc2626);border-radius:24px 24px 0 0}

.badge{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:8px auto 10px;width:fit-content;max-width:100%;
  background:rgba(255,255,255,.14);backdrop-filter:blur(8px);
  padding:8px 26px;border-radius:50px;
  font-size:clamp(1.2em,3.6vw,2em);font-weight:900;
  border:2px solid rgba(255,255,255,.3);text-align:center;
  animation:pulse 2.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

.banner{
  width:100%;max-width:700px;margin:0 auto 10px;min-height:60px;
  background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.35);
  border-radius:18px;padding:12px 16px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;gap:4px;
  font-size:clamp(.95em,2.3vw,1.4em);font-weight:900;line-height:1.35;transition:.35s;
}
.banner.solid{border-style:solid;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.16)}
.banner .say{font-size:.58em;opacity:.75;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.banner .row{animation:fadeUp .35s ease-out;line-height:1.5}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.prompt{text-align:center;font-size:clamp(.85em,2.2vw,1.05em);font-weight:700;color:rgba(255,255,255,.9);margin:2px 0 10px;min-height:1.6em;text-shadow:1px 1px 4px rgba(0,0,0,.2)}

/* ===== characters (game) ===== */
.chars{display:flex;justify-content:center;align-items:stretch;gap:8px;width:100%;margin:0 auto 8px;flex-wrap:nowrap}
.card{
  flex:1;min-width:0;max-width:170px;
  background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border-radius:20px;
  padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;
  border:3px solid rgba(255,255,255,.15);position:relative;
  transition:all .35s cubic-bezier(.4,0,.2,1);
}
.card.pick{cursor:pointer;border-color:rgba(255,215,0,.75);box-shadow:0 0 22px rgba(255,215,0,.35)}
.card.pick:hover{transform:scale(1.07);background:rgba(255,255,255,.2)}
.card.picked{border-color:#ffd700!important;box-shadow:0 0 35px rgba(255,215,0,.55)!important}
.card.sad{opacity:.55;filter:grayscale(.35)}
.card.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.avatar{width:clamp(52px,10vw,96px);height:clamp(52px,10vw,96px);object-fit:contain;margin-bottom:2px}
.cname{font-size:clamp(.85em,2.2vw,1.15em);font-weight:900;text-shadow:1px 1px 4px rgba(0,0,0,.25)}

.mainbtn{
  display:block;margin:8px auto 0;
  padding:14px 40px;font-size:clamp(1em,2.6vw,1.2em);font-weight:900;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#451a03;
  border:none;border-radius:50px;cursor:pointer;font-family:'Nunito',sans-serif;
  box-shadow:0 8px 26px rgba(251,191,36,.4);transition:all .25s;
  animation:glow 2s ease-in-out infinite;
}
.mainbtn:hover{transform:scale(1.06)}
.mainbtn:active{transform:scale(.97)}
.mainbtn.hide{display:none}
.mainbtn.green{background:linear-gradient(135deg,#34d399,#10b981);color:#022c22;box-shadow:0 8px 26px rgba(16,185,129,.4)}
.mainbtn.blue{background:linear-gradient(135deg,#74c0fc,#1c7ed6);color:#0b2540;box-shadow:0 8px 26px rgba(28,126,214,.4)}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}

.popup{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(2em,8vw,4em);font-weight:900;z-index:1000;pointer-events:none;text-shadow:3px 3px 12px rgba(0,0,0,.35);opacity:0}
.popup.show{animation:popIn 1.2s ease forwards}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(0);opacity:0}20%{transform:translate(-50%,-50%) scale(1.3);opacity:1}40%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}

/* character animations */
.a-shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.a-bounce{animation:abounce .55s ease-in-out infinite}
@keyframes abounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.a-tremble{animation:tremble .08s linear infinite}
@keyframes tremble{0%{transform:translate(0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}100%{transform:translate(1px,2px)}}
.a-sway{animation:sway 1.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}
.a-idle{animation:idle 3s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.a-jitter{animation:jitter .15s linear infinite}
@keyframes jitter{0%{transform:translate(0)}25%{transform:translate(3px,-3px)}50%{transform:translate(-3px,3px)}75%{transform:translate(3px,2px)}100%{transform:translate(-2px,-2px)}}
.a-dance{animation:dance .6s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12px) rotate(-9deg)}75%{transform:translateY(-12px) rotate(9deg)}}
.a-zoom{animation:zoom .5s ease-in-out infinite}
@keyframes zoom{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.a-sparkle{animation:sparkle .7s ease-in-out infinite}
@keyframes sparkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.14) rotate(6deg)}}

/* ===== review widgets ===== */
.reviewbox{width:100%;max-width:700px;margin:0 auto}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;min-height:52px}
.slot{
  min-width:74px;padding:8px 14px;border-radius:12px;text-align:center;
  background:rgba(255,255,255,.14);border:2px dashed rgba(255,255,255,.4);

}
.slot.filled{background:#ffd700;color:#333;border-style:solid;border-color:#ffd700;animation:pop .3s}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.slot.bad{border-color:#ff6b6b;animation:wrongShake .4s}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.tile{
  padding:8px 16px;border-radius:12px;background:#fff;color:#333;
  font-weight:900;font-size:clamp(.95em,2.4vw,1.25em);cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.28);transition:transform .15s;border:none;font-family:inherit;
}
.tile:hover{transform:scale(1.08)}
.tile.used{visibility:hidden}
.tile.nope{animation:wrongShake .4s}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.opt{
  padding:12px 22px;border-radius:16px;background:rgba(255,255,255,.94);color:#333;
  font-weight:900;font-size:clamp(1em,2.6vw,1.35em);cursor:pointer;border:none;font-family:inherit;
  box-shadow:0 5px 14px rgba(0,0,0,.28);transition:transform .15s;
}
.opt:hover{transform:scale(1.06)}
.opt.right{background:#51cf66;color:#0b3d1e;animation:pop .4s}
.opt.nope{animation:wrongShake .4s;background:#ff8787}
.rule{
  margin:10px auto 0;max-width:640px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);
  border-radius:16px;padding:12px 16px;font-size:clamp(.95em,2.4vw,1.2em);font-weight:700;line-height:1.6;text-align:center;
}
.rule b{color:#ffd700}
.story{
  margin:0 auto 10px;max-width:640px;background:rgba(255,255,255,.94);color:#333;
  border-radius:18px;padding:16px 20px;font-size:clamp(.9em,2.2vw,1.1em);font-weight:700;line-height:1.65;
}
.story b{color:#c2255c}
.qblock{margin:10px auto;max-width:640px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);border-radius:16px;padding:12px 14px}
.qq{font-weight:900;font-size:clamp(.95em,2.4vw,1.15em);margin-bottom:8px}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qopt{padding:8px 16px;border-radius:12px;background:rgba(255,255,255,.92);color:#333;font-weight:900;cursor:pointer;border:none;font-family:inherit;font-size:.95em}
.qopt.right{background:#51cf66;color:#0b3d1e}
.qopt.nope{animation:wrongShake .4s;background:#ff8787}

/* ===== side record ===== */
.record{width:250px;flex:0 0 auto;background:rgba(255,255,255,.08);border:3px dashed rgba(255,255,255,.3);border-radius:22px;padding:10px}
.record-head{text-align:center;font-weight:900;font-size:1em;margin-bottom:8px}
.record-head .small{display:block;font-size:.62em;opacity:.7;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.rec-card{background:rgba(255,255,255,.1);border-radius:14px;padding:6px;margin-bottom:7px;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid rgba(255,255,255,.12)}
.rec-card img{width:44px;height:44px;object-fit:contain}
.rec-name{font-weight:900;font-size:.9em}
.rec-titles{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:18px}
.rec-chip{background:#ffd700;color:#333;font-size:.62em;font-weight:900;padding:2px 7px;border-radius:8px;animation:pop .35s;box-shadow:0 2px 6px rgba(0,0,0,.25)}

/* ===== podium ===== */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;margin:14px auto 4px;min-height:240px;flex-wrap:wrap}
.pcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.pstep{
  width:clamp(64px,15vw,120px);border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;
  font-size:clamp(1.2em,3.5vw,2em);font-weight:900;color:rgba(0,0,0,.55);
  background:linear-gradient(180deg,#ffe066,#fab005);box-shadow:0 -4px 18px rgba(255,215,0,.35);
  animation:rise .7s cubic-bezier(.34,1.4,.64,1) backwards;
}
@keyframes rise{from{height:0!important;opacity:0}}
.pcol img{width:clamp(48px,10vw,84px);height:auto;object-fit:contain}
.pname{font-weight:900;font-size:.9em}
.pcount{font-size:.75em;opacity:.85;font-weight:700}
.crown{font-size:1.6em;animation:bounce2 1s ease-in-out infinite}
@keyframes bounce2{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

@media(max-width:820px){
  .wrap{flex-direction:column}
  .record{width:100%}
  .record-grid-mobile{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
}
</style>

<body>
<canvas id="confetti"></canvas>
<div class="topbar">
  <h1>🏆 Review Day — Compare &amp; Win! (U4–U5)</h1>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="sndbtn" id="sndBtn" title="sound on/off">🔊</button>
    <button class="hardbtn" id="hardBtn" title="harder mode: less / the least">😈 harder: OFF</button>
    <div class="rc" id="rc">Review 1</div>
    <button class="rc" id="skipReviewBtn">⏭ Skip review</button>
    <button class="rc" id="finishBtn" disabled>🏁 Finish</button>
  </div>
</div>

<div class="wrap">
  <div class="stage">
    <div class="curtain"></div>
    <div class="badge" id="badge">📖 Review Time!</div>
    <div class="banner" id="banner"></div>
    <div class="prompt" id="prompt">…</div>
    <div class="reviewbox" id="reviewbox"></div>
    <div class="chars" id="chars" style="display:none"></div>
    <button class="mainbtn" id="mainBtn">…</button>
  </div>
  <aside class="record" id="record" style="display:none">
    <div class="record-head">📋 Tally Board
      <span class="small">who collected what — press 🏁 Finish!</span>
    </div>
    <div id="recordGrid"></div>
  </aside>
</div>

<div class="popup" id="popup"></div>

<script>
/* ============ AUDIO (synth effects only — no voice) ============ */
let AC;
let muted=false;
try{muted=localStorage.getItem('bilingo-muted')==='1'}catch(e){}
function initAudio(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}
function tone(f,type,dur,vol=.25,del=0){
  if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,AC.currentTime+del);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+del+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(AC.currentTime+del);o.stop(AC.currentTime+del+dur);
}
function sndCheer(){
  if(muted)return;initAudio();
  const dur=.9,sr=AC.sampleRate,buf=AC.createBuffer(1,sr*dur,sr),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);
  const src=AC.createBufferSource();src.buffer=buf;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.8;
  const g=AC.createGain();g.gain.setValueAtTime(.5,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  src.connect(bp);bp.connect(g);g.connect(AC.destination);src.start();
  for(let i=0;i<5;i++)tone(500+Math.random()*500,'sine',.18,.1,Math.random()*.5);
}
function sndCorrect(){initAudio();tone(523,'sine',.18,.22,0);tone(659,'sine',.18,.22,.09);tone(784,'sine',.25,.28,.18);tone(1047,'sine',.35,.18,.3)}
function sndWrong(){initAudio();tone(160,'square',.35,.18);tone(120,'sawtooth',.25,.12,.12)}
function sndNext(){initAudio();
  const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';
  o.frequency.setValueAtTime(350,AC.currentTime);o.frequency.exponentialRampToValueAtTime(900,AC.currentTime+.12);
  g.gain.setValueAtTime(.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.18);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.18);
}
function sndReveal(){initAudio();tone(660,'triangle',.12,.15,0);tone(880,'triangle',.14,.15,.08);tone(1100,'triangle',.2,.18,.16)}
function sndPop(){initAudio();tone(600,'sine',.12,.13);tone(900,'sine',.1,.1,.06)}

const sndBtn=document.getElementById('sndBtn');
function drawSnd(){sndBtn.textContent=muted?'🔇':'🔊';sndBtn.classList.toggle('off',muted)}
drawSnd();
sndBtn.onclick=()=>{muted=!muted;try{localStorage.setItem('bilingo-muted',muted?'1':'0')}catch(e){}drawSnd();if(!muted){initAudio();sndReveal()}};

/* ============ CONFETTI ============ */
const cvs=document.getElementById('confetti'),cx=cvs.getContext('2d');
let pts=[],afr=null;
function rCvs(){cvs.width=innerWidth;cvs.height=innerHeight}
addEventListener('resize',rCvs);rCvs();
function boom(x,y,n=120){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*14+4;
    pts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,
      col:['#ffe66d','#ff6b6b','#4ecdc4','#45b7d1','#f9ca24','#ff9ff3','#feca57','#00d2d3','#ff6348','#7bed9f'][~~(Math.random()*10)],
      sz:Math.random()*7+3,life:1,rot:Math.random()*360,rs:(Math.random()-.5)*15,
      sh:Math.random()>.4?'r':'c'});}
  if(!afr)aLoop();
}
function fireworks(){
  boom(innerWidth*.25,innerHeight*.3,90);setTimeout(()=>boom(innerWidth*.75,innerHeight*.25,90),180);
  setTimeout(()=>boom(innerWidth*.5,innerHeight*.2,110),360);
}
function aLoop(){cx.clearRect(0,0,cvs.width,cvs.height);
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx;p.vy+=.22;p.y+=p.vy;p.vx*=.99;p.life-=.01;p.rot+=p.rs;
    if(p.life<=0||p.y>cvs.height+30){pts.splice(i,1);continue}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot*Math.PI/180);cx.globalAlpha=Math.min(1,p.life*2.5);cx.fillStyle=p.col;
    if(p.sh==='r')cx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.6);
    else{cx.beginPath();cx.arc(0,0,p.sz/2,0,Math.PI*2);cx.fill()}
    cx.restore();}
  if(pts.length>0)afr=requestAnimationFrame(aLoop);else{afr=null;cx.clearRect(0,0,cvs.width,cvs.height);}
}

/* ============ CHARACTERS ============ */
const CH=[
  {n:'Laki',c:'#6BCB77'},
  {n:'Lele',c:'#FF6B9D'},
  {n:'Nani',c:'#FF8C42'},
  {n:'Ola', c:'#4ECDC4'},
  {n:'Pili',c:'#A29BFE'}
];
CH.forEach(c=>{c.imgSad=c.n+'.png';c.imgHappy=c.n+'-happy.png';c.imgNeutral=c.n+'-neutral.png'});

const SHORT=['tall','short','fast','slow','loud','quiet','brave','kind','strong','smart','old','young','small','big','noisy','lazy','grumpy','fussy','lucky','silly','mean','rude','cool','cute'];
const LONG=['confident','talkative','artistic','energetic','musical','nervous','popular','easygoing','patient','wonderful','talented','clumsy','relieved','worried'];
const SKILLS=['dancing','singing','juggling','doing magic','drawing','running','fishing','doing calligraphy','playing football','sailing'];
const SUP_E={noisy:'noisiest',lazy:'laziest',grumpy:'grumpiest',fussy:'fussiest',lucky:'luckiest',silly:'silliest'};
const CMP_E={noisy:'noisier',lazy:'lazier',grumpy:'grumpier',fussy:'fussier',lucky:'luckier',silly:'sillier'};
function supOf(w){return SUP_E[w]||w+'est'}
function cmpOf(w){return CMP_E[w]||w+'er'}

/* ============ STATE ============ */
let phase='';
let stepN=0;
let roundN=0;
let harder=false;
let usedTasks=[];
let tally={};        // name -> [chip strings]
let reviewDone=false;

const $=id=>document.getElementById(id);
const banner=$('banner'),prompt=$('prompt'),mainBtn=$('mainBtn'),badge=$('badge'),rc=$('rc');

function popup(txt){
  const p=$('popup');p.textContent=txt;p.className='popup show';
  setTimeout(()=>p.className='popup',1300);
}
function solidBanner(html){banner.className='banner solid';banner.innerHTML=`<div class="row">${html}</div>`}
function chipSay(t){banner.className='banner';banner.innerHTML=`<div class="say">${t}</div>`}
function setPrompt(t){prompt.textContent=t}
function setBtn(label,fn,cls){
  mainBtn.className='mainbtn'+(cls?' '+cls:'');
  mainBtn.textContent=label;mainBtn.onclick=fn;
}
function hideBtn(){mainBtn.classList.add('hide')}
function showBtn(){mainBtn.classList.remove('hide')}
function nmSpan(c){return `<span style="color:${c.c}">${c.n}</span>`}

/* =====================================================
   REVIEW — scripted steps, easiest → hardest
   types: info | build | mc | read
===================================================== */
const REVIEW=[

 {type:'build',badge:'👑 Number ONE: the …-est',

function runReviewStep(){
  const st=REVIEW[stepN];
  badge.textContent=st.badge;
  rc.textContent='Review '+(stepN+1)+' / '+REVIEW.length;
  chipSay(st.say);
  setPrompt(st.prompt);
  const box=$('reviewbox');box.innerHTML='';
  hideBtn();
  if(st.type==='info'){
    box.innerHTML=st.html;
    showBtn();setBtn(st.btn||'Next ➡',reviewNext,'green');
    if(st.skippable){
      const sk=document.createElement('button');
      sk.className='mainbtn blue';sk.style.marginLeft='10px';sk.style.display='inline-block';
      sk.textContent=st.skip;
      sk.onclick=reviewNext;
      mainBtn.parentNode&&showBtn();
      box.appendChild(sk);
    }
  }
  if(st.type==='build'){
    buildInteraction(st,box);
  }
  if(st.type==='mc'){
    const opts=document.createElement('div');opts.className='opts';
    st.options.forEach((t,i)=>{
      const b=document.createElement('button');
      b.className='opt';b.textContent=t;
      b.onclick=()=>{
        if(i===st.answer){
          b.classList.add('right');sndCorrect();
          const r=b.getBoundingClientRect();boom(r.left+r.width/2,r.top+r.height/2,110);
          popup(['🎉 YES!','⭐ Perfect!','🏆 Great!'][~~(Math.random()*3)]);
          opts.querySelectorAll('.opt').forEach(o=>o.disabled=true);
          showRule(st.rule,box);
          setPrompt('🗣️ Say it together!');
          setTimeout(()=>{showBtn();setBtn('Next ➡',reviewNext,'green')},900);
        }else{
          b.classList.add('nope');sndWrong();
          setTimeout(()=>b.classList.remove('nope'),500);
        }
      };
      opts.appendChild(b);
    });
    box.appendChild(opts);
  }
  if(st.type==='read'){
    const s=document.createElement('div');s.className='story';s.innerHTML=st.story;
    box.appendChild(s);
    st.questions.forEach(qd=>{
      const qb=document.createElement('div');qb.className='qblock';
      const qq=document.createElement('div');qq.className='qq';qq.textContent=qd.q;
      const qo=document.createElement('div');qo.className='qopts';
      qd.opts.forEach((t,i)=>{
        const b=document.createElement('button');b.className='qopt';b.textContent=t;
        b.onclick=()=>{
          if(i===qd.a){
            b.classList.add('right');sndCorrect();
            const r=b.getBoundingClientRect();boom(r.left+r.width/2,r.top+r.height/2,90);
            qo.querySelectorAll('.qopt').forEach(o=>o.disabled=true);
            sndPop();
          }else{
            b.classList.add('nope');sndWrong();
            setTimeout(()=>b.classList.remove('nope'),500);
          }
        };
        qo.appendChild(b);
      });
      qb.appendChild(qq);qb.appendChild(qo);box.appendChild(qb);
    });
    showBtn();setBtn('Start the GAME! 🎮',startGame,'green');
  }
}

function buildInteraction(st,box){
  const slots=document.createElement('div');slots.className='slots';
  /* ONE gap per TILE (tiles can hold multi-word chunks like "in the class") */
  st.tiles.forEach(()=>{
    const s=document.createElement('div');s.className='slot';s.textContent='?';
    slots.appendChild(s);
  });
  box.appendChild(slots);
  const pool=document.createElement('div');pool.className='pool';
  const words=[...st.tiles,...st.decoys].sort(()=>Math.random()-.5);
  let filled=0;
  const placed=[];
  /* exactly two character names in the sentence? BOTH orders are correct:
     "Nani is more confident than Pili" == "Pili is more confident than Nani" */
  const names=st.tiles.filter(w=>CH.some(c=>c.n===w));
  const swapOK=names.length===2;
  const matches=(w,i)=>{
    if(w===st.tiles[i])return true;
    if(swapOK&&names.includes(w)&&names.includes(st.tiles[i]))return true;
    return false;
  };
  words.forEach(w=>{
    const t=document.createElement('button');t.className='tile';t.textContent=w;
    t.onclick=()=>{
      if(matches(w,filled)){
        t.classList.add('used');sndPop();
        placed.push(w);
        const s=slots.children[filled];
        s.textContent=w;s.classList.add('filled');
        filled++;
        if(filled===st.tiles.length){
          sndCorrect();
          const r=slots.getBoundingClientRect();boom(r.left+r.width/2,r.top+r.height/2,110);
          popup('🎉');
          showRule('✅ '+placed.join(' '),box);
          setPrompt('🗣️ Everyone say it!');
          setTimeout(()=>{showBtn();setBtn('Next ➡',reviewNext,'green')},900);
        }
      }else{
        t.classList.add('nope');sndWrong();
        setTimeout(()=>t.classList.remove('nope'),450);
      }
    };
    pool.appendChild(t);
  });
  box.appendChild(pool);
}

function showRule(html,box){
  const r=document.createElement('div');
  r.className='rule';r.innerHTML=html;
  box.appendChild(r);
  sndReveal();
}

function reviewNext(){
  stepN++;
  if(stepN>=REVIEW.length){startGame();return}
  sndNext();
  runReviewStep();
}

/* =====================================================
   GAME — random generator
===================================================== */
function buildCharCards(){
  const wrap=$('chars');wrap.innerHTML='';wrap.style.display='flex';
  CH.forEach(c=>{
    const d=document.createElement('div');
    d.className='card';d.id='card-'+c.n;
    d.innerHTML=`<img class="avatar" id="av-${c.n}" src="${c.imgNeutral}" alt="">
      <div class="cname" style="color:${c.c}">${c.n}</div>`;
    wrap.appendChild(d);
  });
}
function setCharState(name,state,anim){
  const c=CH.find(x=>x.n===name);
  const img=$('av-'+name),card=$('card-'+name);
  img.src=state==='happy'?c.imgHappy:state==='sad'?c.imgSad:c.imgNeutral;
  card.className='card'+(state==='sad'?' sad':'');
  img.className='avatar a-'+(anim||(state==='happy'?'dance':state==='sad'?'idle':'idle'));
}
function clearPicks(){
  CH.forEach(c=>{
    const card=$('card-'+c.n);
    card.classList.remove('pick','picked');
    card.onclick=null;
  });
}

function buildRecord(){
  $('record').style.display='block';
  const g=$('recordGrid');g.innerHTML='';g.className='record-grid-mobile';
  CH.forEach(c=>{
    const d=document.createElement('div');
    d.className='rec-card';
    d.innerHTML=`<img src="${c.imgNeutral}" alt="${c.n}">
      <div class="rec-name" style="color:${c.c}">${c.n}</div>
      <div class="rec-titles" id="rect-${c.n}"></div>
      <div class="rec-count" id="recn-${c.n}" style="font-size:.7em;font-weight:900;opacity:.8"></div>`;
    g.appendChild(d);
  });
}
function addChip(name,label){
  if(!tally[name])tally[name]=[];
  tally[name].push(label);
  const chip=document.createElement('span');
  chip.className='rec-chip';chip.textContent=label;
  $('rect-'+name).appendChild(chip);
  $('recn-'+name).textContent='🏅 '+tally[name].length;
  sndPop();
}

/* weighted draw: 60% long-adj / skills, 40% short — no repeats within a loop */
function drawTask(){
  const mk=(kind,w)=>({kind,w,id:kind+':'+w});
  const all=[...LONG.map(w=>mk('adjL',w)),...SKILLS.map(s=>mk('skill',s)),...SHORT.map(w=>mk('adjS',w))];
  if(usedTasks.length>=all.length)usedTasks=[];
  let pool=all.filter(t=>!usedTasks.includes(t.id));
  const pool60=pool.filter(t=>t.kind!=='adjS');
  const pool40=pool.filter(t=>t.kind==='adjS');
  let t;
  const r=Math.random();
  if(r<.6&&pool60.length)t=pool60[~~(Math.random()*pool60.length)];
  else if(pool40.length)t=pool40[~~(Math.random()*pool40.length)];
  else t=pool[~~(Math.random()*pool.length)];
  usedTasks.push(t.id);
  return t;
}

function startGame(){
  reviewDone=true;
  phase='game';
  roundN=0;
  $('skipReviewBtn').style.display='none';
  $('reviewbox').innerHTML='';
  buildCharCards();
  buildRecord();
  $('finishBtn').disabled=false;
  $('finishBtn').onclick=finishGame;
  newRound();
}

function newRound(){
  roundN++;
  rc.textContent='Round '+roundN;
  clearPicks();
  CH.forEach(c=>setCharState(c.n,'neutral','idle'));
  const task=drawTask();
  const isSuper=Math.random()<.5;
  const useLess=harder&&Math.random()<.4;

  let say,chip,after;
  if(task.kind==='skill'){
    if(isSuper){
      say=useLess?`Who is <span style="color:#ffd700">the worst at ${task.w}</span>?`
                 :`Who is <span style="color:#ffd700">the best at ${task.w}</span>?`;
      chip=useLess?'the worst at '+task.w:'the best at '+task.w;
    }else{
      const two=pickTwo();
      say=useLess?`Who is <span style="color:#ffd700">worse at ${task.w}</span> — ${nmSpan(two[0])} or ${nmSpan(two[1])}?`
                 :`Who is <span style="color:#ffd700">better at ${task.w}</span> — ${nmSpan(two[0])} or ${nmSpan(two[1])}?`;
      chip=useLess?'worse at '+task.w:'better at '+task.w;
      task.two=two;
    }
    badge.textContent='🎯 '+task.w;
  }else{
    const w=task.w,long=task.kind==='adjL';
    if(isSuper){
      say=long
        ?(useLess?`Who is <span style="color:#ffd700">the least ${w}</span>?`:`Who is <span style="color:#ffd700">the most ${w}</span>?`)
        :(useLess?`Who is <span style="color:#ffd700">the least ${w}</span> in the class?`:`Who is <span style="color:#ffd700">the ${supOf(w)}</span> in the class?`);
      chip=long?(useLess?'the least '+w:'the most '+w):(useLess?'the least '+w:'the '+supOf(w));
    }else{
      const two=pickTwo();
      say=long
        ?(useLess?`Who is <span style="color:#ffd700">less ${w}</span> — ${nmSpan(two[0])} or ${nmSpan(two[1])}?`:`Who is <span style="color:#ffd700">more ${w}</span> — ${nmSpan(two[0])} or ${nmSpan(two[1])}?`)
        :(useLess?`Who is <span style="color:#ffd700">less ${w} than</span>… ${nmSpan(two[0])} or ${nmSpan(two[1])}?`:`Who is <span style="color:#ffd700">${cmpOf(w)}</span> — ${nmSpan(two[0])} or ${nmSpan(two[1])}?`);
      chip=long?(useLess?'less '+w:'more '+w):(useLess?'less '+w:cmpOf(w));
      task.two=two;
    }
    badge.textContent=(long?'🌟 ':'⚡ ')+w;
  }
  task.isSuper=isSuper;
  task.chip=chip;
  task.useLess=useLess;
  chipSay('🎤 Make a question!');
  banner.innerHTML+=`<div class="row" style="opacity:.55;font-size:.8em">…then tap to REVEAL</div>`;
  setPrompt('🗣️ Everyone ask the question!');
  showBtn();setBtn('Reveal Question 👀',()=>phaseReveal(task),'');

  function phaseReveal(task){
    phase='revealQ';sndReveal();
    solidBanner(say);
    setPrompt('🤔 You decide! There is NO wrong answer — TAP!');
    if(task.isSuper){
      CH.forEach(c=>{
        const card=$('card-'+c.n);
        card.classList.add('pick');
        card.onclick=()=>choose(task,c.n);
      });
    }else{
      task.two.forEach(c=>{
        const card=$('card-'+c.n);
        card.classList.add('pick');
        card.onclick=()=>choose(task,c.n);
      });
    }
    hideBtn();
  }
}

function pickTwo(){
  const s=[...CH].sort(()=>Math.random()-.5);
  return [s[0],s[1]];
}

function choose(task,name){
  if(phase!=='revealQ')return;
  phase='chosen';initAudio();
  clearPicks();
  const winner=CH.find(c=>c.n===name);
  /* winner celebrates; the other candidates look sad; everyone else stays neutral */
  setCharState(name,'happy','dance');
  const others=task.isSuper?CH.filter(c=>c.n!==name):task.two.filter(c=>c.n!==name);
  others.forEach(c=>setCharState(c.n,'sad','idle'));
  $('card-'+name).classList.add('picked');
  sndCorrect();sndCheer();
  const card=$('card-'+name),r=card.getBoundingClientRect();
  boom(r.left+r.width/2,r.top+r.height/2,140);
  popup(['🎉 YES!','⭐ Wonderful!','🏆 Amazing!','💪 Super!','🔥 Bravo!'][~~(Math.random()*5)]);
  addChip(name,task.chip);

  let ans;
  if(task.isSuper)ans=`We think ${nmSpan(winner)} is <span style="color:#ffd700">${task.chip}</span>!`;
  else{
    const other=task.two.find(c=>c.n!==name);
    /* comparative chips all read "… than" in the sentence */
    ans=`We think ${nmSpan(winner)} is <span style="color:#ffd700">${task.chip}</span> than ${nmSpan(other)}!`;
  }
  solidBanner(ans);
  setPrompt('🗣️ Everyone say the full sentence!');
  setTimeout(()=>{showBtn();setBtn('Next ➡',newRound,'green')},1400);
}

/* ============ FINISH — podium ============ */
function finishGame(){
  phase='podium';
  hideBtn();
  clearPicks();
  $('record').style.display='none';
  const sorted=[...CH].sort((a,b)=>(tally[b.n]||[]).length-(tally[a.n]||[]).length);
  const max=Math.max(1,(tally[sorted[0].n]||[]).length);
  let html='<div class="podium">';
  sorted.forEach((c,i)=>{
    const n=(tally[c.n]||[]).length;
    const h=40+Math.round(180*n/max);
    html+=`<div class="pcol">
      ${i===0&&n>0?'<div class="crown">👑</div>':'<div style="height:1.6em"></div>'}
      <img src="${n>0?c.imgHappy:c.imgSad}" alt="${c.n}">
      <div class="pname" style="color:${c.c}">${c.n}</div>
      <div class="pcount">${n} 🏅</div>
      <div class="pstep" style="height:${h}px;animation-delay:${i*.12}s">${i+1}</div>
    </div>`;
  });
  html+='</div>';
  $('chars').style.display='none';
  $('reviewbox').innerHTML=html;
  badge.textContent='🏁 Final Results!';
  solidBanner('Our champions today! 🏆');
  setPrompt('🗣️ Make sentences: "Ola is the noisiest — 5 medals!"');
  rc.textContent='Done';
  fireworks();sndCheer();
  setTimeout(fireworks,1200);
  setBtn('▶ Play Again',resetAll,'green');showBtn();
}

function resetAll(){
  usedTasks=[];tally={};roundN=0;stepN=0;
  $('reviewbox').innerHTML='';
  $('record').style.display='none';
  startGame();
}

/* ============ HARDER MODE ============ */
const hardBtn=$('hardBtn');
function drawHard(){hardBtn.textContent='😈 harder: '+(harder?'ON':'OFF');hardBtn.classList.toggle('on',harder)}
drawHard();
hardBtn.onclick=()=>{
  harder=!harder;drawHard();initAudio();
  if(harder){sndReveal();popup('😈');setPrompt('😈 Harder mode: now with "less … than" and "the least …"!')}
  else setPrompt(phase==='game'?'🤔 You decide! There is NO wrong answer — TAP!':'…');
};

/* ============ GO ============ */
$('skipReviewBtn').onclick=()=>{ if(!reviewDone){ sndNext(); startGame(); } };
runReviewStep();
</script>

<script>
(function () {
  if (window.__bilingoUI) return;
  window.__bilingoUI = true;
  var bar = document.getElementById('bilingo-ui');
  var pct = bar.querySelector('.b-pct');
  var MIN = 0.5, MAX = 2.5, STEP = 0.1, KEY = 'bilingo-zoom';
  var z = parseFloat(localStorage.getItem(KEY) || '1');
  if (isNaN(z)) z = 1;
  z = Math.min(MAX, Math.max(MIN, z));

  function apply() {
    document.documentElement.style.setProperty('zoom', z);
    pct.textContent = Math.round(z * 100) + '%';
  }
  function shrink() {
    z = Math.max(MIN, Math.round((z - STEP) * 100) / 100);
    localStorage.setItem(KEY, z); apply();
  }
  function grow() {
    z = Math.min(MAX, Math.round((z + STEP) * 100) / 100);
    localStorage.setItem(KEY, z); apply();
  }
  function toggleFS() {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(function () {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
  }

  bar.querySelector('.b-plus').addEventListener('click', grow);
  bar.querySelector('.b-minus').addEventListener('click', shrink);
  bar.querySelector('.b-fs').addEventListener('click', toggleFS);
  bar.querySelector('.b-handle').addEventListener('click', function () {
    bar.classList.remove('mini');
    poke();
  });

  // Collapse to just the handle after 5s without interaction, so the bar
  // never sits on top of the game's own buttons.
  var idleTimer = null;
  function poke() {
    bar.classList.remove('mini');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { bar.classList.add('mini'); }, 5000);
  }
  bar.addEventListener('pointerdown', poke);
  poke();
  apply();
})();
</script>

</body>
</html>
